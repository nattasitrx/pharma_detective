<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>เจ็ดวันของลุงหลี่ · วันที่ 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&family=Noto+Serif+Thai:wght@400;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbf3e4;--ink:#4a3528;--soft:#8a6f5c;--terra:#c8694a;--amber:#e9a646;--teal:#5f8f8a;--wood:#a8754f;--wood2:#8a5b3c;--wall:#f6e3c5;
  --sky1:#2b2f55;--sky2:#6b5a7a;--tint:rgba(40,36,80,.55);--shaft:0;--lamp:0;--sun:#ffd9a0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2a211c;color:var(--ink);font-family:'Noto Serif Thai','Sarabun',serif;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{position:relative;margin:0 auto;height:100dvh;max-width:480px;display:flex;flex-direction:column;background:var(--paper);overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.5)}
#view{position:relative;flex:0 0 auto;width:100%;aspect-ratio:400/400;max-height:58dvh;overflow:hidden;background:#1d1830}
#view svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene{opacity:0;transition:opacity 1.2s ease;pointer-events:none}.scene.on{opacity:1;pointer-events:auto}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.16;mix-blend-mode:multiply}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,rgba(20,10,10,0) 20%,rgba(20,10,10,.96) 78%);opacity:0;transition:opacity .25s linear}
#black{position:absolute;inset:0;background:#15110f;opacity:1;transition:opacity 1.6s ease;pointer-events:none;z-index:5}
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font:600 14px/1 'Sarabun',sans-serif;color:#fff8ea;text-shadow:0 1px 6px rgba(0,0,0,.55);z-index:4;opacity:0;transition:opacity 1s}
#hud.on{opacity:1}
#hud .r{display:flex;gap:12px;align-items:center}
#en{display:flex;gap:4px;align-items:center}#en i{width:9px;height:9px;border-radius:50%;background:rgba(255,248,234,.28);transition:background .6s,transform .6s}#en i.f{background:var(--amber);box-shadow:0 0 8px rgba(233,166,70,.9)}
#en.bump i.f{transform:scale(1.5)}
#panel{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:18px 24px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(var(--paper),#f5e8d2)}
#panel::before{content:"";position:absolute;left:0;right:0;top:-18px;height:18px;background:linear-gradient(rgba(251,243,228,0),var(--paper))}
#txt{font-size:19px;line-height:1.75;min-height:3.4em;white-space:pre-line;opacity:0;transform:translateY(6px);transition:opacity .55s ease,transform .55s ease}
#txt.on{opacity:1;transform:none}
#txt.q{color:var(--soft);font-style:italic}
#more{position:absolute;right:22px;bottom:calc(12px + env(safe-area-inset-bottom));font-size:14px;color:var(--terra);opacity:0;animation:bob 1.6s ease-in-out infinite}
#more.on{opacity:.9}
@keyframes bob{50%{transform:translateY(4px)}}
#acts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
#acts:empty{display:none}
.btn{appearance:none;border:0;border-radius:16px;padding:13px 18px;font:600 17px/1.45 'Sarabun',sans-serif;color:var(--ink);background:#fff;box-shadow:0 2px 0 #e3d0b3,0 6px 18px rgba(120,80,40,.12);text-align:left;cursor:pointer;opacity:0;transform:translateY(8px);animation:rise .5s ease forwards;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn small{display:block;font-weight:400;font-size:13.5px;color:var(--soft);margin-top:2px}
.btn.dis{opacity:.45!important;pointer-events:none}
.btn.go{background:var(--terra);color:#fff;text-align:center;box-shadow:0 2px 0 #9c4c33,0 8px 20px rgba(200,105,74,.35)}
@keyframes rise{to{opacity:1;transform:none}}
/* hold button */
#holdW{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:12px}
#hold{position:relative;width:104px;height:104px;border-radius:50%;border:0;background:conic-gradient(var(--amber) calc(var(--p,0)*1turn),#ecdcc0 0);cursor:pointer;touch-action:none;transition:transform .15s}
#hold::after{content:"";position:absolute;inset:9px;border-radius:50%;background:#fffaf0;box-shadow:inset 0 2px 8px rgba(120,80,40,.15)}
#hold span{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;font:600 15px/1.3 'Sarabun',sans-serif;color:var(--ink);text-align:center;padding:16px}
#hold.down{transform:scale(.95)}
#hold.lock{filter:grayscale(.7);opacity:.6}
#holdL{font:400 14px/1.4 'Sarabun',sans-serif;color:var(--soft);text-align:center;min-height:1.4em}
/* hotspots */
.hot{cursor:pointer}.hot .glow{display:none}
#room.free .hot:not(.quiet):not(.done){animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 2px rgba(255,255,255,.9)) drop-shadow(0 0 7px rgba(255,214,138,.95))}50%{filter:drop-shadow(0 0 1px rgba(255,255,255,.5)) drop-shadow(0 0 3px rgba(255,214,138,.5))}}
#tail{transform-origin:214px 316px;animation:wag 1.1s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(18deg)}}
#dog.sleep #tail{animation:none}
.mote{animation:drift 9s linear infinite;opacity:calc(var(--shaft)*.8)}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(18px,-46px)}}
#lee{transition:transform 2.2s ease-in-out}
#shimmer{opacity:0;transition:opacity 2s}#shimmer.on{opacity:.5;animation:shim 3s ease-in-out infinite}
@keyframes shim{50%{transform:translateY(-3px) skewX(1.5deg)}}
/* close-up cards */
#card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(30,20,14,.55);opacity:0;pointer-events:none;transition:opacity .7s;z-index:3;backdrop-filter:blur(2px)}
#card.on{opacity:1;pointer-events:auto}
#card .in{width:84%;border-radius:22px;background:var(--paper);padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
#card svg{width:100%;height:auto;display:block}
.blur{filter:blur(5px);transition:filter 1.6s ease}.blur.focus{filter:blur(0)}
#dial{width:100%;margin:14px 0 4px;accent-color:var(--terra)}
.heart{position:absolute;font-size:22px;animation:hup 1.4s ease-out forwards;pointer-events:none;z-index:4}
@keyframes hup{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-60px) scale(1.2)}}
/* title + diary */
#title,#diary{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:radial-gradient(ellipse at 50% 30%,#f7c98d,#e39a62 45%,#7a4a48 100%);color:#fff8ea;transition:opacity 1.4s ease}
#title h1{font:600 38px/1.3 'Noto Serif Thai',serif;margin:0 0 6px;text-shadow:0 2px 20px rgba(90,40,20,.5)}
#title .sub{font:400 17px/1.6 'Sarabun',sans-serif;opacity:.92}
#title .day{margin:26px 0 30px;font:600 15px/1 'Sarabun',sans-serif;letter-spacing:.18em;border:1px solid rgba(255,248,234,.6);border-radius:99px;padding:9px 18px}
#title .btn{animation-delay:.6s;min-width:180px}
#title .ear{margin-top:18px;font:400 13.5px/1.5 'Sarabun',sans-serif;opacity:.8}
#diary{background:#efe0c4;color:var(--ink);opacity:0;pointer-events:none}
#diary.on{opacity:1;pointer-events:auto}
#diary .pg{width:100%;max-width:360px;background:repeating-linear-gradient(#fffaf0 0 33px,#e9d9bd 33px 34px);border-radius:6px;padding:20px 24px 26px;box-shadow:0 14px 40px rgba(90,60,30,.3);transform:rotate(-1.2deg);font:400 19px/34px 'Mali',cursive;text-align:left}
#diary .pg b{display:block;font-weight:600;color:var(--terra)}
#diary .pg p{margin:0;opacity:0;animation:rise .9s ease forwards}
#diary .next{margin:26px 0 16px;font:600 15px/1.6 'Sarabun',sans-serif;color:var(--soft)}
.hidden{display:none!important}
@media (min-width:481px){#app{border-radius:26px;height:min(100dvh,900px);margin-top:max(0px,calc((100dvh - 900px)/2))}}
</style>
</head>

      <g id="dog2" class="hidden" transform="translate(70,0)"><ellipse cx="0" cy="254" rx="16" ry="8" fill="#2b2623"/><circle cx="15" cy="246" r="7" fill="#2b2623"/><path d="M10 241l-2-6 6 3zM18 240l4-6 1 7z" fill="#2b2623"/><path d="M-9 260v5M8 260v5" stroke="#2b2623" stroke-width="4" stroke-linecap="round"/><path d="M-15 250q-7-6-4-12" stroke="#2b2623" stroke-width="4" fill="none" stroke-linecap="round"/></g>

    <h1>เจ็ดวันของลุงหลี่</h1>
    <div class="sub">ลุงหลี่อายุแปดสิบแปด อยู่ชั้นสี่ กับหมาหนึ่งตัว<br>นี่คือหนึ่งสัปดาห์ของเขา</div>

</div>
<script>
'use strict';
const $=s=>document.querySelector(s), sleep=ms=>new Promise(r=>setTimeout(r,ms));
const FAST=/[?&]fast=1/.test(location.search);   // for testing: no waits
const W=ms=>sleep(FAST?Math.min(ms,30):ms);
const S={en:5, money:320, meds:false, sour:false, bought:false, ac:false, coughs:0, walked:false, dbl:false, seen:{}};

/* ---------------- sound (all made here: no files) ---------------- */
let AC=null, master=null, fanG=null, staticG=null;
function audio(){ if(AC) return; try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=.9; master.connect(AC.destination);
  const buf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate), d=buf.getChannelData(0); let last=0; for(let i=0;i<d.length;i++){ const w=Math.random()*2-1; last=(last+.02*w)/1.02; d[i]=last*3.2; }
  const src=AC.createBufferSource(); src.buffer=buf; src.loop=true; const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=320; fanG=AC.createGain(); fanG.gain.value=0; src.connect(lp); lp.connect(fanG); fanG.connect(master); src.start();
  const wb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate), wd=wb.getChannelData(0); for(let i=0;i<wd.length;i++) wd[i]=Math.random()*2-1;
  const ws=AC.createBufferSource(); ws.buffer=wb; ws.loop=true; const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2400; bp.Q.value=.6; staticG=AC.createGain(); staticG.gain.value=0; ws.connect(bp); bp.connect(staticG); staticG.connect(master); ws.start(); AC._w=wb; }catch(e){ AC=null; } }
function ramp(g,v,t){ if(!AC||!g) return; g.gain.cancelScheduledValues(AC.currentTime); g.gain.linearRampToValueAtTime(v,AC.currentTime+(t||1)); }
function note(f,dur,vol,type,when){ if(!AC) return; const t=AC.currentTime+(when||0), o=AC.createOscillator(), g=AC.createGain(); o.type=type||'sine'; o.frequency.value=f;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.12,t+.02); g.gain.exponentialRampToValueAtTime(.0008,t+(dur||.8)); o.connect(g); g.connect(master); o.start(t); o.stop(t+(dur||.8)+.05); }
const N={C4:261.6,D4:293.7,E4:329.6,G4:392,A4:440,C5:523.3,D5:587.3,E5:659.3,G5:784,A3:220,G3:196,E3:164.8,C3:130.8};
const sfx={ tap(){ note(N.E5,.25,.05); }, soft(){ note(N.C5,.5,.06); note(N.G4,.6,.04,'sine',.08); }, warm(){ [N.C4,N.E4,N.G4,N.C5].forEach((f,i)=>note(f,1.4,.06,'sine',i*.09)); },
  low(){ note(N.A3,1.2,.07,'triangle'); note(N.E3,1.5,.06,'sine',.1); }, tick(){ note(1800,.03,.03,'square'); }, beat(){ note(58,.16,.22,'sine'); note(52,.2,.16,'sine',.14); },
  cough(){ if(!AC) return; for(let k=0;k<3;k++){ const s=AC.createBufferSource(); s.buffer=AC._w; const g=AC.createGain(), f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=700+k*120; f.Q.value=1.2; const t=AC.currentTime+k*.26;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.34,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+.19); s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+.22); } },
  puff(){ if(!AC) return; const s=AC.createBufferSource(); s.buffer=AC._w; const g=AC.createGain(), f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=3000; const t=AC.currentTime; g.gain.setValueAtTime(.2,t); g.gain.exponentialRampToValueAtTime(.001,t+.3); s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+.32); } };
/* the old tune on the radio: an original little waltz */
const TUNE=[['E4',1],['G4',1],['A4',1],['C5',2],['A4',1],['G4',2],['E4',1],['D4',3],['E4',1],['G4',1],['A4',1],['D5',2],['C5',1],['A4',2],['G4',1],['C5',3],['E5',2],['D5',1],['C5',2],['A4',1],['G4',2],['E4',1],['G4',3],['A4',1],['G4',1],['E4',1],['D4',2],['E4',1],['C4',3]];
function playTune(){ if(!AC) return 9000; let t=0; const b=.42; TUNE.forEach(([n,l])=>{ note(N[n],l*b+.5,.085,'triangle',t); note(N[n]/2,l*b+.3,.03,'sine',t); t+=l*b; }); return t*1000; }

/* ---------------- screen helpers ---------------- */
const PH={ dawn:['#3a3a6a','#e9a58a','rgba(60,50,110,.42)',.25,0,'#ffd0a8',[112,150]], morning:['#8fc3dd','#f6e3c0','rgba(255,220,170,.08)',.8,0,'#fff3c4',[118,96]], noon:['#7fc0e6','#e8f0e0','rgba(255,240,200,.04)',1,0,'#fffbe6',[92,70]],
  after:['#8fc0d8','#f7dba8','rgba(255,200,130,.12)',.7,0,'#ffe9b0',[66,96]], dusk:['#5a4a7a','#f29a5c','rgba(230,120,60,.26)',.45,.25,'#ff9a52',[58,150]], night:['#151a3a','#2b2f55','rgba(20,22,60,.6)',0,1,'#e8ecff',[120,84]], dark:['#0d1026','#1b1e3c','rgba(8,10,30,.86)',0,0,'#c8d0ff',[120,84]] };
function phase(p){ const v=PH[p], r=document.documentElement.style; r.setProperty('--sky1',v[0]); r.setProperty('--sky2',v[1]); r.setProperty('--tint',v[2]); r.setProperty('--shaft',v[3]); r.setProperty('--lamp',v[4]); r.setProperty('--sun',v[5]);
  const s=$('#sunm'); s.style.cx=v[6][0]; s.style.cy=v[6][1]; }
function clock(t){ $('#clock').textContent='วันอังคาร · '+t; }
function hud(){ $('#en').innerHTML='<span style="margin-right:4px;opacity:.85">แรง</span>'+Array.from({length:5},(_,i)=>`<i class="${i<S.en?'f':''}"></i>`).join(''); $('#money').textContent='NT$ '+S.money; }
function energy(d){ S.en=Math.max(0,Math.min(5,S.en+d)); hud(); const e=$('#en'); e.classList.add('bump'); setTimeout(()=>e.classList.remove('bump'),600); if(d<0) sfx.low(); }
function scene(id){ document.querySelectorAll('.scene').forEach(s=>s.classList.toggle('on',s.id===id)); }
async function black(on,ms){ const b=$('#black'); b.style.transitionDuration=(FAST?30:(ms||1600))+'ms'; b.style.opacity=on?1:0; await W(ms||1600); }
function leeTo(x,y){ $('#lee').setAttribute('transform',`translate(${x},${y})`); }
let tapRes=null;
$('#panel').addEventListener('click',e=>{ if(e.target.closest('.btn,#hold,#dial')) return; if(tapRes){ const r=tapRes; tapRes=null; r(); } });
async function say(t,o){ const el=$('#txt'), list=[].concat(t);
  for(const line of list){ el.classList.remove('on'); $('#more').classList.remove('on'); await W(el.textContent?420:60); el.textContent=line; el.classList.toggle('q',!!(o&&o.q)); el.classList.add('on');
    if(o&&o.stay) return; await W(650); $('#more').classList.add('on'); if(FAST){ await sleep(20); } else await new Promise(r=>tapRes=r); sfx.tap(); }
  $('#more').classList.remove('on'); }
function clearTxt(){ $('#txt').classList.remove('on'); $('#more').classList.remove('on'); }
function choose(opts){ return new Promise(res=>{ const a=$('#acts'); a.innerHTML=opts.map((o,i)=>`<button class="btn${o.dis?' dis':''}${o.go?' go':''}" data-i="${i}" style="animation-delay:${.15+i*.12}s">${o.t}${o.s?`<small>${o.s}</small>`:''}</button>`).join('');
  a.querySelectorAll('.btn').forEach(b=>b.onclick=()=>{ sfx.soft(); a.innerHTML=''; res(+b.dataset.i); }); if(FAST) setTimeout(()=>{ const b=a.querySelector('.btn:not(.dis)'); const pick=window.__pick; const el=(pick!=null&&a.querySelector(`.btn[data-i="${pick(opts)}"]:not(.dis)`))||b; if(el) el.click(); },30); }); }
/* hold: fill while pressed, slide back when released */
function hold(label, ms, hint){ return new Promise(res=>{ const a=$('#acts'); a.innerHTML=`<div id="holdW"><button id="hold"><span>${label}</span></button><div id="holdL">${hint||''}</div></div>`;
  const b=$('#hold'); let p=0, down=false, last=performance.now(), done=false;
  const set=d=>{ down=d; b.classList.toggle('down',d); }; b.onpointerdown=e=>{ e.preventDefault(); set(true); audio(); }; b.onpointerup=b.onpointerleave=b.onpointercancel=()=>set(false);
  if(FAST) down=true;
  (function loop(now){ if(done) return; const dt=now-last; last=now; p=Math.max(0,Math.min(1,p+(down?dt/(FAST?60:ms):-dt/(ms*.7)))); b.style.setProperty('--p',p);
    if(p>=1){ done=true; sfx.warm(); a.innerHTML=''; res(); return; } requestAnimationFrame(loop); })(last); }); }
function card(html){ $('#cardIn').innerHTML=html; $('#card').classList.add('on'); } function cardOff(){ $('#card').classList.remove('on'); }
function hearts(n){ const v=$('#view').getBoundingClientRect(); for(let i=0;i<(n||3);i++) setTimeout(()=>{ const h=document.createElement('div'); h.className='heart'; h.textContent='🤍'; h.style.left=(v.width*.55+Math.random()*50)+'px'; h.style.top=(v.height*.72)+'px'; $('#view').appendChild(h); setTimeout(()=>h.remove(),1500); },i*220); }

/* ---------------- walking: hold to walk, let go to breathe ---------------- */
function walk({stairs, limit, total}){ return new Promise(res=>{ const a=$('#acts'), N=total||23; a.innerHTML=`<div id="holdW"><button id="hold"><span>กดค้าง<br>เพื่อเดิน</span></button><div id="holdL"></div></div>`;
  const b=$('#hold'), L=$('#holdL'), lee=$('#lee2'), dog=$('#dog2'), vig=$('#vig'); let prog=0, breath=1, down=false, lock=0, last=performance.now(), done=false, coughs=0, beatT=0, told=0;
  b.onpointerdown=e=>{ e.preventDefault(); if(!lock){ down=true; b.classList.add('down'); } }; b.onpointerup=b.onpointerleave=b.onpointercancel=()=>{ down=false; b.classList.remove('down'); };
  const pos=()=>{ if(stairs){ const x=40+prog*300, y=prog*190-110; lee.setAttribute('transform',`translate(${x},${y})`); dog.setAttribute('transform',`translate(${x+34},${y})`); } else lee.setAttribute('transform',`translate(${30+prog*290},0)`); };
  (function loop(now){ if(done) return; let dt=Math.min(60,now-last); last=now; if(FAST){ dt=400; down=breath>.4&&!lock; }
    if(lock>0){ lock-=dt; if(lock<=0){ lock=0; b.classList.remove('lock'); L.textContent='ค่อยๆ นะ… เดินทีละนิด แล้วหยุดหายใจ'; } }
    else if(down){ prog+=dt/(stairs?15000:13000); breath-=dt/(stairs?2300:2900); beatT-=dt; if(beatT<=0){ sfx.beat(); beatT=260+breath*620; } }
    else breath=Math.min(1,breath+dt/3400);
    if(breath<=0&&!lock){ breath=.12; lock=2600; down=false; coughs++; prog=Math.max(0,prog-.05); b.classList.remove('down'); b.classList.add('lock'); sfx.cough(); L.textContent='แค่ก… แค่ก… ต้องหยุดก่อน'; }
    b.style.setProperty('--p',breath); vig.style.opacity=Math.pow(1-breath,1.4).toFixed(2); pos();
    if(!lock){ const st=Math.min(N,Math.round(prog*N)); if(!stairs) L.textContent=down?`ก้าวที่ ${st} จาก ${N}`:(breath<.98&&prog>0?'หยุดพัก… หายใจ…':(told++<1?'กดค้างไว้เพื่อเดิน ปล่อยมือเพื่อหยุดหายใจ':L.textContent)); else L.textContent=down?'ทีละขั้น…':(prog>0?'เกาะราวไว้… หายใจ…':'กดค้างไว้เพื่อลงบันได'); }
    if(prog>=(limit||1)){ done=true; a.innerHTML=''; vig.style.opacity=limit?.55:0; res({coughs}); return; } requestAnimationFrame(loop); })(last); }); }
function hallSetup(stairs){ const g=$('#hallDoors'), st=$('#stairs'); $('#hallEnd').classList.toggle('hidden',!!stairs); st.classList.toggle('hidden',!stairs); $('#dog2').classList.toggle('hidden',!stairs);
  if(stairs){ g.innerHTML=''; let h='<rect width="400" height="400" fill="#e7d3b0"/>'; for(let k=0;k<12;k++){ const x=30+k*28, y=152+k*17.5; h+=`<rect x="${x}" y="${y}" width="30" height="${400-y}" fill="${k%2?'#b3a79b':'#a69a8e'}"/>`; }
      h+='<path d="M20 106L372 326" stroke="#6e452b" stroke-width="5" stroke-linecap="round"/><text x="330" y="60" text-anchor="middle" font-family="Sarabun" font-weight="600" font-size="26" fill="#c9b08a">4F</text>'; st.innerHTML=h; $('#hallTint').setAttribute('fill','rgba(240,140,70,.2)'); $('#lee2').setAttribute('transform','translate(40,-110)'); $('#dog2').setAttribute('transform','translate(74,-110)'); }
  else { g.innerHTML=[96,176,256].map(x=>`<rect x="${x}" y="158" width="44" height="108" rx="3" fill="#a8754f"/><circle cx="${x+8}" cy="214" r="2.6" fill="#e9a646"/><rect x="${x+12}" y="170" width="20" height="12" rx="2" fill="#f3e3c8" opacity=".7"/>`).join(''); $('#hallTint').setAttribute('fill','rgba(255,190,120,0)'); $('#lee2').setAttribute('transform','translate(30,0)'); } }

/* ---------------- Day 1 ---------------- */
async function day1(){
  Object.assign(S,{en:5, money:320, meds:false, sour:false, bought:false, ac:false, coughs:0, walked:false, dbl:false, seen:{}}); hud(); phase('dark'); scene('room'); leeTo(-40,34); $('#dog').classList.add('sleep');
  await W(900);
  await say(['ตีห้าสี่สิบ','ผมตื่นก่อนนาฬิกาปลุกเสมอ\nเป็นมาตั้งแต่สมัยอยู่กองทัพ','แต่การตื่น กับการลุก\nเดี๋ยวนี้เป็นคนละเรื่องกัน']);
  await say('หนึ่ง… สอง…',{stay:1,q:1});
  await hold('กดค้าง<br>เพื่อลุกนั่ง', 3600, 'ถ้าปล่อยมือ ลุงจะเอนกลับลงไป');
  phase('dawn'); clock('05:52'); $('#hud').classList.add('on'); ramp(fanG,.05,3); await black(false,2400); leeTo(0,0); $('#dog').classList.remove('sleep');
  await say(['…สาม ได้แล้ว','เสี่ยวเฮยรออยู่ข้างเตียงแล้ว\nหางตีพื้นดังตุบ ตุบ','ห้องนี้สิบหกตารางเมตร\nพอดีสำหรับคนหนึ่งคน กับหมาหนึ่งตัว']);
  await morning();
  await toilet();
  await noon();
  await radio();
  await evening();
  await dinner();
  await night();
}
/* the morning: tap things in the room. The phone and the pot move the day on; the pillbox does not call for attention */
async function morning(){
  phase('morning'); clock('06:40'); const room=$('#room'); const need=()=>S.seen.phone&&S.seen.pot;
  while(!need()){
    await say(S.seen.any?'…':'เช้าแล้ว\n(แตะสิ่งของในห้อง)',{stay:1,q:1}); S.seen.any=1; room.classList.add('free');
    const h=await new Promise(res=>{ const hs=[...room.querySelectorAll('.hot')]; hs.forEach(g=>g.onclick=()=>{ hs.forEach(x=>x.onclick=null); res(g.dataset.h); });
      if(FAST) setTimeout(()=>{ const o=(window.__order||['dog','phone','pot']).find(k=>!S.seen[k]); room.querySelector(`.hot[data-h="${o}"]`).dispatchEvent(new Event('click')); },30); });
    room.classList.remove('free'); sfx.soft(); const el=room.querySelector(`.hot[data-h="${h}"]`); const first=!S.seen[h]; S.seen[h]=1; if(h!=='window') el.classList.add('done');
    if(h==='dog'){ hearts(3); await say(first?['ผมลูบหัวมัน มันหลับตาพริ้ม','เสี่ยวเฮยสิบสี่ปีแล้ว\nถ้านับเป็นคน ก็คงรุ่นราวคราวเดียวกับผม']:['มันเอาคางมาเกยที่เข่าผม']); }
    else if(h==='photo'){ await say(first?['ซิ่วหลาน\nรูปนี้ถ่ายวันที่เราแต่งงาน','เธอไปก่อนผมหกปีแล้ว','ผมยังบอกอรุณสวัสดิ์เธอทุกเช้า\nเธอไม่เคยตอบ แต่ก็ไม่เคยว่าอะไร']:['อรุณสวัสดิ์ ซิ่วหลาน']); }
    else if(h==='window'){ await say(first?['ข้างล่างมีเสียงรถขายน้ำเต้าหู้\nจากชั้นสี่ ได้ยินแต่ไม่เคยลงไปทัน']:['ถนนยังอยู่ที่เดิม']); }
    else if(h==='radio'){ ramp(staticG,.05,.3); await say(first?['ซ่า… ซ่า…\nตอนเช้ามีแต่ข่าว','รายการเพลงเก่ามาตอนสี่โมงเย็น\nผมรอได้']:['ยังไม่ถึงเวลา']); ramp(staticG,0,.6); el.classList.remove('done'); }
    else if(h==='pillbox'){ if(!S.meds){ S.meds=true; await say(['กล่องยา ช่อง "อังคาร – เช้า"','เจ็ดเม็ด\nกลืนทีละเม็ด กับน้ำอุ่นหนึ่งแก้ว','วันนี้ผมจำได้เอง']); } else await say(['ช่องเช้าว่างแล้ว']); }
    else if(h==='phone'){ await phone(); }
    else if(h==='pot'){ await pot(); }
  }
}
async function phone(){ clock('06:58');
  await say(['อาเหมยอยู่ชั้นสอง ทำงานที่บ้านพักทหารผ่านศึก','เธอโทรมาทุกเช้าตอนเจ็ดโมงตรง\n"ลุงหลี่ กินยาเช้าหรือยังคะ"','ผมชอบรับสายตอนกริ่งที่สอง\nจะได้ไม่ดูเหมือนนั่งรออยู่']);
  const T=['07:00','07:06','07:15','07:30']; let k=0;
  while(k<T.length){ clock(T[k]); sfx.tick(); await W(500); sfx.tick(); await say(k===0?'…':k===1?'… …':k===2?'โทรศัพท์เงียบ\nนาฬิกาดังกว่าทุกวัน':'… … …',{stay:1,q:1});
    const c=await choose([{t:'รอต่ออีกหน่อย'},{t:'เลิกรอ'}]); if(c===1) break; k++; }
  await say(['วันนี้วันอังคาร ผมเพิ่งนึกได้\nอาเหมยเข้าเวรดึก เช้านี้เธอเพิ่งได้นอน','ไม่เป็นไร','ไม่เป็นไรหรอก']);
}
async function pot(){ clock('07:40'); card(`<svg viewBox="0 0 300 190"><rect width="300" height="190" rx="14" fill="#f3e3c8"/><ellipse cx="150" cy="150" rx="110" ry="14" fill="#d9b88d"/><rect x="78" y="74" width="144" height="76" rx="16" fill="#7d8a8f"/><ellipse cx="150" cy="76" rx="72" ry="14" fill="#f6efe0"/><ellipse cx="150" cy="78" rx="62" ry="10" fill="#efe3c6"/><g fill="#d8caa6"><circle cx="128" cy="78" r="4"/><circle cx="160" cy="75" r="3"/><circle cx="176" cy="81" r="4"/></g><path d="M78 100h-18M222 100h18" stroke="#5f6b70" stroke-width="10" stroke-linecap="round"/><g fill="none" stroke="#b9c48a" stroke-width="3" stroke-linecap="round" opacity=".8"><path d="M120 54q-8-10 0-20t0-20"><animate attributeName="opacity" values=".2;.9;.2" dur="3s" repeatCount="indefinite"/></path><path d="M180 50q8-10 0-20t0-20"><animate attributeName="opacity" values=".9;.2;.9" dur="3s" repeatCount="indefinite"/></path></g></svg>`);

  const c=await choose([{t:'ต้มให้เดือดอีกที แล้วกิน',s:'ไม่เสียอะไรเลย'},{t:'เททิ้ง แล้วลงไปซื้อข้างล่าง',s:'สี่ชั้นลง สี่ชั้นขึ้น · ใช้แรง 2 · NT$ 60',dis:S.en<2}]); cardOff();
  if(c===0){ S.sour=true; await say(['ต้มเดือดแล้วก็กินได้\nสมัยอยู่กองทัพ กินแย่กว่านี้ตั้งเยอะ','ผมกินไปครึ่งชาม\nที่เหลือเก็บไว้มื้อเย็น']); }
  else { S.bought=true; await black(true,1200); S.money-=60; energy(-2); clock('08:35'); await black(false,1200);
    await say(['กว่าจะกลับถึงห้อง เสื้อเปียกไปทั้งตัว','ข้าวต้มร้อนๆ หอมดี\nแต่ผมต้องนั่งพักเกือบครึ่งชั่วโมง กว่าจะมีแรงยกช้อน','เสี่ยวเฮยได้กินไข่เค็มไปครึ่งซีก']); }
}
async function toilet(){ clock('09:30'); clearTxt();
  await say(['ห้องน้ำอยู่สุดทางเดิน ใช้รวมกันทั้งชั้น','ยี่สิบสามก้าว\nผมนับไว้นานแล้ว']);
  await black(true,900); hallSetup(false); scene('hall'); ramp(fanG,.01,1); await black(false,900);
  await say('ทางเดิน',{stay:1,q:1}); const r=await walk({}); S.coughs=r.coughs; $('#vig').style.opacity=0;
  if(r.coughs){ energy(-1); await say(['ถึงแล้ว\nผมยืนเกาะขอบประตูอยู่พักใหญ่',r.coughs>1?'คนหนุ่มห้องข้างๆ เดินสวนไป เขาใช้สี่วินาที\nผมใช้เกือบสิบนาที':'ยี่สิบสามก้าว ไกลขึ้นทุกปี']); }
  else await say(['ถึงแล้ว\nเดินช้าๆ ก็ถึงเหมือนกัน','ขากลับ ยี่สิบสามก้าวเท่าเดิม']);
  await black(true,900); scene('room'); leeTo(0,0); ramp(fanG,.05,1); clock('09:50'); await black(false,900);
  $('#vig').style.opacity=.5;
  await say(['กลับถึงเตียง หน้าอกแน่นเหมือนมีคนนั่งทับ','บนชั้นมียาพ่นสองอัน\nสีฟ้า กับสีเขียว']);
  let c=await choose([{t:'🔵 อันสีฟ้า'},{t:'🟢 อันสีเขียว'}]); sfx.puff();
  if(c===1){ await say(['ผมกด… ไม่รู้สึกอะไรเลย\nมีแต่รสขมๆ ติดลิ้น','หมอบอกให้ใช้อันนี้ทุกวัน\nแต่มันไม่เคยช่วยตอนที่ผมต้องการ']); await choose([{t:'🔵 หยิบอันสีฟ้า'}]); sfx.puff(); }
  $('#vig').style.opacity=0; sfx.warm();
  await say(['โล่งทันที','อันสีฟ้านี่สิของดี\nผมพ่นมันทุกวัน วันละหลายหน','อันสีเขียว… ผมไม่เคยเข้าใจว่ามีไว้ทำไม']);
}
async function noon(){ phase('noon'); clock('13:10'); $('#shimmer').classList.add('on'); leeTo(0,0);
  await say(['บ่ายโมง ในห้องสามสิบสามองศา','พัดลมพัดลมร้อนมาใส่หน้า','รีโมตแอร์อยู่ในลิ้นชัก\nใต้บิลค่าไฟของหน้าร้อนปีที่แล้ว','บิลใบนั้น ผมเก็บไว้เตือนตัวเอง']);
  const c=await choose([{t:'เปิดแอร์สักสองชั่วโมง',s:'NT$ 40 · เงินบำนาญออกอีกหกวัน'},{t:'พัดลมก็พอ',s:'ไม่เสียเงิน'}]);
  if(c===0){ S.ac=true; S.money-=40; hud(); $('#shimmer').classList.remove('on'); ramp(fanG,.08,2); await say(['ลมเย็นไหลลงมาแตะไหล่','ผมหลับไปโดยไม่รู้ตัว\nเสี่ยวเฮยนอนแผ่อยู่ใต้แอร์ สี่ขาชี้ฟ้า']); if(S.en<5) energy(1); }
  else { await say(['เหงื่อไหลลงกลางหลัง','คัน\nเกาแล้วแสบ แสบแล้วก็ยังคัน','ผมเปลี่ยนเสื้อกล้ามตัวที่สองของวัน\nแล้วนอนลืมตามองเพดาน']); energy(-1); $('#shimmer').classList.remove('on'); }
}
async function radio(){ phase('after'); clock('16:00'); ramp(staticG,.07,.6);
  card(`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="16" fill="#5f8f8a"/><rect x="18" y="18" width="264" height="52" rx="8" fill="#f3e3c8"/><g stroke="#8a6f5c" stroke-width="2">${Array.from({length:21},(_,i)=>`<path d="M${30+i*12} ${i%5?40:32}V52"/>`).join('')}</g><rect id="needle" x="28" y="24" width="3" height="40" fill="#c8694a"/><circle cx="60" cy="110" r="22" fill="#3f6b67"/><circle cx="60" cy="110" r="10" fill="#2f5450"/><circle cx="230" cy="110" r="16" fill="#e9a646"/><circle cx="180" cy="110" r="10" fill="#f3e3c8"/></svg><input id="dial" type="range" min="0" max="100" value="4" step="1">`);
  await say('สี่โมงเย็น รายการเพลงเก่า\n(เลื่อนหาคลื่น)',{stay:1,q:1});
  await new Promise(res=>{ const d=$('#dial'), nd=$('#needle'), T=63; let ok=null;
    const up=()=>{ const v=+d.value, dist=Math.abs(v-T); nd.setAttribute('x',28+v*2.4); if(staticG&&AC) staticG.gain.setTargetAtTime(Math.min(.09,dist/250+.004),AC.currentTime,.05);
      clearTimeout(ok); if(dist<=3) ok=setTimeout(()=>{ d.disabled=true; res(); },700); }; d.oninput=up; up(); if(FAST){ d.value=T; up(); } });
  ramp(staticG,.004,.5); const ms=playTune(); await W(1400);
  await say(['เพลงนี้…','ซิ่วหลานเคยเต้นเพลงนี้ในครัว\nมือหนึ่งถือตะหลิว','เธอกวักมือเรียกผม\nผมบอกว่าเข่าไม่ดี','ตอนนั้นเข่าผมยังดีอยู่']);
  ramp(staticG,0,2); cardOff();
}
async function evening(){ phase('dusk'); clock('17:40');
  await say(['เสี่ยวเฮยคาบสายจูงมาวางบนเท้าผม\nแล้วนั่งรอ','มันไม่เห่า ไม่เร่ง\nแค่มอง']);
  const c=await choose([{t:'ไปกันเถอะ',s:S.en>=2?'สี่ชั้น':'แรงไม่พอ',dis:S.en<2},{t:'วันนี้ไม่ไหวนะ เสี่ยวเฮย'}]);
  if(c===0){ S.walked=true; await black(true,900); hallSetup(true); scene('hall'); ramp(fanG,0,1); await black(false,900);
    await say('บันได',{stay:1,q:1}); await walk({stairs:true, limit:.34}); energy(-2);
    await say(['ชั้นสาม','ผมเกาะราวบันได โลกหมุนช้าๆ','เสี่ยวเฮยหยุด หันมามอง\nแล้วเดินกลับขึ้นมานั่งข้างเท้าผม','มันไม่เคยดึงสายจูงเลยสักครั้ง']);
    await black(true,900); $('#vig').style.opacity=0; scene('room'); ramp(fanG,.05,1); await black(false,900); }
  else await say(['มันวางคางลงบนรองเท้าผม\nไม่ได้ว่าอะไร','ผมอยากให้มันว่าบ้าง']);
  leeTo(-52,-8); await say(['เราเลยนั่งดูถนนจากหน้าต่างด้วยกัน','เด็กนักเรียนเดินกลับบ้าน\nหมาตัวอื่นเดินผ่านไป']); leeTo(0,0);
}
async function dinner(){ phase('night'); clock('18:50');
  card(`<svg viewBox="0 0 300 190" id="tbl"><rect width="300" height="190" rx="14" fill="#a8754f"/><rect x="10" y="10" width="280" height="170" rx="10" fill="#b98560"/><circle cx="92" cy="92" r="40" fill="#fffaf0"/><circle cx="92" cy="92" r="30" fill="#efe3c6"/><circle cx="208" cy="92" r="40" fill="#fffaf0"/><circle cx="208" cy="92" r="30" fill="#f6efe0"/><g stroke="#4a3528" stroke-width="5" stroke-linecap="round"><path d="M60 150h64M60 160h64"/></g><g id="cs2" stroke="#4a3528" stroke-width="5" stroke-linecap="round" style="transition:transform 1.6s ease,opacity 1.6s ease;cursor:pointer"><path d="M176 150h64M176 160h64"/><rect x="166" y="138" width="84" height="34" fill="transparent" stroke="none"/></g></svg>`);
  await say(['มื้อเย็น','ผมวางชามสองใบ ตะเกียบสองคู่','มือมันวางเอง\nหกปีแล้วก็ยังวางเอง']);
  await say('(เก็บตะเกียบคู่หนึ่งกลับ)',{stay:1,q:1});
  await new Promise(res=>{ const g=$('#cs2'); g.onclick=()=>{ g.onclick=null; sfx.low(); g.style.transform='translateX(140px)'; g.style.opacity=0; setTimeout(res,FAST?30:1700); }; if(FAST) g.dispatchEvent(new Event('click')); });
  await say(['ชามใบนั้น ผมไม่ได้เก็บ',S.sour?'ข้าวต้มที่เหลือจากเมื่อเช้า\nเปรี้ยวกว่าเดิมหน่อย แต่ก็หมดชาม':'ข้าวสวยกับผัดผักที่เหลือจากเมื่อวาน']); cardOff();
}
async function night(){ clock('21:10'); leeTo(0,0);
  if(!S.meds){
    card(`<svg viewBox="0 0 300 170"><rect width="300" height="170" rx="14" fill="#f3e3c8"/><rect x="14" y="30" width="272" height="112" rx="10" fill="#e9a646"/>${['จ','อ','พ','พฤ','ศ','ส','อา'].map((d,i)=>`<g><rect x="${20+i*38}" y="38" width="34" height="46" rx="5" fill="${i===1?'#fffaf0':'#f6d79a'}"/><rect x="${20+i*38}" y="90" width="34" height="46" rx="5" fill="${i===1?'#fffaf0':'#f6d79a'}"/><text x="${37+i*38}" y="24" text-anchor="middle" font-family="Sarabun" font-size="13" fill="#4a3528">${d}</text>${i===1?`<g class="blur" id="pl"><g fill="#c8694a"><circle cx="66" cy="52" r="5"/><circle cx="80" cy="56" r="5"/><circle cx="70" cy="68" r="5"/></g><g fill="#5f8f8a"><ellipse cx="84" cy="70" rx="6" ry="4"/><ellipse cx="64" cy="78" rx="6" ry="4"/></g><circle cx="78" cy="78" r="4" fill="#fff"/><circle cx="74" cy="60" r="4" fill="#fff"/><g fill="#8a6f5c"><circle cx="66" cy="106" r="5"/><circle cx="80" cy="112" r="5"/><ellipse cx="72" cy="124" rx="6" ry="4"/><circle cx="84" cy="124" r="4"/></g></g>`:''}</g>`).join('')}</svg>`);
    await say(['ก่อนนอน ผมเปิดกล่องยา','เม็ดยาเล็ก แสงไฟสลัว\nตาผมต้องใช้เวลา']);
    await hold('กดค้าง<br>เพื่อเพ่งมอง', 1900, ''); $('#pl').classList.add('focus'); await W(1500);
    await say(['ช่อง "อังคาร – เช้า"\nยาเจ็ดเม็ด ยังอยู่ครบ','ผมลืม','วันนี้ไม่มีใครโทรมา']);
    const c=await choose([{t:'กินรวมกับยาก่อนนอนเสียเลย',s:'ยาของรัฐบาล ทิ้งก็เสียดาย'},{t:'ข้ามไป พรุ่งนี้ค่อยเริ่มใหม่'}]); cardOff();
    if(c===0){ S.dbl=true; await say(['สิบเอ็ดเม็ด น้ำสองแก้ว','ทหารต้องทำภารกิจให้ครบ\nช้าไปหน่อยก็ยังดีกว่าไม่ทำ']); }
    else await say(['ผมปิดฝากล่อง','รู้สึกเหมือนขัดคำสั่ง\nไม่รู้ว่าคำสั่งของใคร']);
  } else await say(['ก่อนนอน ผมเปิดกล่องยา\nช่องเช้าว่างเปล่า','วันนี้ผมจำได้เอง ไม่ต้องมีใครเตือน','…แต่ก็อยากให้มีคนเตือนอยู่ดี']);
  phase('dark'); ramp(fanG,.03,3); leeTo(-40,34); $('#dog').classList.add('sleep'); await W(2200);
  await say(['ราตรีสวัสดิ์ ซิ่วหลาน','เสี่ยวเฮยกระโดดขึ้นเตียงไม่ไหวแล้ว\nมันนอนบนพรมข้างล่าง','ผมหย่อนมือลงไปข้างเตียง\nมันเลียปลายนิ้วผมทีหนึ่ง แล้วก็หลับ']);
  if(S.dbl){ await black(true,1800); clock('02:10'); sfx.beat(); await W(500); sfx.beat(); await black(false,1400); $('#vig').style.opacity=.6;
    await say(['ตีสอง','ผมตื่นมาเหงื่อแตกทั้งตัว มือสั่น ใจเต้นแรง','คงฝันร้าย','ผมนอนนิ่งๆ ในความมืด\nรอให้มันผ่านไป']); $('#vig').style.opacity=0; }
  await black(true,2600); ramp(fanG,0,2); clearTxt(); await W(600); diary();
}
function diary(){ const L=[];
  L.push(S.meds?'เช้านี้กินยาเองได้ ไม่ต้องมีใครเตือน':'อาเหมยไม่ได้โทรมา ผมลืมยาเช้า');
  L.push(S.bought?'ลงไปซื้อข้าวต้ม ขึ้นมาแทบหมดแรง':'ข้าวต้มหม้อเดิม ยังกินได้');
  L.push(S.coughs?'ไปห้องน้ำ ต้องหยุดไอ '+(S.coughs>1?'หลายหน':'หนหนึ่ง'):'ไปห้องน้ำ ยี่สิบสามก้าว ไม่ไอ');
  L.push(S.ac?'เปิดแอร์สองชั่วโมง เหลือ NT$ '+S.money:'ไม่ได้เปิดแอร์ คันทั้งบ่าย');
  L.push(S.walked?'พาเสี่ยวเฮยลงไปได้แค่ชั้นสาม':'ไม่ได้พาเสี่ยวเฮยลงไปเดิน');
  if(S.dbl) L.push('กินยาเช้ารวมกับยาก่อนนอน กลางดึกใจสั่น');
  L.push('วันนี้ไม่มีใครมาหา'); L.push('เป็นวันธรรมดาวันหนึ่ง');
  $('#pg').innerHTML='<b>วันอังคาร</b>'+L.map((t,i)=>`<p style="animation-delay:${FAST?0:.8+i*1.1}s">${t}</p>`).join(''); $('#diary').classList.add('on'); window.__done=JSON.parse(JSON.stringify(S)); }

$('#start').onclick=async()=>{ audio(); if(AC&&AC.state==='suspended') AC.resume(); sfx.warm(); const t=$('#title'); t.style.opacity=0; t.style.pointerEvents='none'; await W(1400); t.classList.add('hidden'); day1(); };
$('#again').onclick=async()=>{ $('#diary').classList.remove('on'); await W(1200); day1(); };
hud(); phase('dark');
</script>
