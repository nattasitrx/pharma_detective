<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex">
<title>藥師偵探 D · 停電夜 (prototype)</title>
<style>
:root{--ink:#e9e4ff;--pink:#ff7aa2;--gold:#ffd36b;--mint:#7fe3c0;--night:#0c0a1c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#05040c;touch-action:pan-x pan-y;-webkit-user-select:none;user-select:none;
  font-family:system-ui,-apple-system,"Noto Sans TC","Noto Sans Thai","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink)}
#wrap{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:var(--night);touch-action:none}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.btn{background:var(--pink);color:#2a1030;font-weight:900;font-size:30px;padding:16px 34px;border-radius:99px;box-shadow:0 6px 0 #b8456b}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #b8456b}
.btn.alt{background:#3a3260;color:var(--ink);box-shadow:0 6px 0 #231d40}
.btn.sm{font-size:22px;padding:10px 20px}
/* title */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;
  background:radial-gradient(ellipse at 50% 30%,#2a2356 0%,#0c0a1c 70%)}
#title h1{font-size:92px;margin:0;letter-spacing:4px;text-shadow:0 0 30px #7a6cff}
#title h2{font-size:38px;margin:0;color:var(--gold);font-weight:800}
#title p{font-size:24px;max-width:1050px;margin:0;line-height:1.5;color:#c9c1f5}
#langs{display:flex;gap:12px}
#langs button{background:#2a2450;border-radius:99px;padding:10px 24px;font-size:24px;font-weight:800}
#langs button.on{background:var(--gold);color:#2a1030}
.proto{position:absolute;top:22px;left:22px;background:#ffd36b;color:#2a1030;font-weight:900;font-size:20px;padding:6px 16px;border-radius:99px}
/* room */
#room{position:absolute;inset:0}
#room svg{position:absolute;inset:0;width:1600px;height:900px}
.hs{cursor:pointer;fill:#fff;fill-opacity:0;stroke:var(--gold);stroke-width:5;stroke-opacity:0;stroke-dasharray:14 10;rx:14}
.hs.lit{stroke-opacity:.75}
.hs.want{stroke-opacity:1;stroke:var(--mint);animation:want 1s infinite}
@keyframes want{50%{stroke-width:11}}
#dark{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle 250px at var(--x,800px) var(--y,450px),rgba(8,6,20,0) 0%,rgba(8,6,20,.18) 55%,rgba(6,4,16,.93) 100%)}
#dark.flick{animation:flick .5s 2}
@keyframes flick{0%,100%{opacity:1}40%{opacity:.25}60%{opacity:1}80%{opacity:.5}}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;height:84px;display:flex;align-items:center;gap:18px;padding:0 22px;background:linear-gradient(#000c,#0000);pointer-events:none}
#hud>*{pointer-events:auto}
.pill{background:#1c1838e6;border-radius:99px;padding:8px 20px;font-size:28px;font-weight:900;display:flex;align-items:center;gap:10px;box-shadow:0 0 0 3px #3a3260}
#gbar{width:330px;height:22px;border-radius:99px;background:#2a2450;overflow:hidden}
#gfill{height:100%;width:0;background:linear-gradient(90deg,#7fe3c0,#ffd36b,#ff5c7a);transition:width .4s}
#hud .sp{flex:1}
#say{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);max-width:1200px;background:#1c1838f2;border-radius:26px;padding:16px 28px;font-size:28px;line-height:1.45;font-weight:700;box-shadow:0 0 0 4px #4a3f8a;text-align:center;pointer-events:none}
#say b{color:var(--gold)}
#notes{position:absolute;left:0;right:0;bottom:0;height:104px;display:flex;align-items:center;gap:12px;padding:0 22px;background:linear-gradient(#0000,#000d);overflow-x:auto;touch-action:pan-x}
#notes .nt{flex:0 0 auto;background:#2a2450;border-radius:16px;padding:10px 18px;font-size:22px;font-weight:800;box-shadow:0 0 0 3px #4a3f8a}
#notes .nt.new{animation:pop .6s}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}}
#notes .lab{font-size:20px;color:#a99fe0;font-weight:800;flex:0 0 auto}
/* panels */
#veil{position:absolute;inset:0;background:#05040ccc;display:flex;align-items:center;justify-content:center}
.panel{width:1180px;max-height:800px;overflow:auto;background:#f8f3ea;color:#2a2140;border-radius:30px;padding:30px 38px;box-shadow:0 0 0 6px #4a3f8a,0 30px 60px #000a;touch-action:pan-y}
.panel h3{margin:0 0 12px;font-size:36px}
.panel p{font-size:25px;line-height:1.5;margin:8px 0}
.panel table{border-collapse:collapse;width:100%;font-size:24px;margin:8px 0}
.panel td,.panel th{border:2px solid #cbbfa8;padding:8px 12px;text-align:left}
.panel th{background:#efe6d4}
.panel .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.panel .hint{font-size:21px;color:#7a6f8f}
.panel .hand{font-family:"Comic Sans MS","Segoe Print",cursive,inherit;background:#fff9c9;border-radius:14px;padding:14px 18px;transform:rotate(-.6deg);box-shadow:0 4px 0 #e2d98f}
.dials{display:flex;gap:16px;justify-content:center;margin:20px 0}
.dial{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:150px}
.dial .cap{font-size:20px;font-weight:800;color:#7a6f8f;text-align:center;max-width:300px}
.dial .v{min-width:130px;max-width:310px;min-height:92px;display:flex;align-items:center;justify-content:center;text-align:center;background:#2a2140;color:#ffd36b;border-radius:18px;font-size:30px;font-weight:900;padding:8px 14px}
.dial.num .v{font-size:66px;font-variant-numeric:tabular-nums}
.dial button{background:#e7dcc6;border-radius:14px;width:120px;height:52px;font-size:26px;font-weight:900;color:#2a2140}
.panel.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-18px)}40%{transform:translateX(16px)}60%{transform:translateX(-10px)}80%{transform:translateX(6px)}}
.opt{display:block;width:100%;text-align:left;background:#efe6d4;border-radius:18px;padding:16px 22px;font-size:26px;font-weight:800;margin:10px 0;color:#2a2140}
.opt.ok{background:#bff0dc}.opt.bad{background:#ffc9d2}
/* ghost event */
#boo{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#2b1f5ee6,#05040cf2);display:flex;align-items:center;justify-content:center;gap:40px}
#boo .gh{width:330px;animation:float 2.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-22px) rotate(2deg)}}
#boo .q{width:820px}
#boo .q h3{font-size:34px;margin:0 0 6px;color:var(--gold)}
#boo .q p{font-size:28px;font-weight:800;margin:0 0 10px;line-height:1.4}
#boo .tm{height:14px;border-radius:99px;background:#2a2450;overflow:hidden;margin-bottom:12px}
#boo .tm i{display:block;height:100%;background:var(--pink);width:100%}
#boo .opt{background:#2a2450;color:var(--ink);box-shadow:0 0 0 3px #4a3f8a}
#boo .opt.ok{background:#1f6b54}#boo .opt.bad{background:#7a2740}
#boo .why{font-size:23px;color:#c9c1f5;min-height:60px}
#peek{position:absolute;width:150px;pointer-events:none;opacity:0;transition:opacity .8s,transform 2.5s}
#end{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#3a2f78,#0c0a1c 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center;padding:0 120px}
#end h1{font-size:50px;margin:0}
#end p{font-size:24px;line-height:1.5;margin:0;max-width:1200px}
#end ul{font-size:22px;text-align:left;line-height:1.5;margin:0;max-width:1150px}
</style>
</head>
<body>
<div id="wrap">
<div id="stage">
  <div id="room" class="hidden"></div>
  <div id="dark" class="hidden"></div>
  <div id="peek"></div>
  <div id="hud" class="hidden">
    <div class="pill">⏱ <span id="clock">15:00</span></div>
    <div class="pill">👻 <div id="gbar"><div id="gfill"></div></div></div>
    <div class="pill">🔓 <span id="nlock">0</span>/4</div>
    <div class="sp"></div>
    <button class="btn sm alt" id="bHint"></button>
    <button class="btn sm alt" id="bMute">🔊</button>
  </div>
  <div id="say" class="hidden"></div>
  <div id="notes" class="hidden"></div>
  <div id="veil" class="hidden"></div>
  <div id="boo" class="hidden"></div>
  <div id="end" class="hidden"></div>
  <div id="title">
    <div class="proto">PROTOTYPE · 試作版</div>
    <div id="langs"><button data-l="0">中文</button><button data-l="1">English</button><button data-l="2">ไทย</button></div>
    <h1 id="t1"></h1><h2 id="t2"></h2><p id="t3"></p>
    <button class="btn" id="bStart"></button>
    <p id="t4" style="font-size:20px;color:#8f86c4"></p>
  </div>
</div>
</div>

   One file, no server, nothing is saved or sent.
   ===================================================================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let LANG=(()=>{ const q=new URLSearchParams(location.search).get('lang'); return q==='en'?1:q==='th'?2:0; })();
const L=a=>a[LANG]||a[0];

/* ---------- stage scale ---------- */
let K=1; function fit(){ const w=document.documentElement.clientWidth, h=document.documentElement.clientHeight; K=Math.min(w/1600,h/900); const st=$('#stage'); st.style.transform=`scale(${K})`; st.style.left=(w-1600*K)/2+'px'; st.style.top=(h-900*K)/2+'px'; }
addEventListener('resize',fit); fit();
['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
const pt=e=>{ const r=$('#stage').getBoundingClientRect(); return {x:(e.clientX-r.left)/K, y:(e.clientY-r.top)/K}; };
/* ---------- sound ---------- */
const A={ctx:null,mute:false};
function tone(f,d,type='sine',v=.12,slide){ if(A.mute) return; try{ A.ctx=A.ctx||new (window.AudioContext||window.webkitAudioContext)(); const c=A.ctx,o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.value=f; if(slide) o.frequency.exponentialRampToValueAtTime(slide,c.currentTime+d);
  g.gain.setValueAtTime(v,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d); o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+d); }catch(e){} }
const sfx={ click:()=>tone(520,.06,'square',.05), knock:()=>{ tone(90,.12,'triangle',.3); setTimeout(()=>tone(80,.12,'triangle',.3),180); setTimeout(()=>tone(85,.14,'triangle',.3),360); },
  bad:()=>tone(140,.35,'sawtooth',.12,70), good:()=>{ tone(660,.12,'triangle',.14); setTimeout(()=>tone(880,.14,'triangle',.14),110); setTimeout(()=>tone(1320,.25,'triangle',.14),230); },
  woo:()=>tone(300,1.1,'sine',.12,700), beat:()=>{ tone(58,.12,'sine',.28); setTimeout(()=>tone(52,.14,'sine',.2),160); }, paper:()=>tone(1800,.08,'triangle',.04,600), dial:()=>tone(900,.03,'square',.04) };
/* ---------- texts ---------- */

 start:['▶ 進門','▶ Go in','▶ เข้าห้อง'], hint:['👻 問老班長','👻 Ask the Sergeant','👻 ถามจ่าเฒ่า'], close:['關閉','Close','ปิด'], tryOpen:['🔑 試試看','🔑 Try it','🔑 ลองเปิด'], notes:['線索','Clues','เบาะแส'],

       'จ่าเฒ่ายืนข้างประตู ยกมือทำความเคารพ "เมื่อก่อนห้องนี้เป็นของฉัน ไม่มีใครช่วยดูยาให้ฉันเลย… อย่าให้เฒ่าหลี่เป็นแบบฉัน" ไฟติด แล้วเขาก็หายไป'],

};
const T=k=>L(TX[k]);
/* ---------- the case (facts as in Case D) ---------- */
const DOCS={
 card:{ic:'🪪', n:['個案卡','Patient card','บัตรผู้ป่วย'], h:()=>`<h3>🪪 ${L(['個案卡','Patient card','บัตรผู้ป่วย'])}</h3><table>

 <rect class="hs" data-h="drawer" x="625" y="505" width="200" height="210"/><rect class="hs" data-h="box" x="1022" y="474" width="176" height="100"/>
 <rect class="hs" data-h="card" x="888" y="508" width="126" height="66"/><rect class="hs" data-h="formula" x="410" y="730" width="150" height="104"/>
 <rect class="hs" data-h="bags" x="1416" y="240" width="112" height="150"/><rect class="hs" data-h="door" x="1350" y="400" width="96" height="120"/>
 <rect class="hs" data-h="clock" x="950" y="110" width="120" height="120"/><rect class="hs" data-h="window" x="630" y="100" width="280" height="250"/>
 </svg>`;
 $$('.hs').forEach(h=>h.addEventListener('click',()=>{ if(S.busy||!S.on) return; tap(h.dataset.h); }));
}
function light(x,y){ S.lx=x; S.ly=y; const d=$('#dark'); d.style.setProperty('--x',x+'px'); d.style.setProperty('--y',y+'px');
 $$('.hs').forEach(h=>{ const cx=+h.getAttribute('x')+h.getAttribute('width')/2, cy=+h.getAttribute('y')+h.getAttribute('height')/2; h.classList.toggle('lit',Math.hypot(cx-x,cy-y)<230); }); }
['pointerdown','pointermove'].forEach(t=>$('#stage').addEventListener(t,e=>{ if(!S.on) return; const p=pt(e); light(p.x,p.y); }));
/* ---------- talk + notes ---------- */
let sayT=0; function say(html,ms=4200){ const s=$('#say'); s.innerHTML=html; s.classList.remove('hidden'); clearTimeout(sayT); sayT=setTimeout(()=>s.classList.add('hidden'),ms); }
function paintNotes(newId){ $('#notes').innerHTML=`<span class="lab">📒 ${T('notes')}</span>`+[...S.found].map(k=>`<button class="nt${k===newId?' new':''}" data-d="${k}">${DOCS[k].ic} ${esc(L(DOCS[k].n))}</button>`).join('');
 $$('#notes .nt').forEach(b=>b.onclick=()=>{ if(!S.busy) showDoc(b.dataset.d); }); }
function find(k){ const isNew=!S.found.has(k); S.found.add(k); paintNotes(isNew?k:null); if(isNew) sfx.paper(); }
/* ---------- panels ---------- */
function panel(html){ S.busy=true; const v=$('#veil'); v.innerHTML=`<div class="panel">${html}</div>`; v.classList.remove('hidden'); return v.firstChild; }
function closePanel(){ $('#veil').classList.add('hidden'); S.busy=false; }
function showDoc(k){ find(k); const p=panel(DOCS[k].h()+`<div class="row"><button class="btn sm alt" id="pX">${T('close')}</button></div>`); p.querySelector('#pX').onclick=()=>{ sfx.click(); closePanel(); }; }
function lockUI(id){ const lk=LOCKS[id]; if(S.open.has(id)){ showDoc(lk.gives); return; }
 if(lk.need&&!S.found.has(lk.need)){ say('🔒 '+esc(T('locked'))+' '+esc(L(['好像還缺一個線索……','It seems one clue is still missing…','เหมือนยังขาดเบาะแสอีกอย่าง…']))); sfx.bad(); return; }
 const v=lk.dials.map(()=>0);
 const draw=()=>{ const p=panel(`<h3>🔐 ${esc(L(lk.n))}</h3><div class="dials">${lk.dials.map((d,i)=>`<div class="dial${d.num?' num':''}">${d.cap?`<div class="cap">${esc(L(d.cap))}</div>`:''}<button data-u="${i}">▲</button><div class="v">${d.num?v[i]:esc(L(d.opts[v[i]]))}</div><button data-d="${i}">▼</button></div>`).join('')}</div>
   <div class="row"><button class="btn sm" id="pTry">${T('tryOpen')}</button><button class="btn sm alt" id="pX">${T('close')}</button></div><p class="hint" style="text-align:center">${esc(L(['線索在房間裡和下面的「線索」列','The clues are in the room and in the Clues bar below','เบาะแสอยู่ในห้องและในแถบ "เบาะแส" ด้านล่าง']))}</p>`);
   p.querySelectorAll('[data-u],[data-d]').forEach(b=>b.onclick=()=>{ const i=+(b.dataset.u??b.dataset.d), n=lk.dials[i].num?10:lk.dials[i].opts.length; v[i]=(v[i]+(b.dataset.u!=null?1:n-1))%n; sfx.dial(); draw(); });
   p.querySelector('#pX').onclick=()=>{ sfx.click(); closePanel(); };
   p.querySelector('#pTry').onclick=()=>{ if(lk.ok(v)){ sfx.good(); S.open.add(id); $('#nlock').textContent=S.open.size; bump(-25); find(lk.gives);
       const q=panel(`<h3>🔓 ${T('open')}</h3><p>${esc(L(lk.why))}</p>${DOCS[lk.gives].h()}<div class="row"><button class="btn sm" id="pX">${T('close')}</button></div>`); q.querySelector('#pX').onclick=()=>{ closePanel(); afterOpen(id); }; }
     else { sfx.bad(); p.classList.add('shake'); setTimeout(()=>p.classList.remove('shake'),450); bump(18); flick(); say('👻 '+esc(T('wrong'))); } }; };
 draw(); }
function doorUI(){ if(S.open.size<3){ say('🚪 '+esc(L(['門鎖死了。門上有三道刮痕，像在說「先解開三個鎖」。','The door is jammed. Three scratches on it seem to say "open three locks first".','ประตูล็อกแน่น มีรอยขีดสามรอยเหมือนจะบอกว่า "ไขกุญแจสามดอกก่อน"']))); sfx.knock(); return; }
 const p=panel(`<h3>🚪 ${esc(L(FINAL.q))}</h3>${FINAL.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(L(o))}</button>`).join('')}<div class="row"><button class="btn sm alt" id="pX">${T('close')}</button></div>`);
 p.querySelector('#pX').onclick=()=>closePanel();
 p.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(+b.dataset.i===FINAL.a){ b.classList.add('ok'); sfx.good(); S.open.add('door'); setTimeout(win,900); } else { b.classList.add('bad'); sfx.bad(); bump(18); flick(); } }); }
function tap(h){ sfx.click();
 if(DOCS[h]&&h!=='leaflet'&&h!=='receipt'&&h!=='pillbox'){ if(h==='labs') $('#gLabs').setAttribute('transform','translate(-10 430) rotate(18 535 220)'); return showDoc(h); }
 if(LOCKS[h]) return lockUI(h);
 if(h==='door') return doorUI();
 if(h==='lee') return say(L(['李伯伯：「呼……呼……藍色那支……我噴了好多下……還是喘……」','Mr. Lee: "Hhh… hhh… the blue one… I puffed it so many times… still can\'t breathe…"','ลุงหลี่: "แฮ่ก… แฮ่ก… ตัวสีฟ้า… ลุงพ่นไปหลายทีแล้ว… ยังหอบอยู่เลย…"']),5200);
 if(h==='clock') return say(L(['時鐘停在 7:05。秒針偶爾自己跳一下。','The clock stopped at 7:05. Now and then the second hand twitches by itself.','นาฬิกาหยุดที่ 7:05 เข็มวินาทีกระตุกเองเป็นพักๆ']));
 if(h==='window') return say(L(['窗外整個新村都是黑的。玻璃上有一個小小的手印。','The whole village is dark outside. There is a small handprint on the glass.','ข้างนอกมืดทั้งหมู่บ้าน บนกระจกมีรอยมือเล็กๆ'])); }
function afterOpen(id){ const nx={cabinet:['drawer',['老班長把仿單吹到你腳邊，然後指了指床頭的抽屜。','The Sergeant blows the leaflet to your feet, then points at the bedside drawer.','จ่าเฒ่าเป่าเอกสารกำกับยามาที่เท้าคุณ แล้วชี้ไปที่ลิ้นชักหัวเตียง']],
   drawer:['box',['抽屜裡是一張診所收據。桌上的鐵盒自己「叩」了一聲。','A clinic receipt was inside. The metal box on the table knocks once, by itself.','ในลิ้นชักมีใบเสร็จคลินิก กล่องเหล็กบนโต๊ะดัง "ก๊อก" ขึ้นมาเอง']],
   box:['door',['你知道原因了。門那邊傳來三下敲門聲。','Now you know why. Three knocks come from the door.','คุณรู้สาเหตุแล้ว มีเสียงเคาะประตูสามครั้ง']]}[id]; if(!nx) return; sfx.knock(); peek(nx[0]); say('👻 '+esc(L(nx[1])),5200); }
/* ---------- the ghost ---------- */
function bump(d){ S.ghost=Math.max(0,Math.min(100,S.ghost+d)); $('#gfill').style.width=S.ghost+'%'; }
function flick(){ const d=$('#dark'); d.classList.remove('flick'); void d.offsetWidth; d.classList.add('flick'); }
function spot(h){ const e=$(`.hs[data-h="${h}"]`); return {x:+e.getAttribute('x')+e.getAttribute('width')/2, y:+e.getAttribute('y')+e.getAttribute('height')/2, e}; }
function peek(h){ const s=spot(h), p=$('#peek'); p.innerHTML=ghostSVG(150); p.style.left=(s.x-75)+'px'; p.style.top=(s.y-210)+'px'; p.style.transform='translateY(30px)'; p.style.opacity='.85';
 s.e.classList.add('want'); setTimeout(()=>{ p.style.transform='translateY(-20px)'; },50); setTimeout(()=>{ p.style.opacity='0'; },2600); setTimeout(()=>s.e.classList.remove('want'),6000); }
function nextTarget(){ if(!S.found.has('formula')) return 'formula'; if(!S.found.has('labs')) return 'labs'; if(!S.found.has('card')) return 'card'; if(!S.open.has('cabinet')) return 'cabinet';
 if(!S.found.has('inh')) return 'inh'; if(!S.open.has('drawer')) return 'drawer'; if(!S.found.has('bags')) return 'bags'; if(!S.open.has('box')) return 'box'; return 'door'; }
function hint(){ if(S.busy) return; bump(15); sfx.woo(); peek(nextTarget()); say('👻 '+esc(L(['老班長歪著頭，飄到某個地方晃了一下……（他靠得更近了）','The Sergeant tilts his head and hovers over something… (and he is closer now)','จ่าเฒ่าเอียงคอ แล้วลอยไปวนอยู่ตรงจุดหนึ่ง… (และเข้ามาใกล้ขึ้นด้วย)']))); }
function boo(){ S.busy=true; S.scares++; sfx.woo(); flick(); const q=QUIZ[S.qi++%QUIZ.length], b=$('#boo'); let left=100, done=false;
 b.innerHTML=`<div class="gh">${ghostSVG(330)}</div><div class="q"><h3>👻 ${T('booT')}</h3><p>${esc(L(q.q))}</p><div class="tm"><i></i></div>${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(L(o))}</button>`).join('')}<div class="why"></div></div>`;
 b.classList.remove('hidden'); const bar=b.querySelector('.tm i');
 const end=ok=>{ if(done) return; done=true; clearInterval(iv); b.querySelectorAll('.opt').forEach((o,i)=>{ if(i===q.a) o.classList.add('ok'); o.disabled=true; });
   if(ok){ sfx.good(); S.ghost=25; } else { sfx.bad(); S.time=Math.max(20,S.time-45); S.ghost=45; } bump(0); b.querySelector('.why').textContent=T(ok?'booOk':'booBad');
   setTimeout(()=>{ b.classList.add('hidden'); S.busy=!$('#veil').classList.contains('hidden'); },2300); };
 const iv=setInterval(()=>{ left-=1; bar.style.width=left+'%'; if(left<=0) end(false); },120);
 b.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{ const ok=+o.dataset.i===q.a; if(!ok) o.classList.add('bad'); end(ok); }); }
/* ---------- clock ---------- */
function tick(){ if(!S.on) return; const booing=!$('#boo').classList.contains('hidden'); if(booing) return;
 S.time--; const m=Math.floor(S.time/60), s=S.time%60; $('#clock').textContent=m+':'+String(s).padStart(2,'0'); $('#clock').style.color=S.time<120?'#ff7aa2':'';
 bump(.55); if(S.ghost>60&&S.time%2===0) sfx.beat(); else if(S.ghost>30&&S.time%4===0) sfx.beat();
 if(S.time%47===0&&!S.busy){ sfx.knock(); $('#zz').textContent=['💨','😮‍💨','💨'][S.time%3]; }
 if(S.time<=0) return lose(); if(S.ghost>=100&&$('#veil').classList.contains('hidden')) boo(); else if(S.ghost>=100) bump(-1); }
/* ---------- start / end ---------- */
function paintTitle(){ $('#t1').textContent=T('t1'); $('#t2').textContent=T('t2'); $('#t3').textContent=T('t3'); $('#t4').textContent=T('t4'); $('#bStart').textContent=T('start'); $('#bHint').textContent=T('hint');
 $$('#langs button').forEach(b=>b.classList.toggle('on',+b.dataset.l===LANG)); document.documentElement.lang=['zh-Hant','en','th'][LANG]; }
$$('#langs button').forEach(b=>b.onclick=()=>{ LANG=+b.dataset.l; paintTitle(); });
function start(){ Object.assign(S,{on:true,time:900,ghost:0,found:new Set(),open:new Set(),scares:0,busy:false}); drawRoom(); paintNotes(); $('#nlock').textContent=0; bump(0);
 ['#title','#end','#veil','#boo'].forEach(s=>$(s).classList.add('hidden')); ['#room','#dark','#hud','#notes'].forEach(s=>$(s).classList.remove('hidden')); light(800,450);
 clearInterval(S.tick); S.tick=setInterval(tick,1000); sfx.knock();
 say(L(['啪！停電了。你只剩手機的手電筒——<b>用手指移動光線</b>，點發亮的地方調查。','Snap — the power is out. You only have your phone\'s torch: <b>move the light with your finger</b> and tap what glows.','พรึ่บ! ไฟดับ เหลือแค่ไฟฉายมือถือ <b>ใช้นิ้วเลื่อนแสง</b> แล้วแตะจุดที่เรืองแสงเพื่อสำรวจ']),6500);
 setTimeout(()=>{ if(S.on&&!S.found.has('labs')){ sfx.knock(); $('#gLabs').setAttribute('transform','translate(-10 430) rotate(18 535 220)'); peek('formula'); say('👻 '+esc(L(['牆上的檢驗單自己掉了下來。地上還有一張撕下的紙……','The lab sheet drops off the wall by itself. And there is a torn page on the floor…','ผลแล็บบนผนังหล่นลงมาเอง และมีกระดาษที่ฉีกตกอยู่บนพื้น…'])),5500); } },7500); }
function stop(){ S.on=false; clearInterval(S.tick); ['#dark','#hud','#notes','#say','#veil','#boo'].forEach(s=>$(s).classList.add('hidden')); }
function lose(){ stop(); sfx.bad(); const e=$('#end'); e.innerHTML=`<h1>⏱ ${T('lose1')}</h1><p>${esc(T('lose2'))}</p><button class="btn" id="eAgain">${T('again')}</button>`; e.classList.remove('hidden'); $('#eAgain').onclick=start; }
function win(){ const left=S.time; stop(); sfx.good(); const e=$('#end');
 e.innerHTML=`<div style="width:110px">${ghostSVG(110)}</div><h1>🚪 ${T('win1')}</h1><p>${esc(T('win2'))}</p><p><b>${T('win3')}</b></p>
 <ul>${['cabinet','drawer','box'].map(k=>`<li>${esc(L(LOCKS[k].why))}</li>`).join('')}<li>${esc(L(FINAL.why))}</li></ul>
 <p>⏱ ${T('time')} ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')} · 👻 ${T('scares')} ${S.scares}</p><p style="font-size:20px;color:#a99fe0">${esc(T('proto'))}</p><button class="btn sm" id="eAgain">${T('again')}</button>`;
 e.classList.remove('hidden'); $('#eAgain').onclick=start; }
$('#bStart').onclick=()=>{ sfx.click(); start(); };
$('#bHint').onclick=hint;
$('#bMute').onclick=()=>{ A.mute=!A.mute; $('#bMute').textContent=A.mute?'🔇':'🔊'; };
paintTitle();
</script>
</body>
</html>
