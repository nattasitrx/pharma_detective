<style>

#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;background:radial-gradient(ellipse at 50% 20%,#1d1838 0%,#05040c 70%)}

#room{position:absolute;inset:0}

.hs{cursor:pointer;fill:#fff;fill-opacity:0;stroke:var(--gold);stroke-width:4;stroke-opacity:0;stroke-dasharray:10 12}

@keyframes flick{0%,100%{opacity:1}40%{opacity:.2}60%{opacity:1}80%{opacity:.45}}
#vig{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 0 #ff002200;transition:box-shadow .6s}
#shade{position:absolute;pointer-events:none;width:230px;opacity:0;transition:opacity .5s}
#hud{position:absolute;left:0;right:0;top:0;height:84px;display:flex;align-items:center;gap:16px;padding:0 22px;background:linear-gradient(#000d,#0000);pointer-events:none}
#hud>*{pointer-events:auto}
.pill{background:#14112ae6;border-radius:12px;padding:8px 18px;font-size:27px;font-weight:900;display:flex;align-items:center;gap:10px;box-shadow:0 0 0 2px #2f2957}
#gbar{width:300px;height:20px;border-radius:6px;background:#211c3d;overflow:hidden}
#gfill{height:100%;width:0;background:linear-gradient(90deg,#4a3f8a,#b0305a,#ff2244);transition:width .4s}

#say{position:absolute;left:50%;bottom:122px;transform:translateX(-50%);max-width:1200px;min-width:400px;background:#0e0b1ff2;border-radius:14px;padding:16px 28px;font-size:27px;line-height:1.45;font-weight:700;box-shadow:0 0 0 2px #3a3266;text-align:center;pointer-events:none}
#say b{color:var(--gold)}#say i{color:#ff8fa3;font-style:normal;letter-spacing:2px}
#notes{position:absolute;left:0;right:0;bottom:0;height:104px;display:flex;align-items:center;gap:12px;padding:0 22px;background:linear-gradient(#0000,#000e);overflow-x:auto;touch-action:pan-x}
#notes .nt{flex:0 0 auto;background:#1c1838;border-radius:10px;padding:10px 16px;font-size:21px;font-weight:800;box-shadow:0 0 0 2px #3a3266}
#notes .nt.item{background:#3a2a12;box-shadow:0 0 0 2px #b98a2a}
#notes .nt.held{background:var(--gold);color:#2a1030;box-shadow:0 0 0 4px #fff}
#notes .nt.new{animation:pop .6s}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}}
#notes .lab{font-size:20px;color:#8f86c4;font-weight:800;flex:0 0 auto}
#veil{position:absolute;inset:0;background:#030208d9;display:flex;align-items:center;justify-content:center}
.panel{width:1180px;max-height:810px;overflow:auto;background:#efe8da;color:#231c38;border-radius:18px;padding:28px 36px;box-shadow:0 0 0 4px #3a3266,0 30px 60px #000c;touch-action:pan-y}
.panel h3{margin:0 0 10px;font-size:34px}
.panel p{font-size:24px;line-height:1.5;margin:8px 0}
.panel table{border-collapse:collapse;width:100%;font-size:23px;margin:8px 0}
.panel td,.panel th{border:2px solid #c4b89f;padding:7px 12px;text-align:left}
.panel th{background:#e2d8c2}
.panel .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.panel .hint{font-size:20px;color:#6f6585}
.hand{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive,inherit;background:#1a1530;color:#ffb7c4;border-radius:10px;padding:14px 18px;font-size:25px;line-height:1.5;transform:rotate(-.5deg)}
.scr{display:inline-block;font-family:"Segoe Print","Bradley Hand",cursive;color:#c0172f;font-weight:900;font-size:30px;transform:rotate(-8deg)}
.panel.shake{animation:shake .4s}

.pad{display:grid;grid-template-columns:repeat(3,110px);gap:12px;justify-content:center;margin:14px 0}
.pad button{height:84px;border-radius:12px;background:#231c38;color:#ffd36b;font-size:40px;font-weight:900}
.disp{font-size:74px;font-weight:900;letter-spacing:22px;text-align:center;background:#12101f;color:#7fe3c0;border-radius:12px;padding:6px 0 6px 22px;width:420px;margin:0 auto;font-variant-numeric:tabular-nums;min-height:104px}
.opt{display:block;width:100%;text-align:left;background:#e2d8c2;border-radius:12px;padding:15px 20px;font-size:25px;font-weight:800;margin:10px 0;color:#231c38}
.opt.ok{background:#bff0dc}.opt.bad{background:#ffc9d2}
.wire{position:relative;height:330px;margin:10px 0}
.wire svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wire .n{position:absolute;width:430px;min-height:86px;display:flex;align-items:center;padding:8px 16px;border-radius:12px;background:#231c38;color:#f3efff;font-size:23px;font-weight:800;text-align:left}
.wire .n.r{right:0;background:#3a2a12;color:#ffd36b;justify-content:center;font-size:28px}
.wire .n.sel{box-shadow:0 0 0 5px #ff4d6a}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.steps button{background:#231c38;color:#f3efff;border-radius:12px;padding:16px;font-size:24px;font-weight:800;text-align:left;min-height:92px}
.steps button.done{background:#1f6b54}.steps button.bad{background:#7a2740}
.bar{height:22px;border-radius:8px;background:#c4b89f;overflow:hidden}.bar i{display:block;height:100%;background:#ff4d6a;width:100%;transition:width .25s linear}
#hunt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:70px;gap:16px;background:radial-gradient(circle at 50% 50%,#0000 20%,#1a0008cc 100%)}
#hunt h3{font-size:44px;margin:0;color:#ff8fa3;text-shadow:0 0 18px #ff0033}
#hunt p{font-size:26px;margin:0;font-weight:800}
#bHide{width:520px;height:120px;border-radius:18px;background:#12101f;color:#fff;font-size:34px;font-weight:900;box-shadow:0 0 0 4px #ff4d6a;touch-action:none}
#bHide.on{background:#000;box-shadow:0 0 0 4px #7fe3c0}
#hbar{width:520px}
#walker{position:absolute;top:150px;width:330px;pointer-events:none;filter:drop-shadow(0 0 16px #c0123a) drop-shadow(0 0 3px #ff4d6a)}
#flash{position:absolute;inset:0;background:#fff;pointer-events:none;opacity:0}
#flash.go{animation:fl .9s}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
#end{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#2a2356,#05040c 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:0 120px}
#end h1{font-size:52px;margin:0}
#end p{font-size:24px;line-height:1.5;margin:0;max-width:1250px}
#end ul{font-size:21px;text-align:left;line-height:1.45;margin:0;max-width:1250px}
</style>
</head>

function hiss(d=.9,v=.18,f=900){ if(A.mute) return; try{ const c=ac(), n=c.sampleRate*d, b=c.createBuffer(1,n,c.sampleRate), a=b.getChannelData(0); for(let i=0;i<n;i++) a[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n);

 t1:['停電夜','BLACKOUT','คืนไฟดับ'], t2:['藥師偵探 D · 精忠新村 4 樓','Pharma Detective D · Jingzhong Village, 4th floor','นักสืบเภสัช D · หมู่บ้านจิงจง ชั้น 4'],

function find(k){ const nw=!S.found.has(k); S.found.add(k); paintNotes(nw?k:null); if(nw) sfx.paper(); }
function take(k){ S.items.add(k); paintNotes(k); sfx.good(); }
function solved(id){ S.open.add(id); $('#nlock').textContent=S.open.size; bump(-30); sfx.good(); }
function panel(html){ S.busy=true; const v=$('#veil'); v.innerHTML=`<div class="panel">${html}</div>`; v.classList.remove('hidden'); return v.firstChild; }
function closePanel(){ $('#veil').classList.add('hidden'); S.busy=false; }

function won(id,gives,after){ solved(id); const p=panel(`<h3>🔓 ${T('open')}</h3><p>${esc(L(WHY[id]))}</p>${xBtn.replace('{X}',T('close'))}`); p.querySelector('#pX').onclick=()=>{ closePanel(); if(gives) showDoc(gives,after); else after&&after(); }; }
/* ---------- puzzle 1 + 4: keypad ---------- */
function keypad(id,title,len,code,gives,after){ let v='';
 const p=panel(`<h3>🔢 ${esc(title)}</h3><div class="disp" id="kd"></div><div class="pad">${[1,2,3,4,5,6,7,8,9,'⌫',0,'↵'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div>${xBtn.replace('{X}',T('close'))}`);
 const d=p.querySelector('#kd'), paint=()=>{ d.textContent=v.padEnd(len,'·'); }; paint();
 p.querySelector('#pX').onclick=()=>{ sfx.click(); closePanel(); };

 if(S.held!=='berotec') return say(L(['他抓著胸口。先從下面選一支吸入器。','He is clutching his chest. Choose an inhaler from the bar below first.','ลุงกุมหน้าอก เลือกยาพ่นจากแถบด้านล่างก่อน']));
 S.held=null; paintNotes(); const STEPS=[['搖一搖','Shake it','เขย่า'],['先把氣吐乾淨','Breathe all the way out','หายใจออกให้สุด'],['含住吸嘴，按下的同時慢慢深吸','Lips sealed: press and breathe in slowly at the same time','อมปากให้สนิท กดพร้อมกับสูดช้าๆ ลึกๆ'],['閉氣 10 秒','Hold the breath for 10 seconds','กลั้นหายใจ 10 วินาที']], BAD=[['按下之後才用力快吸','Press first, then suck in hard and fast','กดก่อน แล้วค่อยสูดแรงๆ เร็วๆ'],['噴完馬上吐掉','Spit it out straight away','พ่นเสร็จบ้วนทิ้งทันที']];
 const all=[...STEPS.map((t,i)=>({t,i})),...BAD.map(t=>({t,i:-1}))].sort(()=>Math.random()-.5); let at=0, air=100;
 const p=panel(`<h3>🫁 ${esc(L(['幫他用 Berotec：照順序點','Help him use the Berotec: tap the steps in order','ช่วยลุงใช้ Berotec: แตะขั้นตอนตามลำดับ']))}</h3><div class="bar"><i id="air"></i></div><div class="steps">${all.map((s,k)=>`<button data-k="${k}">${esc(L(s.t))}</button>`).join('')}</div>`);

 p.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ const s=all[+b.dataset.k]; if(b.classList.contains('done')) return;
   if(s.i===at){ b.classList.add('done'); b.textContent=(at+1)+'. '+b.textContent; at++; sfx.key(); if(at===STEPS.length){ clearInterval(iv); S.crisis=false; spot('lee').e.classList.remove('target'); $('#mouth').setAttribute('ry',7); won('crisis',null,()=>say(L(['李伯伯：「……好多了。原來……要慢慢吸。……門的鑰匙，你拿到了嗎？」','Mr. Lee: "…Better. So… you breathe in slowly. …The door key — have you got it?"','ลุงหลี่: "…ดีขึ้นแล้ว ที่แท้… ต้องสูดช้าๆ …กุญแจประตู ได้มาแล้วใช่ไหม?"']),7000)); } }
   else { b.classList.add('bad'); setTimeout(()=>b.classList.remove('bad'),500); air-=14; sfx.bad(); } }); }

 if(!S.items.has('key')) { sfx.knock(); return say(L(['鎖死了。鑰匙孔很新，門板上卻有三道舊的抓痕。','Jammed. The keyhole is new, but there are three old scratch marks on the door.','กลอนค้าง รูกุญแจยังใหม่ แต่บนบานประตูมีรอยข่วนเก่าสามรอย'])); }

 const O=[['Berotec 噴太多，心悸手抖','Too much Berotec — palpitations and tremor','พ่น Berotec มากไป ใจสั่นมือสั่น'],['21:00 把漏掉的早上藥和晚上藥一起吞 → 雙倍 glipizide → 兩小時後低血糖','At 21:00 he took the missed morning pills with the evening ones → double glipizide → hypoglycaemia two hours later','21:00 กินยาเช้าที่ลืมรวมกับยาเย็น → glipizide สองเท่า → น้ำตาลต่ำในสองชั่วโมง'],['房裡的「那個」把他推倒','The thing in the room pushed him','"สิ่งนั้น" ในห้องผลักเขา'],['Ponstan 讓他胃出血','Ponstan made his stomach bleed','Ponstan ทำให้เลือดออกในกระเพาะ']];

 if(S.held&&h!=='door'){ S.held=null; paintNotes(); return say(L(['用在這裡沒有反應。','Nothing happens here.','ใช้ตรงนี้ไม่เกิดอะไรขึ้น'])); }

 if(h==='inh'){ if(!S.items.has('berotec')){ $('#gInh').setAttribute('opacity','.15'); take('berotec'); take('spiolto'); return say(L(['你把兩支吸入器收進口袋。藍色那支快空了，綠色那支幾乎是滿的。','You pocket both inhalers. The blue one is nearly empty; the green one is almost full.','คุณเก็บยาพ่นทั้งสองตัวใส่กระเป๋า ตัวสีฟ้าใกล้หมด ตัวสีเขียวแทบยังเต็ม'])); } return; }

/* ---------- the presence ---------- */
function bump(d){ S.ghost=Math.max(0,Math.min(100,S.ghost+d)); $('#gfill').style.width=S.ghost+'%'; $('#vig').style.boxShadow=`inset 0 0 ${S.ghost*2.4}px ${S.ghost*.5}px rgba(120,0,20,${S.ghost/170})`; }
function flick(){ const d=$('#dark'); d.classList.remove('flick'); void d.offsetWidth; d.classList.add('flick'); }
function spot(h){ const e=$(`.hs[data-h="${h}"]`); return {x:+e.getAttribute('x')+e.getAttribute('width')/2, y:+e.getAttribute('y')+e.getAttribute('height')/2, e}; }
function glimpse(h){ const s=$('#shade'); s.innerHTML=shadeSVG(230); let x,y; if(h){ const t=spot(h); x=t.x; y=t.y; t.e.classList.add('want'); setTimeout(()=>t.e.classList.remove('want'),5000); } else { const a=Math.random()*6.28; x=S.lx+Math.cos(a)*260; y=S.ly+Math.sin(a)*120; }
 s.style.left=(x-115)+'px'; s.style.top=Math.max(90,y-330)+'px'; s.style.opacity='.9'; setTimeout(()=>{ s.style.opacity='0'; },h?1700:500); }
function nextTarget(){ const f=k=>S.found.has(k), o=k=>S.open.has(k); if(!f('formula')) return 'formula'; if(!f('labs')) return 'labs'; if(!f('card')) return 'card'; if(!o('cabinet')) return 'cabinet'; if(!S.items.has('berotec')) return 'inh'; if(!o('drawer')) return 'drawer';
 if(!f('bags')) return 'bags'; if(!o('box')) return 'box'; if(!f('window')) return 'window'; if(!o('clock')) return 'clock'; if(!o('crisis')) return 'lee'; return 'door'; }
function hint(){ if(S.busy) return; bump(18); sfx.whisper(); glimpse(nextTarget()); say('<i>'+esc(L(['……那邊。（它離你更近了）','…There. (It is closer to you now)','…ตรงนั้น (มันเข้ามาใกล้คุณขึ้นแล้ว)']))+'</i>'); }
function hunt(){ S.busy=true; $('#say').classList.add('hidden'); S.scares+=0; sfx.drone(); flick(); const H=$('#hunt'); let held=false, x=-340, hidT=0, done=false;
 H.innerHTML=`<div id="walker">${shadeSVG(330)}</div><h3>${T('huntT')}</h3><p>${esc(T('huntP'))}</p><div class="bar" id="hbar"><i></i></div><button id="bHide">${T('hide')}</button>`; H.classList.remove('hidden');
 const w=H.querySelector('#walker'), b=H.querySelector('#bHide'), bar=H.querySelector('#hbar i'); bar.style.width='0%';
 const set=v=>{ held=v; b.classList.toggle('on',v); $('#dark').classList.toggle('off',v); };
 b.addEventListener('pointerdown',e=>{ e.preventDefault(); try{ b.setPointerCapture(e.pointerId); }catch(_){} set(true); }); ['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,()=>set(false)));

   H.classList.add('hidden'); S.busy=!$('#veil').classList.contains('hidden'); };
 let grace=22; const iv=setInterval(()=>{ x+=17; w.style.left=x+'px'; if(Math.round(x)%9===0) sfx.beat(); if(held) hidT++; bar.style.width=Math.min(100,hidT/52*100)+'%';
   if(grace>0) grace--; else if(!held&&x>330&&x<1270) return end(false); if(x>1640) end(hidT>=40); },100); }
/* ---------- clock ---------- */
function tick(){ if(!S.on) return; if(!$('#hunt').classList.contains('hidden')) return;
 S.time--; const m=Math.floor(S.time/60), s=S.time%60; $('#clock').textContent=m+':'+String(s).padStart(2,'0'); $('#clock').style.color=S.time<150?'#ff4d6a':'';
 bump(S.crisis?.2:.6); if(S.ghost>55&&S.time%2===0) sfx.beat(); else if(S.ghost>25&&S.time%4===0) sfx.beat();
 if(S.time%53===0&&!S.busy){ [sfx.knock,sfx.whisper,()=>{ flick(); glimpse(); }][S.time%3](); }
 if(S.crisis&&S.time%6===0) sfx.wheeze();
 // hold the light on the fogged window
 if(!S.found.has('window')&&!S.busy){ const inW=S.lx>630&&S.lx<910&&S.ly>100&&S.ly<350; S.winT=inW?S.winT+1:0; $('#gFog').setAttribute('opacity',Math.min(1,S.winT/3)); if(S.winT>=3){ sfx.whisper(); showDoc('window'); } }
 if(S.time<=0) return lose(); if(S.ghost>=100){ if($('#veil').classList.contains('hidden')&&!S.crisis) hunt(); else bump(-2); } }
/* ---------- start / end ---------- */
function paintTitle(){ $('#t1').textContent=T('t1'); $('#t2').textContent=T('t2'); $('#t3').textContent=T('t3'); $('#t4').textContent=T('t4'); $('#bStart').textContent=T('start'); $('#bHint').textContent=T('hint');
 $$('#langs button').forEach(b=>b.classList.toggle('on',+b.dataset.l===LANG)); document.documentElement.lang=['zh-Hant','en','th'][LANG]; }
$$('#langs button').forEach(b=>b.onclick=()=>{ LANG=+b.dataset.l; paintTitle(); });
function start(){ Object.assign(S,{on:true,time:1080,ghost:0,found:new Set(),items:new Set(),open:new Set(),scares:0,busy:false,held:null,winT:0,crisis:false}); drawRoom(); paintNotes(); $('#nlock').textContent=0; bump(0);
 ['#title','#end','#veil','#hunt'].forEach(s=>$(s).classList.add('hidden')); ['#room','#dark','#hud','#notes'].forEach(s=>$(s).classList.remove('hidden')); $('#dark').classList.remove('off'); light(800,450);
 clearInterval(S.tick); S.tick=setInterval(tick,1000); sfx.knock();
 say(L(['啪。停電了。只剩手機的手電筒——<b>用手指移動光</b>，點亮起來的地方。','Snap. The power is out. Only your phone\'s torch is left: <b>move the light with your finger</b> and tap what it shows.','พรึ่บ ไฟดับ เหลือแค่ไฟฉายมือถือ <b>ใช้นิ้วเลื่อนแสง</b> แล้วแตะสิ่งที่แสงส่องเจอ']),6500);
 setTimeout(()=>{ if(S.on&&!S.found.has('labs')){ sfx.knock(); $('#gLabs').setAttribute('transform','translate(-10 430) rotate(18 535 220)'); glimpse('formula'); say('<i>'+esc(L(['牆上的紙自己掉了下來。','The paper drops off the wall by itself.','กระดาษบนผนังหล่นลงมาเอง']))+'</i>',4500); } },7000); }
function stop(){ S.on=false; clearInterval(S.tick); ['#dark','#hud','#notes','#say','#veil','#hunt'].forEach(s=>$(s).classList.add('hidden')); bump(-100); }
function lose(){ stop(); sfx.bad(); const e=$('#end'); e.innerHTML=`<h1>⏱ ${T('lose1')}</h1><p>${esc(T('lose2'))}</p><button class="btn" id="eAgain">${T('again')}</button>`; e.classList.remove('hidden'); $('#eAgain').onclick=start; }
function win(){ const left=S.time, sc=S.scares; stop(); sfx.good(); const e=$('#end');
 e.innerHTML=`<h1>🚪 ${T('win1')}</h1><p>${esc(T('win2'))}</p><p><b>${T('win3')}</b></p><ul>${['cabinet','drawer','box','clock','crisis','door'].map(k=>`<li>${esc(L(WHY[k]))}</li>`).join('')}</ul>
 <p>⏱ ${T('time')} ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')} · 👁 ${T('scares')} ${sc}</p><p style="font-size:19px;color:#8f86c4">${esc(T('proto'))}</p><button class="btn sm" id="eAgain">${T('again')}</button>`;
 e.classList.remove('hidden'); $('#eAgain').onclick=start; }
$('#bStart').onclick=()=>{ sfx.click(); start(); };
$('#bHint').onclick=hint;
$('#bMute').onclick=()=>{ A.mute=!A.mute; $('#bMute').textContent=A.mute?'🔇':'🔊'; };
paintTitle();
</script>
</body>
</html>
