<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>藥師偵探 · 請老師確認</title>
<style>
:root{--ink:#1d1d24;--muted:#5d5d6b;--line:#d9d9e0;--bg:#f4f4f7;--card:#fff;--acc:#0f6b6b;--acc2:#e6f2f2;--warn:#a5520c;--warnbg:#fff4e6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Leelawadee UI","Thonburi","Noto Sans Thai",sans-serif;font-size:16px;line-height:1.55;padding-bottom:84px}
a{color:var(--acc)}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.topbar{position:sticky;top:0;z-index:15;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:10px;padding-top:8px;padding-bottom:8px}
.topbar .brand{flex:1;font-weight:800;font-size:14px;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langs{display:flex;gap:4px;background:#eef0f3;border-radius:99px;padding:3px}
.langs button{font:inherit;font-size:14px;font-weight:700;border:none;background:none;border-radius:99px;padding:4px 12px;cursor:pointer;color:var(--muted)}
.langs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
header.top{background:#fff;border-bottom:1px solid var(--line);padding:18px 0 16px;margin-bottom:6px}
h1{font-size:25px;line-height:1.3;margin:0 0 6px}
.intro p{margin:6px 0;max-width:900px}
.grp{font-size:20px;font-weight:800;margin:28px 0 10px;padding-left:10px;border-left:5px solid var(--acc)}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 18px;scroll-margin-top:60px}
.qh{display:flex;gap:10px;align-items:flex-start;padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.code{flex:none;background:var(--ink);color:#fff;font-weight:800;border-radius:7px;padding:2px 9px;font-size:15px;margin-top:2px}
.qh h2{font-size:19px;line-height:1.4;margin:0}
.qb{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:20px;padding:14px 16px 16px;align-items:start}
.fig{position:sticky;top:58px}
.fig a{display:block}
.fig img{display:block;width:100%;height:auto;max-height:calc(100vh - 110px);object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff}
.fig .cap{font-size:12px;color:var(--muted);margin-top:4px}
.q.wide .qb{grid-template-columns:1fr}
.q.wide .fig{position:static}
.q.wide .fig img{max-height:none}
.choose{border:2px solid var(--acc);border-radius:12px;padding:10px 12px 12px;background:#fbfefe}
.choose .lab2{font-weight:800;color:var(--acc);font-size:14px;margin-bottom:2px}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 9px;border-radius:9px;cursor:pointer;margin:3px 0;border:1px solid transparent}
label.opt:hover{background:var(--acc2)}
label.opt input[type=radio]{width:21px;height:21px;margin:2px 0 0;flex:none;accent-color:var(--acc)}
label.opt.on{background:var(--acc2);border-color:#b6dada}
.cur{display:inline-block;font-size:12px;border:1px solid var(--muted);color:var(--muted);border-radius:5px;padding:0 6px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.inl{font:inherit;font-size:15px;padding:5px 8px;border:1.5px solid var(--line);border-radius:6px;margin-top:5px;width:min(100%,280px);display:block}
textarea{font:inherit;font-size:15px;width:100%;min-height:56px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;resize:vertical}
.memo{margin-top:8px}
.memo .lab3{font-size:13px;font-weight:700;margin-bottom:3px;color:var(--muted)}
.info{margin-top:14px;font-size:14.5px}
.info .row{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:7px 0;border-top:1px dashed var(--line)}
.info .row:first-child{border-top:none}
.info .lab{font-weight:800;color:var(--muted);font-size:13px}
.info .row.found .lab{color:var(--acc)}
.tb{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0}
.tb th,.tb td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
.tb th{background:#f0f0f4}
.note{font-size:14px;border-left:3px solid var(--acc);padding:2px 8px;margin:6px 0}
.refs{margin-top:10px;font-size:13.5px}
.refs b{color:var(--muted);font-size:12.5px}
.refs a{display:block;margin:3px 0;word-break:break-word}
.refs a::before{content:"↗ "}
.erow{display:grid;grid-template-columns:44px 1fr 270px;gap:14px;padding:13px 16px;border-top:1px solid var(--line);align-items:start}
.erow:first-child{border-top:none}
.erow .c{font-weight:800;text-align:center;background:#f0f0f4;border-radius:6px;padding:2px 0}
.erow .refs{margin-top:6px}
.erow .pick label.opt{padding:5px 7px;margin:0 0 2px}
.erow .pick input.inl{width:100%}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:14px 16px 16px}
.fbox .h{font-weight:800;font-size:17px}
.fbox .eg{font-size:13px;color:var(--muted);margin:2px 0 6px}
.fbox .cases{font-size:14px;margin:4px 0 6px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.fbox .cases input{width:17px;height:17px;accent-color:var(--acc);vertical-align:-3px}
.fbox textarea{min-height:170px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.06);z-index:10}
.bar .wrap{display:flex;gap:12px;align-items:center;padding-top:10px;padding-bottom:10px}
.bar .st{flex:1;font-size:14px;color:var(--muted);min-width:0}
.bar .st b{color:var(--ink)}
.bar .st.err{color:var(--warn)}
.prog{font-size:13px;color:var(--muted);white-space:nowrap}
button.go{font:inherit;font-weight:800;background:var(--acc);color:#fff;border:none;border-radius:10px;padding:10px 22px;cursor:pointer;white-space:nowrap}
button.go:disabled{opacity:.5}
button.ghost{font:inherit;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .box{background:#fff;border-radius:14px;max-width:460px;width:100%;padding:22px;text-align:center}
.modal .big{font-size:40px}
.rcard{background:#fff;border:1px solid var(--line);border-radius:14px;margin:0 0 18px;overflow:hidden}
.rhead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:#fafafc}
.pill{font-size:13px;border-radius:99px;padding:1px 9px;border:1px solid var(--line)}
.pill.ok{background:#e7f6ec;border-color:#9fd5b0}
.pill.wait{background:var(--warnbg);border-color:#f0c48e}
.rt{border-collapse:collapse;width:100%;font-size:14.5px}
.rt th,.rt td{border-top:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}
.rt th{background:#f6f6f9;font-size:13px}
.rt td.code2{font-weight:800;white-space:nowrap}
.chg{display:inline-block;font-size:12px;font-weight:700;color:var(--warn);background:var(--warnbg);border:1px solid #f0c48e;border-radius:5px;padding:0 6px;margin-left:4px}
.none{color:var(--muted)}
.keybox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.keybox input{font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;min-width:260px}
.msg{margin:10px 0;color:var(--warn)}
@media (max-width:900px){.qb{grid-template-columns:1fr}.fig{position:static}.fig img{max-height:none}.erow{grid-template-columns:40px 1fr}.erow .pick{grid-column:2}.fgrid{grid-template-columns:1fr}}
@media (max-width:520px){h1{font-size:21px}.info .row{grid-template-columns:1fr;gap:1px}.bar .prog{display:none}.topbar .brand{font-size:12.5px}.langs button{padding:4px 9px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const D={"Q": [{"code": "Q1", "grp": "all", "fig": "f1_age.png", "age": true, "t": {"zh": "年齡要以哪一份資料為準？", "en": "Which source should set the patient's age?", "th": "ยึดอายุจากเอกสารไหน"}, "info": [[{"zh": "資料上", "en": "In the documents", "th": "ในเอกสาร"}, {"zh": "三個案例藥袋上的年齡，都和收據上的出生日期（換算到調劑日）不一致。", "en": "In all three cases, the age printed on the bags does not match the birth date on the receipt (age counted to the dispensing date).", "th": "อายุบนซองยาไม่ตรงกับวันเกิดในใบเสร็จทั้ง 3 เคส (นับอายุถึงวันที่บนซอง)"}], [{"zh": "遊戲目前", "en": "In the game now", "th": "ในเกมตอนนี้"}, {"zh": "三個案例做法不同：A 依藥袋（出生日期改為 1959/11/7，但收據圖片仍是 1955）；C 依出生日期（學生用藥袋的 58 歲算 CrCl 會被判錯）；D 依出生日期（藥袋已改成 88）。", "en": "Each case is handled differently: A follows the bags (birth date changed to 1959/11/7, but the receipt image still says 1955); C follows the birth date (students who use 58 from the bag for CrCl are marked wrong); D follows the birth date (the bags were already changed to 88).", "th": "ตอนนี้แต่ละเคสใช้คนละหลัก: A ยึดซอง (รูปใบเสร็จยังเป็น 1955) · C ยึดวันเกิด (นักศึกษาที่ใช้อายุ 58 จากซองจะถูกบอกว่าผิด) · D ยึดวันเกิด (แก้ซองเป็น 88 แล้ว)"}]], "opts": [{"id": "birth", "t": {"zh": "以收據的出生日期為準：A 改為 65 歲（eGFR ≈ 23、CrCl ≈ 32.3），修改 A、C 藥袋圖片上的年齡", "en": "Use the receipt birth date: Case A becomes 65 (eGFR ≈ 23, CrCl ≈ 32.3); change the ages on the A and C bag images", "th": "ยึดวันเกิดในใบเสร็จ: A เป็น 65 ปี (eGFR ≈ 23, CrCl ≈ 32.3) แก้อายุบนรูปซองของ A และ C"}}, {"id": "bag", "t": {"zh": "以藥袋的年齡為準：C 改為 58 歲（eGFR ≈ 52.5、CrCl ≈ 42.8）、D 改回 85 歲（CrCl ≈ 59），修改 A、C 收據上的出生日期", "en": "Use the age on the bags: Case C becomes 58 (eGFR ≈ 52.5, CrCl ≈ 42.8) and Case D goes back to 85 (CrCl ≈ 59); change the birth dates on the A and C receipts", "th": "ยึดอายุบนซอง: C เป็น 58 ปี (eGFR ≈ 52.5, CrCl ≈ 42.8) · D กลับเป็น 85 ปี (CrCl ≈ 59) · แก้วันเกิดในรูปใบเสร็จของ A และ C"}}, {"id": "keep", "t": {"zh": "維持目前做法（各案例不同），只把 A 收據改成 1959/11/07", "en": "Keep the current approach (different per case); only change Case A's receipt to 1959/11/07", "th": "คงแบบปัจจุบัน แค่แก้รูปใบเสร็จ A เป็น 1959/11/07"}, "cur": true}]}, {"code": "A2", "grp": "A", "fig": "f2_clarinase.png", "t": {"zh": "Clarinase 的含量是多少？", "en": "What strength is Clarinase?", "th": "Clarinase ความแรงเท่าไร"}, "info": [[{"zh": "資料上", "en": "In the documents", "th": "ในเอกสาร"}, {"zh": "三個案例的收據都只寫「Clarinase 7 粒，1 天 1 次，7 天」，沒有含量。", "en": "All three receipts only say \"Clarinase, 7 tablets, once daily, 7 days\", with no strength.", "th": "ใบเสร็จทั้ง 3 เคสเขียนแค่ Clarinase 7 เม็ด วันละครั้ง 7 วัน ไม่มีความแรง"}], [{"zh": "遊戲目前", "en": "In the game now", "th": "ในเกมตอนนี้"}, {"zh": "視為 loratadine 5 mg + pseudoephedrine 120 mg，每日一次。Case A 重複用藥任務：pseudoephedrine 每日合計 420 mg（Peace 60 + Finska LP 240 + Clarinase 120），超過上限 240 mg。", "en": "Treated as loratadine 5 mg + pseudoephedrine 120 mg once daily. Case A's duplication mission says pseudoephedrine totals 420 mg/day (Peace 60 + Finska LP 240 + Clarinase 120), above the 240 mg maximum.", "th": "ถือเป็น loratadine 5 + pseudoephedrine 120 มก. วันละครั้ง ภารกิจยาซ้ำ Case A บอกว่ารวม 420 มก./วัน เกินขีดสูงสุด 240 มก."}], [{"zh": "查到的資料", "en": "What we found", "th": "ข้อมูลที่ค้นเจอ"}, {"zh": "台灣的 Clarinase（康瑞斯持續性藥效錠）為 loratadine 5 mg + pseudoephedrine 120 mg；pseudoephedrine 每日上限 240 mg。", "en": "Clarinase in Taiwan (康瑞斯持續性藥效錠) is loratadine 5 mg + pseudoephedrine 120 mg; the pseudoephedrine maximum is 240 mg/day.", "th": "Clarinase ในไต้หวันคือ loratadine 5 + pseudoephedrine 120 มก. · pseudoephedrine สูงสุด 240 มก./วัน"}]], "opts": [{"id": "5_120", "t": {"zh": "5 mg／120 mg，每日一次，合計 420 mg", "en": "5 mg/120 mg once daily, total 420 mg/day", "th": "แบบ 5/120 มก. วันละครั้ง รวม 420 มก./วัน"}, "cur": true}, {"id": "10_240", "t": {"zh": "Clarinase 24 小時錠 10 mg／240 mg，合計 540 mg", "en": "Clarinase 24-hour tablet 10 mg/240 mg, total 540 mg/day", "th": "แบบ 24 ชม. 10/240 มก. รวม 540 มก./วัน"}}], "refs": ["clar_tw", "pse"]}, {"code": "A3", "grp": "A", "fig": "f3_ponstan.png", "t": {"zh": "Ponstan 藥袋用途寫「經血過多」，但病人是男性", "en": "The Ponstan bag lists \"heavy menstrual bleeding\" as a use, but the patient is a man", "th": "ซอง Ponstan มีข้อบ่งใช้ \"ประจำเดือนมามาก\" แต่ผู้ป่วยเป็นชาย"}, "info": [[{"zh": "資料上", "en": "In the documents", "th": "ในเอกสาร"}, {"zh": "用途：消炎、解熱、鎮痛、經血過多及其他相關症狀。", "en": "Uses: anti-inflammatory, fever, pain, heavy menstrual bleeding and related symptoms.", "th": "ข้อบ่งใช้บนซอง: ลดอักเสบ ลดไข้ แก้ปวด ประจำเดือนมามาก"}], [{"zh": "遊戲目前", "en": "In the game now", "th": "ในเกมตอนนี้"}, {"zh": "任務說明告訴學生：這是藥袋上的通用文字，不是開藥的原因。", "en": "The mission tells students this is generic text printed on the bag, not the reason it was prescribed.", "th": "ภารกิจอธิบายว่าเป็นข้อความทั่วไปบนซอง ไม่ใช่เหตุผลที่สั่งยา"}]], "opts": [{"id": "keep", "t": {"zh": "保留，當作教學點", "en": "Keep it as a teaching point", "th": "เก็บไว้เป็นจุดสอน"}, "cur": true}, {"id": "remove", "t": {"zh": "從圖片刪除「經血過多」", "en": "Remove \"heavy menstrual bleeding\" from the image", "th": "ลบคำนี้ออกจากรูป"}}]}, {"code": "C1", "grp": "C", "fig": "f4_fosamax.png", "t": {"zh": "Fosamax Plus 含多少維生素 D？", "en": "How much vitamin D is in Fosamax Plus?", "th": "Fosamax Plus มีวิตามินดีเท่าไร"}, "info": [[{"zh": "資料上", "en": "In the documents", "th": "ในเอกสาร"}, {"zh": "B醫院骨科藥袋只寫「FOSAMAX PLUS (Alendronate) 70MG」，沒有維生素 D。", "en": "Hospital B's orthopaedic bag only says \"FOSAMAX PLUS (Alendronate) 70MG\", with no vitamin D.", "th": "ซอง รพ.B เขียนแค่ alendronate 70 มก. ไม่มีวิตามินดี"}], [{"zh": "遊戲目前", "en": "In the game now", "th": "ในเกมตอนนี้"}, {"zh": "alendronate 70 mg + vitamin D3 2800 IU；和問題 P7（鈣與維生素 D 是否足夠）有關。", "en": "alendronate 70 mg + vitamin D3 2800 IU; this matters for problem P7 (enough calcium and vitamin D?).", "th": "เกมใส่เป็น alendronate 70 มก. + D3 2800 IU เกี่ยวกับปัญหา P7 (แคลเซียม/วิตามินดีพอไหม)"}], [{"zh": "查到的資料", "en": "What we found", "th": "ข้อมูลที่ค้นเจอ"}, {"zh": "台灣上市的福善美保骨錠為 70 mg／5600 IU。", "en": "In Taiwan, Fosamax Plus is sold as 70 mg/5600 IU.", "th": "ในไต้หวัน Fosamax Plus มีความแรง 70 มก./5600 IU"}]], "opts": [{"id": "2800", "t": {"zh": "70 mg + D3 2800 IU", "en": "70 mg + D3 2800 IU", "th": "70 มก. + D3 2800 IU"}, "cur": true}, {"id": "5600", "t": {"zh": "70 mg + D3 5600 IU（台灣上市的含量）", "en": "70 mg + D3 5600 IU (the strength sold in Taiwan)", "th": "70 มก. + D3 5600 IU (ความแรงที่ขายในไต้หวัน)"}}, {"id": "none", "t": {"zh": "只當作 alendronate，刪除遊戲中的維生素 D", "en": "Treat it as alendronate only and remove vitamin D from the game", "th": "ถือเป็น alendronate อย่างเดียว เอาวิตามินดีออกจากเกม"}}], "refs": ["fosa_tw"]}, {"code": "C2", "grp": "C", "fig": "f5_microalb.png", "t": {"zh": "微量白蛋白 2.8 可以判定為 A2 嗎？", "en": "Can a microalbumin of 2.8 be called A2?", "th": "ไมโครอัลบูมิน 2.8 สรุปว่าเป็น A2 ได้ไหม"}, "info": [[{"zh": "資料上", "en": "In the documents", "th": "ในเอกสาร"}, {"zh": "MicroALB 2.8（參考值 <1.9），只在 2021/9/20 測一次，沒有單位，也沒有 ACR。", "en": "MicroALB 2.8 (reference <1.9), measured once on 2021/9/20, with no unit and no ACR.", "th": "MicroALB 2.8 (ค่าอ้างอิง <1.9) วัดครั้งเดียว ไม่มีหน่วย ไม่มี ACR"}], [{"zh": "遊戲目前", "en": "In the game now", "th": "ในเกมตอนนี้"}, {"zh": "問題 P13 寫「eGFR ≈ 52（G3a）、尿微白蛋白 2.8（A2）」。", "en": "Problem P13 says \"eGFR ≈ 52 (G3a), urine microalbumin 2.8 (A2)\".", "th": "ปัญหา P13 เขียนว่า eGFR ≈ 52 (G3a) ไมโครอัลบูมิน 2.8 (A2)"}]], "opts": [{"id": "a2", "t": {"zh": "可以，維持 A2", "en": "Yes, keep A2", "th": "ได้ คง A2 ไว้"}, "cur": true}, {"id": "nograde", "t": {"zh": "改成只寫「微量白蛋白尿」，不分級", "en": "Just say \"albuminuria\", without a category", "th": "เขียนแค่ \"มีอัลบูมินในปัสสาวะ\" ไม่ระบุระดับ"}}], "refs": ["kdigo"]}, {"code": "C3", "grp": "C", "fig": "f6_labs_ac.png", "wide": true, "t": {"zh": "Case C 的檢驗數值和 Case A 幾乎相同", "en": "Case C's lab values are almost the same as Case A's", "th": "ค่าแล็บ Case C แทบเหมือน Case A"}, "info": [[{"zh": "資料上", "en": "In the documents", "th": "ในเอกสาร"}, {"zh": "GLU-AC、HbA1c（7.1/7.8/8.3）、TC、LDL、HDL、MicroALB 都和 Case A 相同；只有 TG（每個值多 100）、Cr、T-score   eH:{zh:'我們自行補充的情節與答案',en:'Details and answers we added',th:'เนื้อหาที่ทีมแต่งเพิ่ม'}, eSub:{zh:'原始案例資料沒有這些細節，由團隊補充，請確認',en:'The case materials don\'t include these details; we added them. Please check.',th:'เอกสารเคสไม่มีรายละเอียดเหล่านี้ ทีมแต่งเพิ่ม ขอให้อาจารย์ตรวจ'},
  ok:{zh:'同意',en:'Agree',th:'เห็นด้วย'}, fix:{zh:'需修改',en:'Needs change',th:'ต้องแก้'}, enote:{zh:'備註',en:'Notes',th:'หมายเหตุ'},
  fH:{zh:'其他想新增、調整或修改的地方',en:'Anything else to add, adjust or fix',th:'สิ่งที่อยากเพิ่ม ปรับ หรือแก้เพิ่มเติม'}, fSub:{zh:'任何想法都可以',en:'Anything at all',th:'เรื่องอะไรก็ได้'},
  case:{zh:'案例',en:'Case',th:'เคส'}, all:{zh:'全部',en:'All',th:'ทั้งหมด'},
  none:{zh:'尚未作答',en:'Not answered yet',th:'ยังไม่ได้ตอบ'}, saving:{zh:'儲存中…',en:'Saving…',th:'กำลังบันทึก…'}, saved:{zh:'✓ 已自動儲存',en:'✓ Saved',th:'✓ บันทึกแล้ว'}, sent:{zh:'已送出',en:'sent',th:'ส่งแล้ว'},
  err:{zh:'⚠ 暫時無法連線，答案先存在這台裝置，稍後會自動重試',en:'⚠ Offline for now — answers are kept on this device and will be sent automatically',th:'⚠ ยังส่งไม่ได้ เก็บไว้ในเครื่องก่อน จะลองส่งใหม่อัตโนมัติ'},
  prog:{zh:'已回答 {n}/{m} 題',en:'Answered {n}/{m}',th:'ตอบแล้ว {n}/{m} ข้อ'}, send:{zh:'送出',en:'Send',th:'ส่ง'},
  thx:{zh:'已送出，謝謝老師！',en:'Sent — thank you!',th:'ส่งแล้ว ขอบคุณค่ะ/ครับ'}, thx2:{zh:'之後若想修改，直接在這一頁修改即可，會自動更新。',en:'You can still change anything on this page later; it updates automatically.',th:'แก้ภายหลังได้ในหน้านี้ ระบบจะอัปเดตเอง'},
  off:{zh:'暫時無法連線',en:'No connection right now',th:'ยังเชื่อมต่อไม่ได้'}, off2:{zh:'答案已存在這台裝置，連上網路後會自動送出。',en:'Your answers are kept on this device and will be sent once you are online.',th:'คำตอบเก็บไว้ในเครื่อง จะส่งเองเมื่อออนไลน์'}, okb:{zh:'好',en:'OK',th:'ตกลง'},
  rTitle:{zh:'老師的回覆',en:'The professor\'s replies',th:'คำตอบของอาจารย์'}, key:{zh:'結果金鑰',en:'Results key',th:'รหัสรับผล'}, load:{zh:'載入',en:'Load',th:'โหลด'}, copy:{zh:'複製文字',en:'Copy as text',th:'คัดลอกเป็นข้อความ'},
  rNone:{zh:'還沒有回覆',en:'No replies yet',th:'ยังไม่มีคำตอบ'}, rCount:{zh:'{n} 份回覆',en:'{n} replies',th:'{n} คำตอบ'}, rBad:{zh:'金鑰錯誤',en:'Wrong key',th:'รหัสรับผลไม่ถูกต้อง'}, rNet:{zh:'無法連線',en:'Cannot reach the server',th:'ต่อเซิร์ฟเวอร์ไม่ได้'},
  rLoading:{zh:'載入中…',en:'Loading…',th:'กำลังโหลด…'}, copied:{zh:'已複製',en:'Copied',th:'คัดลอกแล้ว'}, rChg:{zh:'要改遊戲',en:'change the game',th:'ต้องแก้เกม'},
  rSent:{zh:'已送出',en:'Sent',th:'ส่งแล้ว'}, rWip:{zh:'填寫中',en:'In progress',th:'ยังไม่กดส่ง'}, rUpd:{zh:'更新',en:'Updated',th:'อัปเดต'},
  hQ:{zh:'題',en:'#',th:'ข้อ'}, hT:{zh:'題目',en:'Question',th:'หัวข้อ'}, hA:{zh:'選擇',en:'Answer',th:'ที่เลือก'}, hN:{zh:'備註',en:'Notes',th:'หมายเหตุ'},
  needKey:{zh:'請輸入結果金鑰',en:'Enter the results key',th:'ใส่รหัสรับผลก่อน'}
};
const t=(k,v)=>{ let s=L(U[k]); if(v) Object.keys(v).forEach(x=>s=s.replace('{'+x+'}',v[x])); return s; };
function topbar(){ return `<div class="topbar"><div class="wrap"><div class="brand">${t('brand')}</div><div class="langs">${[['zh','中文'],['en','English'],['th','ไทย']].map(([k,n])=>`<button data-lang="${k}" class="${LANG===k?'on':''}">${n}</button>`).join('')}</div></div></div>`; }
function bindLangs(render){ document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ LANG=b.dataset.lang; ls.set(RESULTS?'pdrev_lang_r':'pdrev_lang',LANG); document.documentElement.lang=LANG==='zh'?'zh-Hant':LANG; const y=scrollY; render(); scrollTo(0,y); }); }
const refsHTML=ids=>ids&&ids.length?`<div class="refs"><b>${t('refs')}</b>${ids.map(id=>{ const r=D.REF[id]; return r?`<a href="${r.u}" target="_blank" rel="noopener">${esc(r.l)}</a>`:''; }).join('')}</div>`:'';
const ageHTML=()=>{ const A=D.AGE; return `<table class="tb"><tr>${A.head.map(h=>`<th>${L(h)}</th>`).join('')}</tr>${A.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(L(c))}</td>`).join('')}</tr>`).join('')}</table><p class="note">${L(A.note)}</p>`; };

document.documentElement.lang=LANG==='zh'?'zh-Hant':LANG;
if(RESULTS) resultsView(); else formView();

/* ===================== the form ===================== */
function formView(){
  let ID=ls.get('pdrev_id'); if(!ID){ ID='rev-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); ls.set('pdrev_id',ID); }
  const A=Object.assign({q:{}, e:{}, f:{}, done:false}, ls.get('pdrev_ans')||{});
  let tSave=null, busy=false, again=false, retry=null, lastSaved=null, lastErr=false;
  function render(){
    let h=topbar()+`<header class="top"><div class="wrap"><h1>${t('title')}</h1><div class="intro"><p>${t('i1')}</p><p>${t('i2')}</p>
      <p>${t('play')}：<a href="https://nattasitrx.github.io/pharma_detective/preview/" target="_blank" rel="noopener">nattasitrx.github.io/pharma_detective/preview</a></p></div></div></header><main class="wrap">`;
    let g='';
    D.Q.forEach(q=>{
      if(q.grp!==g){ g=q.grp; h+=`<div class="grp">${t('g_'+g)}</div>`; }
      const a=A.q[q.code]||{};
      const opts=q.opts.map(o=>`<label class="opt${a.v===o.id?' on':''}"><input type="radio" name="${q.code}" value="${o.id}"${a.v===o.id?' checked':''}><div>${L(o.t)}${o.cur?`<span class="cur">${t('cur')}</span>`:''}${o.inp?`<input class="inl" data-inp="${q.code}" maxlength="80" value="${esc(a.inp||'')}">`:''}</div></label>`).join('');
      const info=q.info.map(r=>`<div class="row${r[0].en==='What we found'?' found':''}"><div class="lab">${L(r[0])}</div><div>${L(r[1])}</div></div>`).join('');
      h+=`<section class="q${q.wide?' wide':''}" id="${q.code}"><div class="qh"><span class="code">${q.code}</span><h2>${L(q.t)}</h2></div><div class="qb">
        <div class="fig"><a href="img/${q.fig}" target="_blank" rel="noopener"><img src="img/${q.fig}" alt="${esc(L(q.t))}" loading="lazy"></a><div class="cap">${t('zoom')}</div></div>
        <div><div class="choose"><div class="lab2">${t('pick')}</div>${opts}<div class="memo"><div class="lab3">${t('note')}</div><textarea data-note="${q.code}" maxlength="2000">${esc(a.note||'')}</textarea></div></div>
        <div class="info">${info}${q.age?ageHTML():''}</div>${refsHTML(q.refs)}</div></div></section>`;
    });
    h+=`<div class="grp">${t('eH')}</div><section class="q" id="E"><div class="qh"><span class="code">E</span><h2>${t('eSub')}</h2></div><div>`;
    D.E.forEach(r=>{ const a=A.e[r.id]||{};
      h+=`<div class="erow"><div class="c">${r.c}</div><div>${L(r.t)}${refsHTML(r.refs)}</div><div class="pick">
        <label class="opt${a.v==='ok'?' on':''}"><input type="radio" name="${r.id}" value="ok"${a.v==='ok'?' checked':''}><div>${t('ok')}</div></label>
        <label class="opt${a.v==='fix'?' on':''}"><input type="radio" name="${r.id}" value="fix"${a.v==='fix'?' checked':''}><div>${t('fix')}</div></label>
        <input class="inl" data-enote="${r.id}" maxlength="400" placeholder="${t('enote')}" value="${esc(a.note||'')}"></div></div>`; });
    h+=`</div></section><div class="grp">${t('fH')}</div><section class="q" id="F"><div class="qh"><span class="code">F</span><h2>${t('fSub')}</h2></div><div class="fgrid">`;
    D.F.forEach(f=>{ const a=A.f[f.id]||{}, cs=a.cases||[];
      h+=`<div class="fbox"><div class="h">${L(f.t)}</div><div class="eg">${L(f.eg)}</div>
        <div class="cases">${t('case')}${['A','C','D','all'].map(c=>`<label><input type="checkbox" data-fcase="${f.id}" value="${c}"${cs.includes(c)?' checked':''}> ${c==='all'?t('all'):c}</label>`).join('')}</div>
        <textarea data-ftext="${f.id}" maxlength="4000">${esc(a.text||'')}</textarea></div>`; });
    h+=`</div></section></main><div class="bar"><div class="wrap"><div class="st" id="st"></div><div class="prog" id="prog"></div><button class="go" id="send">${t('send')}</button></div></div>`;
    $('#app').innerHTML=h; bindLangs(render); status(); progress();
    $('#send').onclick=sendNow;
  }
  function status(k){ const el=$('#st'); if(!el) return; if(k) lastErr=(k==='err');
    el.classList.toggle('err',lastErr);
    el.innerHTML=k==='saving'?t('saving'):lastErr?t('err'):lastSaved?`<b>${t('saved')}</b> ${hm(lastSaved)}${A.done?' · '+t('sent'):''}`:(Object.keys(A.q).length?t('saved'):t('none')); }
  function progress(){ const n=D.Q.filter(q=>(A.q[q.code]||{}).v).length+D.E.filter(r=>(A.e[r.id]||{}).v).length, m=D.Q.length+D.E.length; const el=$('#prog'); if(el) el.textContent=t('prog',{n,m}); }
  async function save(){ if(busy){ again=true; return; } busy=true; status('saving'); clearTimeout(retry);
    const body={id:ID, classCode:CLS, case:'review', updated:new Date().toISOString(), done:!!A.done, lang:LANG, student:{name:'老師', sid:''}, review:{v:2, q:A.q, e:A.e, f:A.f}};
    try{ const r=await fetch(API+'/api/submit',{method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(body)}); const j=await r.json(); if(!j||!j.ok) throw new Error('not ok'); lastSaved=new Date(); status('ok'); }
    catch(e){ status('err'); retry=setTimeout(save, 15000); }
    busy=false; if(again){ again=false; save(); } }
  const changed=now=>{ ls.set('pdrev_ans',A); progress(); clearTimeout(tSave); tSave=setTimeout(save, now?0:1200); };
  const q=c=>A.q[c]||(A.q[c]={});
  document.addEventListener('change', ev=>{ const x=ev.target;
    if(x.type==='radio'){ document.querySelectorAll(`input[name="${x.name}"]`).forEach(y=>y.closest('label').classList.toggle('on',y.checked));
      if(D.Q.some(z=>z.code===x.name)) q(x.name).v=x.value; else (A.e[x.name]||(A.e[x.name]={})).v=x.value; changed(true); }
    if(x.dataset.fcase){ const f=A.f[x.dataset.fcase]||(A.f[x.dataset.fcase]={}); f.cases=[...document.querySelectorAll(`input[data-fcase="${x.dataset.fcase}"]:checked`)].map(y=>y.value); changed(true); } });
  document.addEventListener('input', ev=>{ const x=ev.target;
    if(x.dataset.note){ q(x.dataset.note).note=x.value; changed(); }
    else if(x.dataset.inp){ q(x.dataset.inp).inp=x.value; const r=x.closest('label').querySelector('input[type=radio]'); if(r&&!r.checked){ r.checked=true; r.dispatchEvent(new Event('change',{bubbles:true})); } changed(); }
    else if(x.dataset.enote){ (A.e[x.dataset.enote]||(A.e[x.dataset.enote]={})).note=x.value; changed(); }
    else if(x.dataset.ftext){ (A.f[x.dataset.ftext]||(A.f[x.dataset.ftext]={})).text=x.value; changed(); } });
  async function sendNow(){ A.done=true; ls.set('pdrev_ans',A); clearTimeout(tSave); await save();
    const ok=!lastErr, m=document.createElement('div'); m.className='modal';
    m.innerHTML=`<div class="box"><div class="big">${ok?'🙏':'⚠'}</div><h2>${t(ok?'thx':'off')}</h2><p>${t(ok?'thx2':'off2')}</p><p><button class="go">${t('okb')}</button></p></div>`;
    document.body.appendChild(m); m.querySelector('button').onclick=()=>m.remove(); }
  render();
  if(Object.keys(A.q).length||Object.keys(A.e).length) save();
}

/* ===================== the team's view (results key) ===================== */
function resultsView(){
  let key=''; try{ key=sessionStorage.getItem('pdrev_key')||''; }catch(e){}
  let last=[], msg='';
  const optOf=(q,id)=>q.opts.find(o=>o.id===id), curOf=q=>q.opts.find(o=>o.cur);
  const join=(o,a)=>L(o.t)+(a.inp?((L(o.t).match(/[：:]$/))?' ':(LANG==='zh'?'：':': '))+a.inp:'');
  function render(){
    let h=topbar()+`<header class="top"><div class="wrap"><h1>${t('rTitle')}</h1>
      <div class="keybox"><input id="key" type="password" placeholder="${t('key')}" value="${esc(key)}" autocomplete="off"><button class="go" id="load">${t('load')}</button><button class="ghost" id="copy"${last.length?'':' disabled'}>${t('copy')}</button></div>
      <div class="msg" id="msg">${esc(msg)}</div></div></header><main class="wrap" id="out"></main>`;
    $('#app').innerHTML=h; bindLangs(render);
    $('#load').onclick=load; $('#key').onkeydown=e=>{ if(e.key==='Enter') load(); }; $('#copy').onclick=copy;
    if(!last.length){ if(msg&&!msg.startsWith('…')) $('#out').innerHTML=''; return; }
    $('#out').innerHTML=last.map(s=>{ const R=s.review||{}, Aq=R.q||{}, Ae=R.e||{}, Af=R.f||{};
      const rows=D.Q.map(q=>{ const a=Aq[q.code]||{}, o=optOf(q,a.v), cur=curOf(q);
        const chg=o&&cur&&o.id!==cur.id?`<span class="chg">${t('rChg')}</span>`:'';
        return `<tr><td class="code2">${q.code}</td><td>${L(q.t)}</td><td>${o?esc(join(o,a))+chg:'<span class="none">—</span>'}</td><td>${a.note?esc(a.note).replace(/\n/g,'<br>'):'<span class="none">—</span>'}</td></tr>`; }).join('');
      const erows=D.E.map(r=>{ const a=Ae[r.id]||{};
        return `<tr><td class="code2">E · ${r.c}</td><td>${L(r.t)}</td><td>${a.v==='ok'?t('ok'):a.v==='fix'?`${t('fix')}<span class="chg">${t('rChg')}</span>`:'<span class="none">—</span>'}</td><td>${a.note?esc(a.note):'<span class="none">—</span>'}</td></tr>`; }).join('');
      const fr=D.F.map(f=>{ const a=Af[f.id]||{}; return `<tr><td class="code2">F</td><td>${L(f.t)}${(a.cases||[]).length?` <span class="none">(${esc(a.cases.map(c=>c==='all'?t('all'):c).join(', '))})</span>`:''}</td><td colspan="2">${a.text?esc(a.text).replace(/\n/g,'<br>'):'<span class="none">—</span>'}</td></tr>`; }).join('');
      return `<div class="rcard"><div class="rhead"><span class="pill ${s.done?'ok':'wait'}">${t(s.done?'rSent':'rWip')}</span><span class="pill">${t('rUpd')} ${esc(s.updated?hm(new Date(s.updated)):'')}</span><span class="pill">${esc(s.id)}</span></div>
        <table class="rt"><tr><th>${t('hQ')}</th><th>${t('hT')}</th><th>${t('hA')}</th><th>${t('hN')}</th></tr>${rows}${erows}${fr}</table></div>`; }).join('');
  }
  function asText(){ return last.map(s=>{ const R=s.review||{}, Aq=R.q||{}, Ae=R.e||{}, Af=R.f||{}, out=[`${s.updated?hm(new Date(s.updated)):''} · ${t(s.done?'rSent':'rWip')}`];
      D.Q.forEach(q=>{ const a=Aq[q.code]||{}, o=optOf(q,a.v); out.push(`${q.code} ${L(q.t)}\n  ${t('hA')}: ${o?join(o,a):'—'}${a.note?`\n  ${t('hN')}: ${a.note}`:''}`); });
      D.E.forEach(r=>{ const a=Ae[r.id]||{}; out.push(`E(${r.c}) ${L(r.t)}\n  ${a.v==='ok'?t('ok'):a.v==='fix'?t('fix'):'—'}${a.note?': '+a.note:''}`); });
      D.F.forEach(f=>{ const a=Af[f.id]||{}; out.push(`F ${L(f.t)}${(a.cases||[]).length?' ('+a.cases.join(', ')+')':''}\n  ${a.text||'—'}`); });
      return out.join('\n'); }).join('\n\n----------\n\n'); }
  async function copy(){ const tx=asText(); try{ await navigator.clipboard.writeText(tx); }catch(e){ const ta=document.createElement('textarea'); ta.value=tx; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(_){} ta.remove(); } $('#msg').textContent=t('copied'); }
  async function load(){ key=$('#key').value.trim(); if(!key){ msg=t('needKey'); render(); return; }
    try{ sessionStorage.setItem('pdrev_key',key); }catch(e){}
    $('#msg').textContent=t('rLoading'); let got=[], after='';
    try{ while(after!=null){ const r=await fetch(`${API}/api/sessions?class=${CLS}&after=${encodeURIComponent(after)}`,{headers:{'X-Teacher-Key':key}, cache:'no-store'});
        if(r.status===401){ last=[]; msg=t('rBad'); render(); return; } if(!r.ok) throw new Error(r.status);
        const j=await r.json(); got=got.concat(j.sessions||[]); after=j.next; }
      last=got.filter(s=>s&&s.case==='review').sort((a,b)=>String(b.updated||'').localeCompare(String(a.updated||'')));
      msg=last.length?`${t('rCount',{n:last.length})} · ${hm(new Date())}`:t('rNone'); render(); }
    catch(e){ msg=t('rNet'); render(); } }
  render(); if(key) load();
}
</script>
</body>
</html>
