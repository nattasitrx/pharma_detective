<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>เจ็ดวันของลุงหลี่</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Charmonman:wght@400;700&family=Mali:wght@400;600&family=Noto+Serif+Thai:wght@400;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbf3e4;--ink:#4a3528;--soft:#8a6f5c;--terra:#c8694a;--amber:#e9a646}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{-webkit-touch-callout:none;margin:0;height:100%;background:#1c1512;color:var(--ink);font-family:'Noto Serif Thai','Sarabun',serif;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{position:relative;margin:0 auto;height:100dvh;max-width:480px;display:flex;flex-direction:column;background:var(--paper);overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.5)}
/* ---------- the picture ---------- */
#view{position:relative;flex:0 0 auto;width:100%;aspect-ratio:1/1;max-height:58dvh;overflow:hidden;background:#15110f}
#cam,#zoom{position:absolute;inset:0;will-change:transform}
#zoom{transition:transform .25s linear}
#zoom img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 2s ease}
#zoom img.on{opacity:1}
#fx{position:absolute;inset:0;pointer-events:none}
#fx>*{position:absolute;inset:0;opacity:0;transition:opacity 2.5s ease}
#fx>.on{opacity:1}
.mote{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff3cf;box-shadow:0 0 6px #ffe9b0;opacity:.0;animation:drift 11s linear infinite}
@keyframes drift{0%{transform:translate(0,0);opacity:0}15%{opacity:.75}85%{opacity:.6}100%{transform:translate(26px,-90px);opacity:0}}
#fxHeat{background:linear-gradient(180deg,rgba(255,236,190,.0),rgba(255,226,170,.22));mix-blend-mode:screen}
#fxHeat i{position:absolute;left:-10%;right:-10%;height:16%;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,246,214,.16),rgba(255,255,255,0));animation:heat 5s ease-in-out infinite}
@keyframes heat{0%{transform:translateY(40%) skewX(-3deg)}50%{transform:translateY(-30%) skewX(3deg)}100%{transform:translateY(40%) skewX(-3deg)}}
#fxLamp{background:radial-gradient(circle at 70% 52%,rgba(255,196,110,.34),rgba(255,196,110,0) 46%);mix-blend-mode:screen;animation:flick 3.7s ease-in-out infinite}
@keyframes flick{0%,100%{filter:brightness(1)}40%{filter:brightness(.82)}55%{filter:brightness(1.08)}70%{filter:brightness(.92)}}
#fxSun{background:linear-gradient(115deg,rgba(255,236,180,.26),rgba(255,236,180,0) 55%);mix-blend-mode:screen;animation:sun 9s ease-in-out infinite}
@keyframes sun{50%{filter:brightness(.8)}}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.13;mix-blend-mode:multiply;width:100%;height:100%}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(16,8,8,0) 18%,rgba(16,8,8,.97) 76%);opacity:0;transition:opacity .25s linear}
#frame{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 70px rgba(30,16,10,.55)}
#black{position:absolute;inset:0;background:#15110f;opacity:1;transition:opacity 1.6s ease;pointer-events:none;z-index:5}
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font:600 14px/1 'Sarabun',sans-serif;color:#fff8ea;text-shadow:0 1px 6px rgba(0,0,0,.8);z-index:4;opacity:0;transition:opacity 1s;background:linear-gradient(rgba(20,12,8,.45),rgba(20,12,8,0))}
#hud.on{opacity:1}
#hud .r{display:flex;gap:12px;align-items:center}
#en{display:flex;gap:4px;align-items:center}#en i{width:9px;height:9px;border-radius:50%;background:rgba(255,248,234,.3);transition:background .6s,transform .6s}#en i.f{background:var(--amber);box-shadow:0 0 8px rgba(233,166,70,.9)}
#en.bump i.f{transform:scale(1.5)}
#tr{display:none;gap:2px;align-items:center}#tr.on{display:flex}#tr i{width:6px;height:9px;border-radius:2px;background:rgba(255,248,234,.3);transition:background .6s}#tr i.f{background:#ff8a80;box-shadow:0 0 6px rgba(255,138,128,.9)}#tr.bump{animation:trb .7s ease}
@keyframes trb{40%{transform:scale(1.25)}}
#gest{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 10px;text-align:center;font:600 14.5px/1.4 'Sarabun',sans-serif;color:#fff8ea;background:linear-gradient(rgba(20,12,8,0),rgba(20,12,8,.78));opacity:0;transition:opacity .5s;pointer-events:none}
#gest.on{opacity:1;animation:gp 1.8s ease-in-out infinite}@keyframes gp{50%{opacity:.6}}
#clens{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none;-webkit-mask-image:radial-gradient(circle 66px at var(--lx,50%) var(--ly,50%),#000 62%,transparent 100%);mask-image:radial-gradient(circle 66px at var(--lx,50%) var(--ly,50%),#000 62%,transparent 100%);animation:breathe 16s ease-in-out infinite alternate}
#ring{position:relative;width:104px;height:104px;display:flex;align-items:center;justify-content:center}#ring i{position:absolute;inset:0;border-radius:50%;background:#d9c7a8;transition:background .6s}#ring span{position:relative;font:600 14px/1.3 'Sarabun',sans-serif;color:#4a3528;text-align:center}
/* hotspots on the picture */
#hots{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .8s}
#hots.on{opacity:1;pointer-events:auto}
.hs{position:absolute;width:15%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer}
.hs::before{content:"";position:absolute;inset:30%;border-radius:50%;border:2px solid rgba(255,250,235,.95);box-shadow:0 0 10px rgba(255,214,138,.9),inset 0 0 6px rgba(255,214,138,.6);animation:ring 2.2s ease-out infinite}
.hs.done::before{border-color:rgba(255,250,235,.35);box-shadow:none;animation:none}
.hs.quiet::before{display:none}
@keyframes ring{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.9);opacity:0}}
/* ---------- words ---------- */
#panel{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:16px 26px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(var(--paper),#f5e8d2)}
#txt{font-size:19px;line-height:1.8;min-height:3.6em;white-space:pre-line;opacity:0;transform:translateY(6px);transition:opacity .6s ease,transform .6s ease}
#txt.on{opacity:1;transform:none}
#txt.q{color:var(--soft);font-style:italic}
#txt.big{font:600 26px/1.5 'Noto Serif Thai',serif;text-align:center;letter-spacing:.04em}
#more{position:absolute;right:22px;bottom:calc(12px + env(safe-area-inset-bottom));font:400 13px/1 'Sarabun',sans-serif;color:var(--terra);opacity:0;animation:bob 1.6s ease-in-out infinite}
#more.on{opacity:.85}
@keyframes bob{50%{transform:translateY(4px)}}
#acts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
#acts:empty{display:none}
.btn{appearance:none;border:0;border-radius:16px;padding:13px 18px;font:600 17px/1.45 'Sarabun',sans-serif;color:var(--ink);background:#fff;box-shadow:0 2px 0 #e3d0b3,0 6px 18px rgba(120,80,40,.12);text-align:left;cursor:pointer;opacity:0;transform:translateY(8px);animation:rise .5s ease forwards;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn small{display:block;font-weight:400;font-size:13.5px;color:var(--soft);margin-top:2px}
.btn.dis{opacity:.45!important;pointer-events:none}
.btn.go{background:var(--terra);color:#fff;text-align:center;box-shadow:0 2px 0 #9c4c33,0 8px 20px rgba(200,105,74,.35)}
@keyframes rise{to{opacity:1;transform:none}}
#holdW{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:10px}
#hold{position:relative;width:104px;height:104px;border-radius:50%;border:0;background:conic-gradient(var(--amber) calc(var(--p,0)*1turn),#ecdcc0 0);cursor:pointer;touch-action:none;transition:transform .15s}
#hold::after{content:"";position:absolute;inset:9px;border-radius:50%;background:#fffaf0;box-shadow:inset 0 2px 8px rgba(120,80,40,.15)}
#hold span{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;font:600 15px/1.3 'Sarabun',sans-serif;color:var(--ink);text-align:center;padding:16px}
#hold.down{transform:scale(.95)}
#hold.lock{filter:grayscale(.7);opacity:.6}
#holdL{font:400 14px/1.4 'Sarabun',sans-serif;color:var(--soft);text-align:center;min-height:1.4em}
/* close-up */
#card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(22,14,10,.62);opacity:0;pointer-events:none;transition:opacity .9s;z-index:3;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#card.on{opacity:1;pointer-events:auto}
#card .in{position:relative;width:88%;border-radius:14px;background:#fffaf0;padding:9px 9px 12px;box-shadow:0 22px 60px rgba(0,0,0,.55);transform:rotate(-.8deg)}
#card .pic{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:6px;background:#2a1e18}
#card .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity 2.2s ease,filter 1.9s ease;animation:breathe 16s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(1.02)}to{transform:scale(1.1) translate(-1.5%,-1%)}}
#card .pic img,#zoom img{pointer-events:none;-webkit-user-drag:none;user-drag:none}
#card .pic{touch-action:none;cursor:grab}
#card .pic img.blur{filter:blur(7px) brightness(.9)}
.steam{position:absolute;left:38%;top:8%;width:26%;height:40%;pointer-events:none;filter:blur(9px);opacity:.55}
.steam i{position:absolute;bottom:0;width:38%;height:60%;border-radius:50%;background:rgba(255,255,255,.75);animation:steam 4.5s ease-in infinite}
.steam i:nth-child(2){left:40%;animation-delay:-1.6s}.steam i:nth-child(3){left:20%;animation-delay:-3s}
@keyframes steam{0%{transform:translateY(40%) scale(.5);opacity:0}30%{opacity:.9}100%{transform:translateY(-120%) scale(1.5);opacity:0}}
#dial{width:100%;margin:12px 0 0;accent-color:var(--terra)}
.heart{position:absolute;font-size:22px;animation:hup 1.6s ease-out forwards;pointer-events:none;z-index:4}
@keyframes hup{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-70px) scale(1.2)}}
/* title + report */
#title,#diary{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:30px 28px calc(46px + env(safe-area-inset-bottom));color:#fff8ea;transition:opacity 1.6s ease;background:#1c1512}
#title .bgi{position:absolute;inset:0;background:url(img/dusk.jpg) center/cover;animation:breathe 30s ease-in-out infinite alternate}
#title::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(28,16,10,.1) 20%,rgba(28,16,10,.55) 55%,rgba(20,12,8,.96))}
#title>*:not(.bgi){position:relative;z-index:1}
#title h1{font:600 38px/1.3 'Noto Serif Thai',serif;margin:0 0 8px;text-shadow:0 2px 24px rgba(0,0,0,.7)}
#title .sub{font:400 16.5px/1.7 'Sarabun',sans-serif;opacity:.92}
#title .day{margin:22px 0 22px;font:600 14px/1 'Sarabun',sans-serif;letter-spacing:.18em;border:1px solid rgba(255,248,234,.55);border-radius:99px;padding:9px 18px}
#title .btn{min-width:190px}
#title .ear{margin-top:16px;font:400 13px/1.5 'Sarabun',sans-serif;opacity:.75}
#diary{justify-content:center;background:#241a15;opacity:0;pointer-events:none;color:var(--ink)}
#diary.on{opacity:1;pointer-events:auto}
#diary .pg{width:100%;max-width:370px;background:repeating-linear-gradient(#fffaf0 0 31px,#e6d5b6 31px 32px);border-radius:4px;padding:16px 22px 22px;box-shadow:0 18px 50px rgba(0,0,0,.5);transform:rotate(-1deg);font:400 17.5px/32px 'Mali',cursive;text-align:left}
#diary .pg b{display:block;font-weight:600;color:var(--terra)}
#diary .pg p{margin:0;opacity:0;animation:rise 1s ease forwards}
#diary .pg p.last{font-weight:600}
#diary .pg p.reply{font:400 21px/30px 'Charmonman','Mali',cursive;color:#3e5f8a;opacity:0;margin-top:10px;transform:rotate(-2deg);white-space:pre-line;animation:ink 4.5s ease forwards}
@keyframes ink{0%{opacity:0;filter:blur(3px)}100%{opacity:.88;filter:blur(0)}}
#diary{overflow-y:auto}#diary .pg{margin-top:auto;flex:none}#dbtn{margin-bottom:auto;flex:none}
#diary .next.big{font:600 22px/1.8 'Noto Serif Thai',serif;color:#fff8ea;margin:auto 0 26px;min-height:3.6em}
#diary .next{white-space:pre-line;margin:24px 0 16px;font:400 15px/1.7 'Sarabun',sans-serif;color:#e8d8be;opacity:0;transition:opacity 2s}
#diary .next.on{opacity:1}
#dbtn{display:flex;flex-direction:column;gap:9px;width:100%;max-width:300px;opacity:0;pointer-events:none;transition:opacity 2s}#dbtn.on{opacity:1;pointer-events:auto}
#days{display:flex;gap:8px;margin:20px 0 20px}#days button{appearance:none;border:1px solid rgba(255,248,234,.5);background:transparent;color:#fff8ea;border-radius:99px;padding:8px 13px;font:600 13.5px/1 'Sarabun',sans-serif;cursor:pointer}#days button{min-width:36px}#days button.dn{border-color:#e9a646;color:#ffd58a}#days button.on{background:#fff8ea;color:#4a3528}
#feet{display:flex;gap:12px;align-items:center}#feet button{width:92px;height:92px;border-radius:50%;border:0;background:#fffaf0;box-shadow:0 0 0 7px #ecdcc0,inset 0 2px 8px rgba(120,80,40,.15);font:600 17px/1 'Sarabun',sans-serif;color:#8a6f5c;touch-action:none;transition:transform .1s,box-shadow .2s}#feet button.nx{box-shadow:0 0 0 7px #e9a646,inset 0 2px 8px rgba(120,80,40,.15);color:#4a3528}#feet button:active{transform:scale(.93)}
#bre{width:58px;height:8px;border-radius:9px;background:#ecdcc0;overflow:hidden}#bre i{display:block;height:100%;width:100%;background:#e9a646}
#rail{position:relative;width:280px;height:54px;touch-action:none;cursor:pointer}#rail::before{content:"";position:absolute;left:0;right:0;top:23px;height:8px;border-radius:9px;background:#ecdcc0}#rail i{position:absolute;left:0;top:23px;height:8px;border-radius:9px;background:#e9a646}#rail b{position:absolute;top:5px;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:#fffaf0;box-shadow:0 0 0 5px #e9a646,0 4px 10px rgba(120,80,40,.3)}
.hidden{display:none!important}
@media (min-width:481px){#app{border-radius:26px;height:min(100dvh,900px);margin-top:max(0px,calc((100dvh - 900px)/2))}}
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <div id="cam"><div id="zoom"><img id="imA" alt=""><img id="imB" alt=""></div></div>
    <div id="fx">
      <div id="fxSun"></div>
      <div id="fxDust"><span class="mote" style="left:22%;top:62%"></span><span class="mote" style="left:34%;top:78%;animation-delay:-3s"></span><span class="mote" style="left:28%;top:48%;animation-delay:-6s"></span><span class="mote" style="left:44%;top:70%;animation-delay:-8s"></span><span class="mote" style="left:16%;top:74%;animation-delay:-4.5s"></span><span class="mote" style="left:52%;top:84%;animation-delay:-1.5s"></span></div>
      <div id="fxHeat"><i style="top:20%"></i><i style="top:55%;animation-delay:-2.4s"></i></div>
      <div id="fxLamp"></div>
    </div>
    <svg id="grain" viewBox="0 0 200 200" preserveAspectRatio="none"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .18  0 0 0 .9 0"/></filter><rect width="200" height="200" filter="url(#n)"/></svg>
    <div id="frame"></div>
    <div id="vig"></div>
    <div id="hots"></div>
    <div id="card"><div class="in" id="cardIn"></div></div>
    <div id="hud"><span id="clock"></span><span class="r"><span id="tr"></span><span id="en"></span><span id="money"></span></span></div>
    <div id="black"></div>
  </div>
  <div id="panel"><div id="txt"></div><div id="acts"></div><div id="more">แตะเพื่อไปต่อ ▾</div></div>
  <div id="title">
    <div class="bgi"></div>
    <h1>เจ็ดวันของลุงหลี่</h1>
    <div class="sub">ชายอายุแปดสิบแปด หมาอายุสิบสี่<br>ห้องหนึ่งห้องบนชั้นสี่ และหนึ่งสัปดาห์</div>
    <div id="days"></div>
    <button class="btn go" id="start">เริ่มต้นวัน</button>
    <div class="ear">🎧 เปิดเสียงไว้ · วันละราว 8 นาที</div>
  </div>
  <div id="diary"><div class="pg" id="pg"></div><div class="next" id="dnext">อีกสามวัน จะมีคนมาเคาะประตูห้องนี้</div><div id="dbtn"></div></div>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s), sleep=ms=>new Promise(r=>setTimeout(r,ms));
const FAST=/[?&]fast=1/.test(location.search);   // for testing: no waits
const W=ms=>sleep(FAST?Math.min(ms,30):ms);
const S={};
const IMG={dawn:1,morning:1,pet:1,noon:1,dusk:1,night:1,corridor:1,stairs:1,pot:1,radio:1,dinner2:1,dinner1:1,phone:1,clinic:1,drawer:1,street:1,corridor_night:1,floor:1,door:1,kneel:1,bags:1,chart:1,dance:1,inhalers:1,photo:1,bill:1,leash:1,amei:1,doctor:1,dumplings:1,yellow:1,ceiling:1,intro:1,talkover:1,drawerask:1,spacer:1,potfound:1,teachback:1,amei_cry:1,goodbye:1,resp_demo:1,exitdoor:1,outside:1,bench:1,fillbox:1,drawer_clean:1,calendar:1,tin:1,listen:1,listen2:1,pills_am:1,lee_resp_closed:1,lee_resp_open:1,pills_tue:1,pills_thu:1,pills_check:1,stairs_am:1,stairs_am_dog:1,pot_small:1,dinner_amei:1,slippers:1,oldbag:1,kitchen_young:1,dance_young:1};
let DAY='วันอังคาร';
let P={}; try{ P=JSON.parse(localStorage.getItem('lee7v1')||'{}')||{}; }catch(e){ P={}; }
function saveP(){ try{ localStorage.setItem('lee7v1',JSON.stringify(P)); }catch(e){} }
const src=k=>'img/'+k+'.jpg';
Object.keys(IMG).forEach(k=>{ const i=new Image(); i.src=src(k); });

/* ---------------- sound (all made here: no files) ---------------- */
let AC=null, master=null, fanG=null, staticG=null;
function audio(){ if(AC) return; try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=.9; master.connect(AC.destination);
  const buf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate), d=buf.getChannelData(0); let last=0; for(let i=0;i<d.length;i++){ const w=Math.random()*2-1; last=(last+.02*w)/1.02; d[i]=last*3.2; }
  const s1=AC.createBufferSource(); s1.buffer=buf; s1.loop=true; const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=320; fanG=AC.createGain(); fanG.gain.value=0; s1.connect(lp); lp.connect(fanG); fanG.connect(master); s1.start();
  const wb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate), wd=wb.getChannelData(0); for(let i=0;i<wd.length;i++) wd[i]=Math.random()*2-1;
  const ws=AC.createBufferSource(); ws.buffer=wb; ws.loop=true; const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2400; bp.Q.value=.6; staticG=AC.createGain(); staticG.gain.value=0; ws.connect(bp); bp.connect(staticG); staticG.connect(master); ws.start(); AC._w=wb; }catch(e){ AC=null; } }
function ramp(g,v,t){ if(!AC||!g) return; g.gain.cancelScheduledValues(AC.currentTime); g.gain.setValueAtTime(g.gain.value,AC.currentTime); g.gain.linearRampToValueAtTime(v,AC.currentTime+(t||1)); }
function note(f,dur,vol,type,when){ if(!AC) return; const t=AC.currentTime+(when||0), o=AC.createOscillator(), g=AC.createGain(); o.type=type||'sine'; o.frequency.value=f;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.12,t+.02); g.gain.exponentialRampToValueAtTime(.0008,t+(dur||.8)); o.connect(g); g.connect(master); o.start(t); o.stop(t+(dur||.8)+.05); }
function burst(freq,q,vol,dur,when,type){ if(!AC) return; const s=AC.createBufferSource(); s.buffer=AC._w; const g=AC.createGain(), f=AC.createBiquadFilter(); f.type=type||'bandpass'; f.frequency.value=freq; f.Q.value=q; const t=AC.currentTime+(when||0);

  b.onclick=()=>{ k++; note(520+k*40,.18,.05); if(k>=labels.length){ a.innerHTML=''; res(); return; } b.textContent=pre+labels[k]; }; if(FAST){ for(let i=0;i<labels.length;i++) setTimeout(()=>b.click(),20+i*5); } }); }

function hearts(x,y){ const v=$('#view').getBoundingClientRect(); for(let i=0;i<3;i++) setTimeout(()=>{ const h=document.createElement('div'); h.className='heart'; h.textContent='🤍'; h.style.left=(v.width*x+Math.random()*40-20)+'px'; h.style.top=(v.height*y)+'px'; $('#view').appendChild(h); setTimeout(()=>h.remove(),1700); },i*260); }

/* ---------------- walking, seen through his eyes: hold to walk, let go to breathe ---------------- */
function walk({stairs, limit, total, night, hurry}){ return new Promise(res=>{ const a=$('#acts'), NS=total||23; a.innerHTML=`<div id="holdW"><button id="hold"><span>กดค้าง<br>เพื่อเดิน</span></button><div id="holdL"></div></div>`;
  const b=$('#hold'), L=$('#holdL'), z=$('#zoom'), vig=$('#vig'); let prog=0, breath=1, down=false, lock=0, last=performance.now(), done=false, coughs=0, beatT=0, stepT=0, told=0, ph=0, shake=0;
  z.style.transition='none'; z.style.transformOrigin=stairs?'30% 46%':'50% 27%';
  b.onpointerdown=e=>{ e.preventDefault(); if(!lock){ down=true; b.classList.add('down'); } }; b.onpointerup=b.onpointerleave=b.onpointercancel=()=>{ down=false; b.classList.remove('down'); };
  (function loop(now){ if(done) return; let dt=Math.min(60,now-last); last=now; if(FAST){ dt=400; down=breath>.4&&!lock; }
    if(lock>0){ lock-=dt; shake=Math.max(0,shake-dt/900); if(lock<=0){ lock=0; b.classList.remove('lock'); L.textContent='ทีละนิด… เดินแล้วหยุด หยุดแล้วหายใจ'; } }
    else if(down){ prog+=dt/(stairs?15000:hurry?10500:13500); breath-=dt/(stairs?2300:night?2100:hurry?1900:2900); ph+=dt/330; beatT-=dt; stepT-=dt; if(beatT<=0){ sfx.beat(); beatT=260+breath*620; } if(stepT<=0){ sfx.step(); stepT=640; } }
    else breath=Math.min(1,breath+dt/3400);
    if(breath<=0&&!lock){ breath=.12; lock=2600; shake=1; down=false; coughs++; prog=Math.max(0,prog-.05); b.classList.remove('down'); b.classList.add('lock'); sfx.cough(); L.textContent='แค่ก… แค่ก… ต้องหยุดก่อน'; }
    b.style.setProperty('--p',breath); vig.style.opacity=Math.pow(1-breath,1.4).toFixed(2);
    const bob=Math.sin(ph)*1.1*(down?1:.25), sx=shake*Math.sin(now/38)*1.4+(night?Math.sin(now/900)*2.2*(.4+prog):0), rot=night?Math.sin(now/1300)*2.4*(.3+prog):0; z.style.transform=`translate(${sx.toFixed(2)}%,${bob.toFixed(2)}%) rotate(${rot.toFixed(2)}deg) scale(${(1+prog*(stairs?1.1:1.9)).toFixed(3)})`;
    if(!lock){ const st=Math.min(NS,Math.round(prog*NS)); if(!stairs) L.textContent=down?(night?'มืด… ช้าๆ…':`ก้าวที่ ${st} จาก ${NS}`):(breath<.98&&prog>0?'หยุด… หายใจ…':(told++<1?'กดค้างไว้เพื่อเดิน · ปล่อยมือเพื่อหยุดหายใจ':L.textContent)); else L.textContent=down?'ทีละขั้น…':(prog>0?'เกาะราวไว้… หายใจ…':'กดค้างไว้เพื่อลงบันได'); }
    if(prog>=(limit||1)){ done=true; a.innerHTML=''; z.style.transition=''; vig.style.opacity=limit?.5:0; res({coughs}); return; } requestAnimationFrame(loop); })(last); }); }

function ringGame(){ return new Promise(res=>{ const a=$('#acts'); let n=0, done=false, t=null;

function tapPills(n){ return new Promise(res=>{ const a=$('#acts'), W7=['หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด']; let k=0;

/* a hold that gives way before the end (he cannot get up) */
function holdFail(label, ms, at){ return new Promise(res=>{ const a=$('#acts'); a.innerHTML=`<div id="holdW"><button id="hold"><span>${label}</span></button><div id="holdL"></div></div>`;
  const b=$('#hold'); let p=0, down=FAST, last=performance.now(), done=false, fall=false;
  b.onpointerdown=e=>{ e.preventDefault(); if(!fall){ down=true; b.classList.add('down'); } }; b.onpointerup=b.onpointerleave=b.onpointercancel=()=>{ down=false; b.classList.remove('down'); };
  (function loop(now){ if(done) return; const dt=now-last; last=now; if(fall){ p=Math.max(0,p-dt/500); if(p<=0){ done=true; a.innerHTML=''; res(); return; } }
    else { p=Math.max(0,Math.min(1,p+(down?dt/(FAST?60:ms):-dt/(ms*.7)))); if(p>=at){ fall=true; down=false; b.classList.add('lock'); sfx.low(); } }
    b.style.setProperty('--p',p); requestAnimationFrame(loop); })(last); }); }

  const dn=$('#dnext'), db=$('#dbtn'); dn.classList.remove('on'); db.classList.remove('on'); db.innerHTML=''; $('#pg').style.opacity=''; $('#pg').style.display=''; dn.classList.remove('big'); $('#diary').classList.add('on');
  await W((4.8+lines.length*step)*1000); if(reply) await W(FAST?0:6500);
  if(extra){ sfx.beat(); await W(600); sfx.beat(); dn.textContent=extra; dn.classList.add('on'); await W(6500); dn.classList.remove('on'); await W(2000); }
  if(next){ dn.textContent=next; dn.classList.add('on'); sfx.bell(); await W(2200); } res(); }); }

  await say(['เราเดินไปถึงม้านั่งหน้าตลาด หกสิบก้าว ผมนับ\nแล้วก็เลิกนับ','เสี่ยวเฮยดมทุกอย่าง เสาไฟ ล้อจักรยาน รองเท้าเด็กนักเรียน','หมออธิบายว่า วันหนึ่งของมันยาวเท่าหนึ่งสัปดาห์ของคน\nวันนี้มันได้ใช้ครบทั้งสัปดาห์','ผมเงยหน้าขึ้นมอง\nหน้าต่างชั้นสี่ ม่านสีอิฐ จากข้างล่าง มันเล็กนิดเดียว','ที่หน้าต่างชั้นสอง อาเหมยยกมือให้']);

async function finale(){ const pg=$('#pg'), dn=$('#dnext'); dn.classList.remove('on'); await W(2600); pg.style.transition='opacity 1.6s'; pg.style.opacity=0; await W(1800);

  pg.style.opacity=0; await W(1800); pg.style.display='none'; dn.classList.add('big');
  for(const t of ['สำหรับคุณ\nมันคือการเยี่ยมบ้านหนึ่งชั่วโมง','สำหรับเขา\nมันคือเจ็ดวันนี้','และทุกวันหลังจากนี้']){ dn.textContent=t; dn.classList.add('on'); await W(4400); dn.classList.remove('on'); await W(2400); }
  dn.textContent='เจ็ดวันของลุงหลี่'; dn.classList.add('on'); await W(1500); }

const DAYS={1:day1,2:day2,3:day3,4:day4,5:day5,6:day6,7:day7};
function startDay(n){ $('#hud').classList.remove('on'); (DAYS[n]||day1)(); }

let pickDay=Math.min(7,(P.done||0)+1);
function drawDays(){ $('#days').innerHTML=[1,2,3,4,5,6,7].map(n=>`<button data-n="${n}" class="${n===pickDay?'on':''}${(P.done||0)>=n?' dn':''}">${n}</button>`).join(''); $('#days').querySelectorAll('button').forEach(b=>b.onclick=()=>{ pickDay=+b.dataset.n; drawDays(); });
  $('#start').textContent='เริ่มวันที่ '+pickDay+' · วัน'+['','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์','อาทิตย์','จันทร์'][pickDay]; }
drawDays();
