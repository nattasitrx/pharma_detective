<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>藥師偵探 · 請老師確認</title>
<style>
:root{--ink:#1d1d24;--muted:#5d5d6b;--line:#d9d9e0;--bg:#f4f4f7;--card:#fff;--acc:#0f6b6b;--acc2:#e6f2f2;--warn:#a5520c;--warnbg:#fff4e6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Leelawadee UI","Thonburi","Noto Sans Thai",sans-serif;font-size:16px;line-height:1.5;padding-bottom:84px}
.th,i{display:block;font-style:normal;font-size:.78em;color:var(--muted);line-height:1.35;margin-top:1px;font-family:"Leelawadee UI","Thonburi","Noto Sans Thai",system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:#fff;border-bottom:1px solid var(--line);padding:22px 0 16px;margin-bottom:18px}
.kick{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--acc)}
h1{font-size:26px;line-height:1.25;margin:4px 0 2px}
.intro{margin:12px 0 0;max-width:860px}
.intro p{margin:6px 0}
.namebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.namebox input{font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;min-width:220px}
.grp{font-size:20px;font-weight:800;margin:30px 0 10px;padding-left:10px;border-left:5px solid var(--acc)}
.grp .th{font-weight:400}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 16px;overflow:hidden;scroll-margin-top:12px}
.qh{display:flex;gap:10px;align-items:flex-start;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.code{flex:none;background:var(--ink);color:#fff;font-weight:800;border-radius:7px;padding:2px 9px;font-size:15px;margin-top:2px}
.qh .zh{font-weight:800;font-size:18px;line-height:1.35}
.qb{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;padding:14px 16px 16px}
.q.wide .qb{grid-template-columns:1fr}
.fig a{display:block}
.fig img{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.fig .cap{font-size:12px;color:var(--muted);margin-top:4px}
.row{display:grid;grid-template-columns:78px 1fr;gap:8px;margin:0 0 10px}
.row .lab{font-weight:800;font-size:14px}
.tb{border-collapse:collapse;width:100%;font-size:14px;margin:4px 0 6px}
.tb th,.tb td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
.tb th{background:#f0f0f4}
.note{font-size:14px;border-left:3px solid var(--acc);padding:2px 8px;margin:6px 0}
.choose{border:1.5px solid var(--acc);border-radius:10px;padding:10px 12px;margin-top:10px;background:#fbfefe}
.choose .lab2{font-weight:800;color:var(--acc);font-size:14px}
.choose .lab2 .th{display:inline;margin-left:6px}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 8px;border-radius:8px;cursor:pointer;margin:2px 0}
label.opt:hover{background:var(--acc2)}
label.opt input[type=radio]{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--acc)}
label.opt.on{background:var(--acc2)}
.cur{display:inline-block;font-size:12px;border:1px solid var(--muted);color:var(--muted);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.inl{font:inherit;font-size:15px;padding:4px 8px;border:1.5px solid var(--line);border-radius:6px;margin-top:4px;width:min(100%,280px)}
textarea{font:inherit;font-size:15px;width:100%;min-height:58px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;resize:vertical}
.memo{margin-top:8px}
.memo .lab3{font-size:13px;font-weight:700;margin-bottom:3px}
.memo .lab3 .th{display:inline;margin-left:6px}
.erow{display:grid;grid-template-columns:54px 1fr 250px;gap:12px;padding:12px 16px;border-top:1px solid var(--line);align-items:start}
.erow:first-child{border-top:none}
.erow .c{font-weight:800;text-align:center;background:#f0f0f4;border-radius:6px;padding:2px 0}
.erow .pick label.opt{padding:4px 6px;margin:0}
.erow .pick input.inl{width:100%}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:14px 16px 16px}
.fbox .h{font-weight:800;font-size:17px}
.fbox .eg{font-size:13px;color:var(--muted);margin:2px 0 6px}
.fbox .cases{font-size:14px;margin:4px 0 6px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fbox .cases input{width:17px;height:17px;accent-color:var(--acc);vertical-align:-3px}
.fbox textarea{min-height:170px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.06);z-index:10}
.bar .wrap{display:flex;gap:12px;align-items:center;padding-top:10px;padding-bottom:10px}
.bar .st{flex:1;font-size:14px;color:var(--muted);min-width:0}
.bar .st b{color:var(--ink)}
.bar .st.err{color:var(--warn)}
.prog{font-size:13px;color:var(--muted);white-space:nowrap}
button.go{font:inherit;font-weight:800;background:var(--acc);color:#fff;border:none;border-radius:10px;padding:10px 20px;cursor:pointer;white-space:nowrap}
button.go:disabled{opacity:.5}
button.ghost{font:inherit;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .box{background:#fff;border-radius:14px;max-width:460px;width:100%;padding:22px;text-align:center}
.modal .big{font-size:40px}
/* results view */
.rcard{background:#fff;border:1px solid var(--line);border-radius:14px;margin:0 0 18px;overflow:hidden}
.rhead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:#fafafc}
.rhead b{font-size:18px}
.pill{font-size:13px;border-radius:99px;padding:1px 9px;border:1px solid var(--line)}
.pill.ok{background:#e7f6ec;border-color:#9fd5b0}
.pill.wait{background:var(--warnbg);border-color:#f0c48e}
.rt{border-collapse:collapse;width:100%;font-size:14.5px}
.rt th,.rt td{border-top:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}
.rt th{background:#f6f6f9;font-size:13px}
.rt td.code2{font-weight:800;white-space:nowrap}
.chg{display:inline-block;font-size:12px;font-weight:700;color:var(--warn);background:var(--warnbg);border:1px solid #f0c48e;border-radius:5px;padding:0 6px;margin-left:4px}
.none{color:var(--muted)}
.keybox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.keybox input{font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;min-width:260px}
.msg{margin:10px 0;color:var(--warn)}
@media (max-width:900px){.qb{grid-template-columns:1fr}.erow{grid-template-columns:44px 1fr}.erow .pick{grid-column:2}.fgrid{grid-template-columns:1fr}}
@media (max-width:520px){h1{font-size:22px}.row{grid-template-columns:1fr;gap:2px}.bar .prog{display:none}}
</style>
</head>

<div id="app"></div>
<script>
const D={"Q": [{"code": "Q1", "grp": "all", "t": ["年齡要以哪一份資料為準？", "ยึดอายุจากเอกสารไหน"], "fig": "f1_age.png", "info": [["資料上", "ในเอกสาร", "三個案例藥袋上的年齡，都和收據上的出生日期（換算到調劑日）不一致。", "อายุบนซองยาไม่ตรงกับวันเกิดในใบเสร็จทั้ง 3 เคส (นับอายุถึงวันที่บนซอง)"], ["遊戲目前", "ในเกมตอนนี้", "三個案例做法不同：A 依藥袋（出生日期改為 1959/11/7，但收據圖片仍是 1955）；C 依出生日期（學生用藥袋的 58 歲算 CrCl 會被判錯）；D 依出生日期（藥袋已改成 88）。", "ตอนนี้แต่ละเคสใช้คนละหลัก: A ยึดซอง (รูปใบเสร็จยังเป็น 1955) · C ยึดวันเกิด (นักศึกษาที่ใช้อายุ 58 จากซองจะถูกบอกว่าผิด) · D ยึดวันเกิด (แก้ซองเป็น 88 แล้ว)"]], "extra": "<table class=\"tb\"><tr><th>案例<i>เคส</i></th><th>藥袋年齡<i>อายุบนซอง</i></th><th>收據出生日期（調劑日年齡）<i>วันเกิดในใบเสร็จ (อายุ ณ วันจ่ายยา)</i></th><th>遊戲目前<i>เกมใช้</i></th></tr>\n<tr><td>A 陳伯</td><td>61</td><td>1955/11/07（2021/2/18 時 65 歲）</td><td>61</td></tr>\n<tr><td>C 王太太</td><td>58</td><td>1960/11/07（2022/2/18 時 61 歲）</td><td>61</td></tr>\n<tr><td>D 李伯伯</td><td>85（原圖）</td><td>1933/05/01（2022/4/28 時 88 歲）</td><td>88</td></tr></table>\n<p class=\"note\">不論選哪一個，CKD 分期都不變。<i>ไม่ว่าเลือกแบบไหน ระยะ CKD ไม่เปลี่ยน</i></p>", "opts": [{"id": "birth", "zh": "以收據的出生日期為準：A 改為 65 歲（eGFR ≈ 23、CrCl ≈ 32.3），修改 A、C 藥袋圖片上的年齡", "th": "ยึดวันเกิดในใบเสร็จ: A เป็น 65 ปี แก้อายุบนรูปซองของ A และ C"}, {"id": "bag", "zh": "以藥袋的年齡為準：C 改為 58 歲（eGFR ≈ 52.5、CrCl ≈ 42.8）、D 改回 85 歲（CrCl ≈ 59），修改 A、C 收據上的出生日期", "th": "ยึดอายุบนซอง: C เป็น 58 ปี · D กลับเป็น 85 ปี · แก้วันเกิดในรูปใบเสร็จของ A และ C"}, {"id": "keep", "zh": "維持目前做法（各案例不同），只把 A 收據改成 1959/11/07", "th": "คงแบบปัจจุบัน แค่แก้รูปใบเสร็จ A เป็น 1959", "cur": true}]}, {"code": "A2", "grp": "A", "t": ["Clarinase 的含量是多少？", "Clarinase ความแรงเท่าไร"], "fig": "f2_clarinase.png", "info": [["資料上", "ในเอกสาร", "三個案例的收據都只寫「Clarinase 7 粒，1 天 1 次，7 天」，沒有含量。", "ใบเสร็จทั้ง 3 เคสเขียนแค่ Clarinase 7 เม็ด วันละครั้ง 7 วัน ไม่มีความแรง"], ["遊戲目前", "ในเกมตอนนี้", "視為 loratadine 5 mg + pseudoephedrine 120 mg，每日一次。Case A 重複用藥任務：pseudoephedrine 每日合計 420 mg（Peace 60 + Finska LP 240 + Clarinase 120），超過上限 240 mg。", "ถือเป็น     <div class="intro"><p>每題的圖片是原始藥袋、收據或檢驗報告的截圖，黑框是需要確認的地方。請直接點選選項，也可以在「其他／備註」寫下意見。標「目前」的是遊戲現在的做法。<span class="th">รูปมาจากซองยา/ใบเสร็จ/ผลแล็บต้นฉบับ กรอบดำคือจุดที่ต้องคอนเฟิร์ม เลือกคำตอบ หรือเขียนในช่องหมายเหตุ ป้าย "目前" คือแบบที่เกมใช้อยู่ตอนนี้</span></p>
    <p>答案會<b>自動儲存</b>，可以分幾次填寫；填完請按最下面的「送出」。點圖片可以放大。<span class="th">คำตอบบันทึกอัตโนมัติ ทำทีละส่วนได้ เสร็จแล้วกด "送出" ด้านล่าง กดรูปเพื่อขยาย</span></p>
    <p>試玩網址：<a href="https://nattasitrx.github.io/pharma_detective/preview/" target="_blank" rel="noopener">nattasitrx.github.io/pharma_detective/preview</a></p></div>
    <div class="namebox"><label for="nm"><b>您的稱呼</b><span class="th">ชื่อ (ไม่บังคับ)</span></label><input id="nm" maxlength="40" placeholder="例如：王老師" value="${esc(A.name)}"></div></div></header><main class="wrap">`;
  let g='';
  D.Q.forEach(q=>{
    if(q.grp!==g){ g=q.grp; html+=`<div class="grp">${bi(...GRP[g])}</div>`; }
    const ans=A.q[q.code]||{};
    const info=q.info.map(r=>`<div class="row"><div class="lab">${bi(r[0],r[1])}</div><div>${bi(r[2],r[3])}</div></div>`).join('');
    const opts=q.opts.map(o=>`<label class="opt${ans.v===o.id?' on':''}"><input type="radio" name="${q.code}" value="${o.id}"${ans.v===o.id?' checked':''}><div>${o.zh}${o.cur?'<span class="cur">目前 · ตอนนี้</span>':''}<span class="th">${o.th}</span>${o.inp?`<input class="inl" data-inp="${q.code}" maxlength="80" value="${esc(ans.inp||'')}">`:''}</div></label>`).join('');
    html+=`<section class="q${q.wide?' wide':''}" id="${q.code}"><div class="qh"><span class="code">${q.code}</span><div>${bi(...q.t)}</div></div>
      <div class="qb"><div class="fig"><a href="img/${q.fig}" target="_blank" rel="noopener"><img src="img/${q.fig}" alt="${esc(q.t[0])}" loading="lazy"></a><div class="cap">點圖片放大 · กดเพื่อขยาย</div></div>
      <div>${info}${q.extra||''}<div class="choose"><div class="lab2">請選擇<span class="th">โปรดเลือก</span></div>${opts}
      <div class="memo"><div class="lab3">其他／備註<span class="th">อื่นๆ / หมายเหตุ</span></div><textarea data-note="${q.code}" maxlength="2000">${esc(ans.note||'')}</textarea></div></div></div></div></section>`;
  });
  html+=`<div class="grp">${bi('我們自行補充的情節與答案','เนื้อหาที่ทีมแต่งเพิ่มและเฉลย')}</div><section class="q" id="E"><div class="qh"><span class="code">E</span><div>${bi('原始案例資料沒有這些細節，由團隊補充，請確認','เอกสารเคสไม่มีรายละเอียดเหล่านี้ ทีมแต่งเพิ่ม ขอให้อาจารย์ตรวจ')}</div></div><div>`;
  D.E.forEach(([id,c,zh,th])=>{ const a=A.e[id]||{};
    html+=`<div class="erow"><div class="c">${c}</div><div>${bi(zh,th)}</div><div class="pick">
      <label class="opt${a.v==='ok'?' on':''}"><input type="radio" name="${id}" value="ok"${a.v==='ok'?' checked':''}><div>同意<span class="th">เห็นด้วย</span></div></label>
      <label class="opt${a.v==='fix'?' on':''}"><input type="radio" name="${id}" value="fix"${a.v==='fix'?' checked':''}><div>需修改<span class="th">ต้องแก้</span></div></label>
      <input class="inl" data-enote="${id}" maxlength="400" placeholder="備註 · หมายเหตุ" value="${esc(a.note||'')}"></div></div>`; });
  html+=`</div></section><div class="grp">${bi('其他想新增、調整或修改的地方','สิ่งที่อยากเพิ่ม ปรับ หรือแก้เพิ่มเติม')}</div>
    <section class="q" id="F"><div class="qh"><span class="code">F</span><div>${bi('請直接用中文書寫，任何想法都可以','อาจารย์เขียนเป็นภาษาจีนได้เลย เรื่องอะไรก็ได้')}</div></div><div class="fgrid">`;
  D.F.forEach(([id,zh,th,ez,et])=>{ const a=A.f[id]||{}, cs=a.cases||[];
    html+=`<div class="fbox"><div class="h">${bi(zh,th)}</div><div class="eg">${ez}<span class="th">${et}</span></div>
      <div class="cases">案例<span class="th" style="display:inline">เคส</span>${['A','C','D','全部'].map(c=>`<label><input type="checkbox" data-fcase="${id}" value="${c}"${cs.includes(c)?' checked':''}> ${c}</label>`).join('')}</div>
      <textarea data-ftext="${id}" maxlength="4000">${esc(a.text||'')}</textarea></div>`; });
  html+=`</div></section></main>
    <div class="bar"><div class="wrap"><div class="st" id="st">尚未作答<span class="th">ยังไม่ได้ตอบ</span></div><div class="prog" id="prog"></div><button class="go" id="send">送出 · ส่ง</button></div></div>`;
  $('#app').innerHTML=html;

  let tSave=null, busy=false, again=false, retry=null;
  const status=(k,extra)=>{ const el=$('#st'); el.classList.toggle('err',k==='err');
    el.innerHTML=k==='saving'?'儲存中…<span class="th">กำลังบันทึก</span>':k==='ok'?`<b>✓ 已自動儲存</b> ${extra}${A.done?' · 已送出':''}<span class="th">บันทึกอัตโนมัติแล้ว${A.done?' · ส่งแล้ว':''}</span>`
      :k==='err'?'⚠ 暫時無法連線，答案先存在這台裝置，稍後會自動重試<span class="th">ยังส่งไม่ได้ เก็บไว้ในเครื่องก่อน จะลองใหม่อัตโนมัติ</span>':'…'; };
  const progress=()=>{ const n=D.Q.filter(q=>(A.q[q.code]||{}).v).length, e=D.E.filter(r=>(A.e[r[0]]||{}).v).length;
    $('#prog').textContent=`已回答 ${n}/${D.Q.length} 題 · E ${e}/${D.E.length}`; };
  async function save(){ if(busy){ again=true; return; } busy=true; status('saving'); clearTimeout(retry);
    const body={id:ID, classCode:CLS, case:'review', updated:new Date().toISOString(), done:!!A.done, student:{name:A.name||'老師', sid:''}, review:{v:1, q:A.q, e:A.e, f:A.f}};
    try{ const r=await fetch(API+'/api/submit',{method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(body)}); const j=await r.json(); if(!j||!j.ok) throw new Error('not ok'); status('ok', hm(new Date())); }
    catch(e){ status('err'); retry=setTimeout(save, 15000); }
    busy=false; if(again){ again=false; save(); } }
  const changed=(now)=>{ ls.set('pdrev_ans',A); progress(); clearTimeout(tSave); tSave=setTimeout(save, now?0:1200); status('edit'); };
  const q=c=>A.q[c]||(A.q[c]={});
  document.addEventListener('change', ev=>{ const t=ev.target;
    if(t.type==='radio'){ document.querySelectorAll(`input[name="${t.name}"]`).forEach(x=>x.closest('label').classList.toggle('on',x.checked));
      if(D.Q.some(x=>x.code===t.name)) q(t.name).v=t.value; else (A.e[t.name]||(A.e[t.name]={})).v=t.value; changed(true); }
    if(t.dataset.fcase){ const f=A.f[t.dataset.fcase]||(A.f[t.dataset.fcase]={}); f.cases=[...document.querySelectorAll(`input[data-fcase="${t.dataset.fcase}"]:checked`)].map(x=>x.value); changed(true); } });
  document.addEventListener('input', ev=>{ const t=ev.target;
    if(t.id==='nm'){ A.name=t.value.trim(); changed(); }
    else if(t.dataset.note){ q(t.dataset.note).note=t.value; changed(); }
    else if(t.dataset.inp){ q(t.dataset.inp).inp=t.value; const r=t.closest('label').querySelector('input[type=radio]'); if(r&&!r.checked){ r.checked=true; r.dispatchEvent(new Event('change',{bubbles:true})); } changed(); }
    else if(t.dataset.enote){ (A.e[t.dataset.enote]||(A.e[t.dataset.enote]={})).note=t.value; changed(); }
    else if(t.dataset.ftext){ (A.f[t.dataset.ftext]||(A.f[t.dataset.ftext]={})).text=t.value; changed(); } });
  $('#send').onclick=async()=>{ A.done=true; ls.set('pdrev_ans',A); clearTimeout(tSave); await save();
    const ok=!$('#st').classList.contains('err'); const m=document.createElement('div'); m.className='modal';
    m.innerHTML=`<div class="box"><div class="big">${ok?'🙏':'⚠'}</div><h2>${ok?'已送出，謝謝老師！':'暫時無法連線'}</h2><p>${ok?'之後若想修改，直接在這一頁修改即可，會自動更新。':'答案已存在這台裝置，連上網路後會自動送出。'}</p>
      <span class="th">${ok?'ส่งแล้ว ขอบคุณค่ะ/ครับ แก้ภายหลังได้ในหน้านี้ ระบบจะอัปเดตเอง':'ยังส่งไม่ได้ คำตอบเก็บไว้ในเครื่อง จะส่งเองเมื่อออนไลน์'}</span><p><button class="go">好 · ตกลง</button></p></div>`;
    document.body.appendChild(m); m.querySelector('button').onclick=()=>m.remove(); };
  progress(); if(A.updated||Object.keys(A.q).length) status('ok', '');
  if(Object.keys(A.q).length||Object.keys(A.e).length||A.name) save();
}

/* ===================== results for the team (needs the results key) ===================== */
function resultsView(){
  let key=''; try{ key=sessionStorage.getItem('pdrev_key')||''; }catch(e){}
  $('#app').innerHTML=`<header class="top"><div class="wrap"><div class="kick">PHARMA DETECTIVE · 藥師偵探</div><h1>老師的回覆</h1><span class="th">คำตอบของอาจารย์</span>
    <div class="keybox"><input id="key" type="password" placeholder="รหัสรับผล (results key)" value="${esc(key)}" autocomplete="off"><button class="go" id="load">載入 · โหลด</button><button class="ghost" id="copy" disabled>複製文字 · คัดลอกเป็นข้อความ</button></div>
    <div class="msg" id="msg"></div></div></header><main class="wrap" id="out"></main>`;
  let last=[];
  const optOf=(q,id)=>q.opts.find(o=>o.id===id);
  const curOf=q=>q.opts.find(o=>o.cur);
  function render(list){
    if(!list.length){ $('#out').innerHTML='<p class="none">還沒有回覆 · ยังไม่มีคำตอบ</p>'; return; }
    $('#out').innerHTML=list.map(s=>{ const R=s.review||{}, Aq=R.q||{}, Ae=R.e||{}, Af=R.f||{};
      const rows=D.Q.map(q=>{ const a=Aq[q.code]||{}, o=optOf(q,a.v), cur=curOf(q);
        const chg=o&&cur&&o.id!==cur.id?'<span class="chg">要改 · ต้องแก้เกม</span>':'';
        return `<tr><td class="code2">${q.code}</td><td>${bi(...q.t)}</td><td>${o?`${o.zh}${a.inp?(o.zh.endsWith('：')?'':'：')+esc(a.inp):''}${chg}<span class="th">${o.th}</span>`:'<span class="none">—</span>'}</td><td>${a.note?esc(a.note).replace(/\n/g,'<br>'):'<span class="none">—</span>'}</td></tr>`; }).join('');
      const erows=D.E.map(([id,c,zh,th])=>{ const a=Ae[id]||{};
        return `<tr><td class="code2">${c}</td><td>${bi(zh,th)}</td><td>${a.v==='ok'?'同意<span class="th">เห็นด้วย</span>':a.v==='fix'?'需修改<span class="chg">ต้องแก้</span>':'<span class="none">—</span>'}</td><td>${a.note?esc(a.note):'<span class="none">—</span>'}</td></tr>`; }).join('');
      const fr=D.F.map(([id,zh,th])=>{ const a=Af[id]||{}; return `<tr><td class="code2">F</td><td>${bi(zh,th)}${(a.cases||[]).length?`<span class="th">案例 ${esc(a.cases.join('、'))}</span>`:''}</td><td colspan="2">${a.text?esc(a.text).replace(/\n/g,'<br>'):'<span class="none">—</span>'}</td></tr>`; }).join('');
      const when=s.updated?hm(new Date(s.updated)):'';
      return `<div class="rcard"><div class="rhead"><b>${esc((s.student||{}).name||'老師')}</b><span class="pill ${s.done?'ok':'wait'}">${s.done?'已送出 · ส่งแล้ว':'填寫中 · ยังไม่กดส่ง'}</span><span class="pill">更新 ${esc(when)}</span><span class="pill">${esc(s.id)}</span></div>
        <table class="rt"><tr><th>題</th><th>題目 · หัวข้อ</th><th>選擇 · ที่เลือก</th><th>備註 · หมายเหตุ</th></tr>${rows}${erows}${fr}</table></div>`; }).join('');
  }
  function asText(list){ return list.map(s=>{ const R=s.review||{}, Aq=R.q||{}, Ae=R.e||{}, Af=R.f||{}, out=[`${(s.student||{}).name||'老師'} · ${s.updated?hm(new Date(s.updated)):''} · ${s.done?'已送出':'填寫中'}`];
      D.Q.forEach(q=>{ const a=Aq[q.code]||{}, o=optOf(q,a.v); out.push(`${q.code} ${q.t[0]}\n  選擇：${o?o.zh+(a.inp?(o.zh.endsWith('：')?'':'：')+a.inp:''):'—'}${a.note?'\n  備註：'+a.note:''}`); });
      D.E.forEach(([id,c,zh])=>{ const a=Ae[id]||{}; out.push(`E(${c}) ${zh}\n  ${a.v==='ok'?'同意':a.v==='fix'?'需修改':'—'}${a.note?'：'+a.note:''}`); });
      D.F.forEach(([id,zh])=>{ const a=Af[id]||{}; out.push(`F ${zh}${(a.cases||[]).length?'（'+a.cases.join('、')+'）':''}\n  ${a.text||'—'}`); });
      return out.join('\n'); }).join('\n\n----------\n\n'); }
  async function load(){ key=$('#key').value.trim(); if(!key){ $('#msg').textContent='請輸入 · ใส่รหัสรับผลก่อน'; return; }
    try{ sessionStorage.setItem('pdrev_key',key); }catch(e){}
    $('#msg').textContent='載入中… · กำลังโหลด'; let got=[], after='';
    try{ while(after!=null){ const r=await fetch(`${API}/api/sessions?class=${CLS}&after=${encodeURIComponent(after)}`,{headers:{'X-Teacher-Key':key}, cache:'no-store'});
        if(r.status===401){ $('#msg').textContent='รหัสรับผลไม่ถูกต้อง · 金鑰錯誤'; return; } if(!r.ok) throw new Error(r.status);
        const j=await r.json(); got=got.concat(j.sessions||[]); after=j.next; }
      last=got.filter(s=>s&&s.case==='review').sort((a,b)=>String(b.updated||'').localeCompare(String(a.updated||'')));
      $('#msg').textContent=`${last.length} 份回覆 · ${last.length} คำตอบ · ${hm(new Date())}`; $('#copy').disabled=!last.length; render(last); }
    catch(e){ $('#msg').textContent='ต่อเซิร์ฟเวอร์ไม่ได้ · 無法連線'; } }
  $('#load').onclick=load; $('#key').onkeydown=e=>{ if(e.key==='Enter') load(); };
  $('#copy').onclick=async()=>{ const t=asText(last); try{ await navigator.clipboard.writeText(t); $('#msg').textContent='คัดลอกแล้ว · 已複製'; }catch(e){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); $('#msg').textContent='คัดลอกแล้ว · 已複製'; }catch(_){} ta.remove(); } };
  if(key) load();
}
</script>
</body>
</html>
