  await say('yeh','think',['先看檢驗紀錄：肌酸酐 1.1 → 1.2 → 1.2 mg/dL，都在參考值內……可是腎功能真的正常嗎？','First, the lab record: creatinine 1.1 → 1.2 → 1.2 mg/dL — all inside the reference range… but are her kidneys really normal?','ดูผลแล็บก่อน: ครีเอตินิน 1.1 → 1.2 → 1.2 mg/dL อยู่ในค่าอ้างอิงทั้งหมด… แต่ไตของป้าปกติจริงเหรอ?']);
  await say('yeh','neutral',['腎功能有兩種常用指標：eGFR（CKD-EPI）用來分期，要靠計算工具；CrCl（Cockcroft–Gault）可以手算。兩個都來試試！','Two common measures: eGFR (CKD-EPI) for staging — needs a calculator tool; CrCl (Cockcroft–Gault) — you can do by hand. Let\'s try both!','ดัชนีการทำงานของไตที่ใช้บ่อยมี 2 แบบ: eGFR (CKD-EPI) ใช้แบ่งระยะ ต้องใช้เครื่องคิด และ CrCl (Cockcroft–Gault) คิดมือได้ ลองทั้งสองแบบเลย!']); hideText();
  const e=await calcPanel(CALC_EGFR); const eg=Math.round(e.r); S.calc.egfr={ok:e.ok, tries:e.tries, value:eg};
  const c=await choose([{t:['G2（60–89）','G2 (60–89)','G2 (60–89)']},{t:['G3a（45–59）','G3a (45–59)','G3a (45–59)']},{t:['G3b（30–44）','G3b (30–44)','G3b (30–44)']},{t:['G4（15–29）','G4 (15–29)','G4 (15–29)']},{t:['G5（< 15）','G5 (< 15)','G5 (< 15)']}],
    {timer:20, id:'ckdStage', label:[`eGFR ≈ ${eg}：慢性腎臟病第幾期？`,`eGFR ≈ ${eg}: which CKD stage?`,`eGFR ≈ ${eg}: โรคไตเรื้อรังระยะไหน?`]});
  S.mr.egfr=c===1&&e.ok; logEvent({type:'egfr', pick:c, ok:c===1, value:eg});
  if(c===1){ await splash('gotcha','gold','slam'); await say('yeh','happy',[`沒錯！eGFR 約 ${eg}，是 CKD 第 3a 期（G3a）。`,`Exactly! eGFR about ${eg} — CKD stage 3a (G3a).`,`ถูกต้อง! eGFR ประมาณ ${eg} คือ CKD ระยะ 3a (G3a)`]); }
  else await say('yeh','think',[`eGFR 約 ${eg}，落在 45–59，是 CKD 第 3a 期（G3a）。`,`eGFR about ${eg} falls in 45–59 — CKD stage 3a (G3a).`,`eGFR ประมาณ ${eg} อยู่ในช่วง 45–59 คือ CKD ระยะ 3a (G3a)`]);
  const q=await choose([{t:['年長、個子小的女性肌肉少，「正常」的 Cr 可能掩蓋腎功能下降','Petite older women have little muscle, so a "normal" Cr can hide weak kidneys','หญิงสูงวัยตัวเล็กกล้ามเนื้อน้อย Cr ที่ "ปกติ" จึงอาจซ่อนไตที่เสื่อมได้']},{t:['一定是檢驗室算錯了——只要肌酸酐落在參考值內，腎臟功能就一定正常','The lab must have made a mistake — a normal creatinine always means normal kidneys','แล็บต้องคำนวณผิดแน่ ครีเอตินินปกติก็แปลว่าไตปกติเสมอ']},{t:['eGFR 公式只適用男性，女性直接看肌酸酐數值就好','eGFR formulas only work for men; for women, just read the creatinine value','สูตร eGFR ใช้ได้แค่กับผู้ชาย สำหรับผู้หญิงให้ดูแค่ค่าครีเอตินินอย่างเดียวก็พอแล้ว']}],
    {timer:20, shuffle:true, id:'crTrap', label:['她的 Cr 1.2 明明在參考值內（0.64–1.27），為什麼 eGFR 只有約 52？','Her Cr of 1.2 is inside the reference range (0.64–1.27) — so why is her eGFR only about 52?','Cr 1.2 ของป้าอยู่ในค่าอ้างอิง (0.64–1.27) แท้ๆ ทำไม eGFR ถึงเหลือแค่ราว 52?']});
  S.calc.crTrap=q===0; logEvent({type:'crTrap', pick:q, ok:q===0}); if(q===0) sfx.get(); else sfx.error();
  await say('yeh',q===0?'happy':'think',[`${q===0?'對！':''}肌酸酐來自肌肉。61 歲、53 公斤的女性，1.2 已經代表腎臟只剩大約一半的功能。千萬不要只看「在參考值內」就說腎臟沒問題！`,`${q===0?'Right! ':''}Creatinine comes from muscle. In a 61-year-old, 53-kg woman, 1.2 already means her kidneys work at roughly half speed. Never call the kidneys fine just because creatinine is "within range"!`,`${q===0?'ถูกต้อง! ':''}ครีเอตินินมาจากกล้ามเนื้อ ผู้หญิงอายุ 61 หนัก 53 กิโล ค่า 1.2 ก็แปลว่าไตทำงานเหลือราวครึ่งเดียวแล้ว อย่าตัดสินว่าไตปกติเพียงเพราะครีเอตินิน "อยู่ในค่าอ้างอิง"!`]);
  hideText();
  const k=await calcPanel(CALC_CRCL); const cr=k.r; S.calc.crcl={ok:k.ok, tries:k.tries, value:+cr.toFixed(1), wt:k.v.wt};
  await say('yeh','happy',[`CrCl ≈ ${cr.toFixed(0)} mL/min。她的實際體重（53 kg）和理想體重（約 50.6 kg）差不多，直接用實際體重就可以。`,`CrCl ≈ ${cr.toFixed(0)} mL/min. Her actual weight (53 kg) is close to her ideal weight (about 50.6 kg), so actual weight is fine here.`,`CrCl ≈ ${cr.toFixed(0)} mL/min น้ำหนักจริงของป้า (53 กก.) ใกล้เคียงน้ำหนักในอุดมคติ (ราว 50.6 กก.) จึงใช้น้ำหนักจริงได้เลย`]);
  await say('yeh','smug',['整理：eGFR ≈ 52（G3a）用來分期，metformin 的仿單看 eGFR（45–59 可續用、要監測）；很多劑量表——例如 alendronate（CrCl < 35 不建議）——用的是 CrCl。她的 CrCl ≈ 41，離 35 不遠，傷腎的 NSAID 更要避免！','To sum up: eGFR ≈ 52 (G3a) is for staging, and the metformin label uses eGFR (45–59: continue with monitoring); many dosing references — e.g. alendronate (not recommended below CrCl 35) — use CrCl. Her CrCl ≈ 41 isn\'t far from 35, so kidney-harming NSAIDs are all the more a no-go!','สรุป: eGFR ≈ 52 (G3a) ใช้แบ่งระยะ และฉลากยา metformin ใช้ eGFR (45–59 ใช้ต่อได้แต่ต้องติดตาม) ส่วนแหล่งอ้างอิงขนาดยาหลายตัว เช่น alendronate (ไม่แนะนำเมื่อ CrCl < 35) ใช้ CrCl · CrCl ของป้า ≈ 41 ไม่ห่างจาก 35 เท่าไร ยิ่งต้องเลี่ยง NSAID ที่ทำร้ายไต!']);
}
async function chapter4(){
  S.chStart=realSec(); hideAll(); playTheme('tense'); S.medsSeen=true;
  await chapterCard(4);
  show('me','L','neutral'); show('yeh','R','smug');
  const missing=['endo_bag','hospB_bag','report'].filter(k=>!hasEv(k));
  if(missing.length){ show('wife','C','happy'); await say('wife','happy',['這些也是她的藥袋和報告，我都找出來了，你們一起看吧！','I found the rest of her med bags and the report — please take a look!','ลุงเจอซองยากับผลตรวจที่เหลือของเขาแล้ว ดูด้วยกันเลย!']); missing.forEach(k=>{ S.evidence.push(k); if(ITEMS[k].labs) S.notes.labsUnlocked=true; }); logEvent({type:'autoBags', items:missing}); hide('wife'); }
  S.notes.labsUnlocked=true;
  await say('yeh','smug',['最後一塊拼圖：把所有藥袋和檢驗報告攤開來，做「藥物整合」——這才是藥師真正的戰場！','The last piece of the puzzle: lay out every med bag and lab report and reconcile them — this is a pharmacist\'s real battlefield!','จิ๊กซอว์ชิ้นสุดท้าย: กางซองยาและผลแล็บทั้งหมดแล้วทำ "การทบทวนยา" นี่คือสนามรบจริงของเภสัชกร!']);
  await kidneyTask();
  reveal('P13');
  if(S.fl.kidney&&!EXAM()) await say('yeh','happy',['你在訪談時就問了腎臟的事——很有遠見！','You asked about her kidneys back in the interview — great foresight!','คุณถามเรื่องไตตั้งแต่ตอนสัมภาษณ์ — มองการณ์ไกลมาก!']);
  await say('yeh','angry',['可是看看這 9 種藥……三個來源，沒有一位醫師把它們放在一起看過，也沒有人依腎功能檢視！','But look at these 9 drugs… three sources, nobody has ever looked at them together, and nobody has checked them against her kidneys!','แต่ดูยา 9 ตัวนี้สิ… สามแหล่ง ไม่เคยมีหมอคนไหนดูรวมกัน และไม่มีใครทบทวนตามการทำงานของไตเลย!']);
  await say('pilly','shock',['藥袋危機！一共 6 個任務：點選有問題的藥（可以複選），再按「確認診斷」！','Med-bag crisis! 6 missions: tap the problem drugs (several may apply), then press "Confirm"!','วิกฤตซองยา! มี 6 ภารกิจ: แตะเลือกยาที่มีปัญหา (เลือกได้หลายตัว) แล้วกด "ยืนยัน"!']);
  for(let i=0;i<MISSIONS.length;i++){
    if(S.visit<=0){ S.fl.mrCut=i; break; }
    const m=MISSIONS[i]; hideAll(); hideText();
    const r=await missionUI(m,i,MISSIONS.length);
    S.mr.ans.push({id:m.id, sel:r.sel, perfect:r.perfect, partial:r.partial}); logEvent({type:'medrev', m:m.id, sel:r.sel, perfect:r.perfect, partial:r.partial});
    if(r.perfect) S.mr.perfect++; else if(r.partial) S.mr.partial++; else { S.mr.wrong++; spend(CONFIG.COST_WRONG); }
    if(EXAM()){ sfx.select(); toast(T('examNoted')); }
    else if(r.perfect) splash('perfect','gold','crit'); else if(r.partial){ sfx.hit(); toast('🔸 '+T('partial')); } else { sfx.error(); toast('❌ '+T('wrongDx')); }
    m.ans.forEach(id=>{ (S.mr.tags[id]=S.mr.tags[id]||[]).push(L(m.tag)); });
    await sleep(EXAM()?900:2300); $('#medrev').classList.add('hidden');
    if(!EXAM()){ show('yeh','R', r.perfect?'happy':r.partial?'think':'sad'); show('me','L','neutral');
      for(const x of m.x) await say('yeh','neutral',x); }
    reveal(m.p);
  }
  hideAll(); show('chen','C','sad'); show('me','L','neutral'); show('yeh','R','smug');
  await say('chen','shock',['原、原來我吃的藥有這麼多問題……難怪又累、又沒胃口、頭又一直痛……','S-so my medicines had this many problems… no wonder I\'m tired, have no appetite and keep getting headaches…','ยะ…ยาที่ป้ากินมีปัญหาเยอะขนาดนี้เลยเหรอ… มิน่าถึงเหนื่อย ไม่อยากกินข้าว แล้วก็ปวดหัวตลอด…']);
  await say('yeh','smug',['別擔心，我們會把這些整理成「藥事照護建議」交給您的醫師。不過在那之前……','Don\'t worry — we\'ll write all this into a pharmaceutical care report for your doctors. But before that…','ไม่ต้องห่วง เราจะสรุปทั้งหมดเป็นข้อเสนอแนะให้แพทย์ของป้า แต่ก่อนอื่น…']);
  chapterDone(4);
}

 {"p":"P2","m":["發抖冒冷汗？吃幾顆糖就好了，不用跟醫師說！","Shaky and sweaty? A few candies fix it — no need to tell the doctor!","มือสั่นเหงื่อแตก? กินลูกอมสักสองสามเม็ดก็หาย ไม่ต้องบอกหมอ!"],"c":[[2,["吃糖是對的，但 15 分鐘後要再測；早餐不能省，反覆低血糖一定要讓醫師調整藥物。", "Candy is right for now — but recheck after 15 minutes, don't skip breakfast, and repeated hypos mean the doctor must adjust the drugs.", "กินลูกอมถูกแล้ว แต่ต้องวัดซ้ำหลัง 15 นาที ห้ามอดมื้อเช้า และถ้าน้ำตาลต่ำซ้ำๆ ต้องให้หมอปรับยา"]],[1,["低血糖很危險，下次手一發抖就多吃幾顆糖果，兩三顆一起吃，坐著等手不抖就好。", "Hypos are dangerous — next time eat more candy, two or three at once, and sit down until the shaking stops.", "น้ำตาลต่ำอันตรายนะ ครั้งหน้ามือสั่นเมื่อไหร่ก็กินลูกอมสองสามเม็ดพร้อมกันเลย แล้วนั่งพักรอจนมือหายสั่น"]],[0,["發抖代表血糖太高，再多吃一顆降血糖藥，多喝水就會好。", "Shaking means your sugar is too HIGH — take an extra diabetes pill and drink plenty of water.", "มือสั่นแสดงว่าน้ำตาลสูงเกิน กินยาเบาหวานเพิ่มอีกเม็ดแล้วดื่มน้ำเยอะๆ"]]],"x":["低血糖先吃 15–20 g 的糖（3–4 顆糖果、半杯果汁或葡萄糖錠），15 分鐘後再測；反覆低血糖代表藥物要調整，不是靠糖果撐。","Treat a hypo with 15–20 g of sugar (3–4 candies, half a cup of juice or glucose tablets) and recheck after 15 minutes; repeated hypos mean the drugs need changing — not more candy.","แก้น้ำตาลต่ำด้วยน้ำตาล 15–20 ก. (ลูกอม 3–4 เม็ด น้ำผลไม้ครึ่งแก้ว หรือเม็ดกลูโคส) แล้ววัดซ้ำหลัง 15 นาที ถ้าน้ำตาลต่ำซ้ำๆ แปลว่าต้องปรับยา ไม่ใช่พึ่งลูกอม"]},
 {"p":"P1","m":["多看幾家醫院比較保險啦！","Seeing lots of hospitals is safer!","ไปหลายโรงพยาบาลปลอดภัยกว่า!"],"c":[[2,["固定一位家庭醫師，看診時帶健保卡和用藥清單，就能避免重複檢查和重複用藥。","Stick with one family doctor and bring your NHI card and medicine list — that prevents duplicate tests and duplicate drugs.","มีหมอประจำคนเดียว พกบัตรประกันและรายการยาไปทุกครั้ง จะช่วยกันการตรวจซ้ำและยาซ้ำได้"]],[1,["多看幾家也可以，只要每次都跟醫生說「我在別家也有拿藥」，醫生就會幫您注意。","Seeing several is okay, as long as you tell every doctor \"I also get medicine elsewhere\" — then they'll watch out for you.","ไปหลายที่ก็ได้ ขอแค่บอกหมอทุกครั้งว่า \"ได้ยาจากที่อื่นด้วย\" หมอก็จะช่วยระวังให้เอง"]],[0,["醫院和診所各有專長，每個症狀都找不同專科，雖然跑得比較多，但治得最快。","Hospitals and clinics each have specialties — see a different specialist for every symptom. More trips, but the fastest cure.","โรงพยาบาลกับคลินิกต่างก็มีความเชี่ยวชาญ อาการไหนก็ไปหาหมอเฉพาะทาง ถึงเดินทางเยอะแต่หายเร็วที่สุด"]]],"x":["健保雲端藥歷可以讓醫師看到所有用藥，固定醫師能整合全部問題，也省下掛號費和車錢。","The NHI cloud record shows doctors every medicine; a regular doctor can integrate all your problems — and it saves registration fees and fares.","ประวัติยาบนคลาวด์ช่วยให้หมอเห็นยาทั้งหมด แพทย์ประจำช่วยดูแลทุกปัญหาแบบองค์รวม และยังประหยัดค่าลงทะเบียนกับค่ารถ"]},
 {"p":"P13","m":["我的肌酸酐正常，腎臟一定沒問題！","My creatinine is normal, so my kidneys are fine!","ครีเอตินินของป้าปกติ ไตต้องไม่มีปัญหาแน่!"],"c":[[2,["您個子小，Cr 1.2 代表腎功能只剩約一半。Ponstan 這類傷腎的藥要停，我們會告訴醫師。", "You're petite, so Cr 1.2 means your kidneys work at about half speed. Ponstan should stop; we'll tell your doctor.", "ป้าตัวเล็ก Cr 1.2 แปลว่าไตทำงานเหลือราวครึ่งเดียว ยาทำร้ายไตอย่าง Ponstan ควรหยุด เราจะแจ้งหมอให้"]],[1,["腎功能只是差了一點點，以後每天多喝三千 cc 的白開水把腎臟沖乾淨，所有的藥都照原本的繼續吃。", "Your kidneys are a little weak — drink three litres of water a day to flush them out, and keep every medicine the same.", "ไตไม่ค่อยดีนิดหน่อยเท่านั้น ต่อไปดื่มน้ำเปล่าวันละสามลิตรเพื่อล้างไตให้สะอาด ส่วนยาทุกตัวก็กินเหมือนเดิมต่อไปได้เลย"]],[0,["數字正常就是腎臟健康，止痛藥想吃就吃，明年再驗一次就好。", "A normal number means healthy kidneys — take painkillers whenever you like, and check again next year.", "ตัวเลขปกติแปลว่าไตแข็งแรง ยาแก้ปวดอยากกินก็กิน ปีหน้าค่อยตรวจใหม่"]]],"x":["肌酸酐受肌肉量影響；評估腎功能要算 eGFR／CrCl，並依此檢視藥物。","Creatinine depends on muscle mass — always calculate eGFR/CrCl and review drugs against it.","ครีเอตินินขึ้นกับมวลกล้ามเนื้อ ต้องคำนวณ eGFR/CrCl เสมอ และทบทวนยาตามค่านั้น"]},
 {"p":"P6","m":["配咖啡、配白開水，還不是都一樣吞下去！","Coffee or water — it all goes down the same way!","กินกับกาแฟหรือน้ำเปล่า ก็กลืนลงไปเหมือนกันนั่นแหละ!"],"c":[[2,["一週一次，起床空腹配一大杯白開水，之後 30 分鐘保持直立、什麼都不吃不喝。", "Once a week on waking: empty stomach, a full glass of plain water, then stay upright with nothing else for 30 min.", "สัปดาห์ละครั้งตอนตื่นนอน ท้องว่าง กับน้ำเปล่าแก้วใหญ่ แล้วตัวตรง ไม่กินอะไรอีก 30 นาที"]],[1,["咖啡確實會影響藥的吸收，那就改配一大杯溫牛奶一起吃，比較不傷胃，還能順便補充鈣質。", "Coffee does affect absorption — take it with a glass of milk instead, which is gentler on the stomach and adds calcium.", "กาแฟมีผลต่อการดูดซึมยาจริง งั้นเปลี่ยนไปกินกับนมอุ่นแก้วใหญ่แทน ไม่กัดกระเพาะ แถมยังได้แคลเซียมเพิ่มอีกด้วย"]],[0,["怕傷胃的話，就睡前配點心吃，吃完馬上躺下睡，就不會覺得不舒服。", "If it bothers your stomach, take it at bedtime with a snack and lie down straight away so you sleep through it.", "ถ้ากลัวกัดกระเพาะ ก็กินก่อนนอนพร้อมขนม แล้วนอนเลยจะได้ไม่รู้สึกไม่สบาย"]]],"x":["牛奶裡的鈣、咖啡和食物都會讓 alendronate 幾乎不吸收；吃完躺下會增加食道潰瘍風險。","Calcium in milk, coffee and food all block alendronate absorption; lying down afterwards raises the risk of oesophageal ulcers.","แคลเซียมในนม กาแฟ และอาหาร ทำให้ alendronate แทบไม่ดูดซึม การนอนลงหลังกินยาเพิ่มความเสี่ยงแผลในหลอดอาหาร"]},
 {"p":"P9","m":["感冒、腰痛又不嚴重，藥拿了丟掉就好。","Colds and back pain aren't serious — collect the pills and toss them.","หวัดกับปวดหลังไม่หนัก รับยามาแล้วทิ้งก็ได้"],"c":[[2,["用不到的藥請醫生別開，剩藥拿回藥局；背痛還變矮，要請醫師照 X 光。", "Ask the doctor not to prescribe what you won't take, return leftovers to a pharmacy — and get that back pain X-rayed.", "บอกหมอว่าไม่ต้องจ่ายยาที่ไม่ได้ใช้ เอายาเหลือคืนร้านยา และให้หมอเอกซเรย์อาการปวดหลัง"]],[1,["不想吃也不用勉強，但藥不要丟垃圾桶，拿去藥局回收，對環境比較好。", "No need to force yourself, but don't throw medicine in the bin — take it back to a pharmacy; it's better for the environment.", "ไม่อยากกินก็ไม่ต้องฝืน แต่อย่าทิ้งยาลงถังขยะ เอาไปคืนร้านยาจะดีต่อสิ่งแวดล้อมกว่า"]],[0,["腰痛只是做工太累而已，藥先留著別丟，痛的時候一次多吃幾顆，效果會比較快。", "Back pain is just work strain — keep the pills and take a few extra at once when it hurts, so they act faster.", "ปวดหลังแค่เพราะทำงานหนักเกินไป เก็บยาไว้ก่อนอย่าเพิ่งทิ้ง เวลาปวดค่อยกินทีละหลายเม็ดจะได้ผลเร็วกว่า"]]],"x":["骨鬆病人新出現的背痛要排除脊椎骨折；止痛藥一次多吃會傷胃傷腎。","New back pain in osteoporosis must be checked for a vertebral fracture; doubling painkillers harms the stomach and kidneys.","ผู้ป่วยกระดูกพรุนที่ปวดหลังขึ้นใหม่ต้องตรวจแยกกระดูกสันหลังหัก และการกินยาแก้ปวดเกินขนาดทำร้ายกระเพาะกับไต"]},
 {"p":"P4","m":["忙的時候不吃飯，省時間又省錢！","When I'm busy I skip meals — saves time and money!","ยุ่งๆ ก็ไม่กินข้าว ประหยัดทั้งเวลาทั้งเงิน!"],"c":[[2,["吃降血糖藥不吃飯最容易低血糖。饅頭、雞蛋、豆漿就夠了；沒吃飯那餐就不吃 acarbose。", "Diabetes pills without meals cause hypos. A quick bun, egg and soy milk will do — and no meal, no acarbose.", "อดข้าวแต่กินยาเบาหวานเสี่ยงน้ำตาลต่ำ ซาลาเปา ไข่ น้ำเต้าหู้ก็พอ มื้อไหนไม่กินก็งด acarbose"]],[1,["盡量三餐都吃；早上真的來不及的話，去便利商店買個甜麵包或一瓶含糖飲料墊一下肚子也可以。", "Try to eat three meals; if you're rushed, a sweet bun or a sugary drink from the convenience store will tide you over.", "พยายามกินให้ครบสามมื้อ ถ้าเช้าไหนรีบจริงๆ ก็แวะซื้อขนมปังหวานหรือน้ำหวานจากร้านสะดวกซื้อมารองท้องไปก่อนก็ได้"]],[0,["沒吃飯也要照時間把降血糖藥吃完，這樣才不會忘記。", "Even when you skip a meal, take every diabetes pill on schedule — that's the only way not to forget them.", "ถึงไม่ได้กินข้าวก็ต้องกินยาเบาหวานให้ครบตามเวลา จะได้ไม่ลืม"]]],"x":["規律進食是避免低血糖的基礎，也能提供骨頭需要的蛋白質和鈣。","Regular meals are the foundation for avoiding hypos — and they supply the protein and calcium bones need.","การกินอาหารให้เป็นเวลาเป็นพื้นฐานของการป้องกันน้ำตาลต่ำ และให้โปรตีนกับแคลเซียมที่กระดูกต้องการ"]},
 {"p":"P10","m":["會累就是老了，買補品吃就好！","Tired? That's just age — buy some supplements!","เหนื่อยก็เพราะแก่ ซื้ออาหารเสริมกินก็พอ!"],"c":[[2,["疲倦、沒胃口可能來自低血糖、降血糖藥或沒吃飯，請醫師幫您抽血檢查。", "Tiredness and no appetite can come from hypos, the diabetes pills or skipped meals — let's ask for blood tests.", "เหนื่อยและเบื่ออาหารอาจมาจากน้ำตาลต่ำ ยาเบาหวาน หรือการอดข้าว ควรให้หมอเจาะเลือดตรวจ"]],[1,["應該是最近太累了，多休息、早點睡、三餐正常吃，過一兩個禮拜就會好轉了。","You're probably just worn out lately — rest more, sleep earlier and eat regular meals; it should pass in a week or two.","คงเหนื่อยสะสมช่วงนี้ พักเยอะๆ นอนเร็วขึ้น กินข้าวให้ตรงเวลา อีกสักสัปดาห์สองสัปดาห์ก็ดีขึ้น"]],[0,["這是體虛，買人蔘和雞精來補比吃藥自然安全，也不會和您現在的藥起衝突。","That's just weakness — ginseng and chicken essence are more natural than medicine and won't clash with your pills.","แค่ร่างกายอ่อนแอ ซื้อโสมกับซุปไก่สกัดมาบำรุง ธรรมชาติกว่ายาและไม่ตีกับยาที่กินอยู่"]]],"x":["症狀可能是多個問題交互造成，需要系統性評估；補品也可能和藥物交互作用，還會加重家裡的負擔。","Symptoms may come from several interacting problems; supplements can interact with medicines too — and strain the family budget.","อาการอาจเกิดจากหลายปัญหาร่วมกัน อาหารเสริมก็อาจตีกับยา แถมยังเพิ่มภาระค่าใช้จ่ายของครอบครัว"]},
 {"p":"P12","m":["在工廠站一整天，就是運動了啦！","Standing at the factory all day IS exercise!","ยืนทำงานในโรงงานทั้งวันก็คือออกกำลังกายแล้ว!"],"c":[[2,["站著不等於運動。飯後散步 10 分鐘，再做坐站練習和踮腳尖，顧骨頭也防跌倒。", "Standing isn't exercise. Walk 10 minutes after meals and add sit-to-stands and heel raises for bones and balance.", "ยืนทำงานไม่ใช่การออกกำลังกาย เดินหลังอาหาร 10 นาที เพิ่มท่าลุกนั่งและเขย่งเท้า ช่วยกระดูกและการทรงตัว"]],[1,["那就每天上班前去跑步一小時，高強度、高衝擊的運動最能刺激骨頭，很快就會練強壯。", "Then go jogging for an hour every morning before work — hard, high-impact running builds strong bones in no time.", "งั้นตื่นมาวิ่งทุกเช้าก่อนไปทำงานวันละหนึ่งชั่วโมงเลย การวิ่งหนักๆ ที่มีแรงกระแทกสูงจะช่วยให้กระดูกแข็งแรงเร็วที่สุด"]],[0,["骨質疏鬆最安全就是少動，在家多休息，才不會又骨折。", "With osteoporosis it's safest not to move much at all — rest at home so you don't break another bone.", "กระดูกพรุนปลอดภัยที่สุดคือขยับให้น้อย พักอยู่บ้าน จะได้ไม่หักอีก"]]],"x":["骨鬆病人適合循序漸進的負重、肌力與平衡運動；突然激烈運動或完全不動都不好。","People with osteoporosis need gradual weight-bearing, strength and balance exercise; sudden intense exercise and total rest are both harmful.","ผู้ป่วยกระดูกพรุนควรออกกำลังแบบลงน้ำหนัก เสริมกล้ามเนื้อ และฝึกการทรงตัวอย่างค่อยเป็นค่อยไป การออกกำลังหนักทันทีหรือไม่ขยับเลยล้วนไม่ดี"]}
];

/* ---------------- Results ---------------- */
function rankGate(){
  const found=foundCount(), tb=!!S.finalCov[1], fu=!!S.finalCov[2];
  const list=[['g_found',found===PROBLEMS.length],['g_hints',S.hints===0],['g_tb',tb],['g_trust',S.trust>=7],['g_mr',S.mr.perfect>=5],['g_boss',!mythsAlive().length],['g_time',!S.timeout&&S.visit>=0]];
  const gate=list.every(x=>x[1])?'S':(found>=17&&S.mr.perfect>=4&&(tb||fu)&&!S.timeout)?'A':found>=14?'B':found>=10?'C':'D';
  return {gate, list};
}
function computeScore(){
  const B=S.boss, bonus=Object.keys(ITEMS).filter(k=>!ITEMS[k].req&&hasEv(k)).length, cov=S.finalCov.filter(Boolean).length;
  let sc=1000+Math.max(0,S.visit)*15+Math.min(0,S.visit)*20+S.hearts*80+S.trust*40+B.crit*120+B.ok*40-B.miss*60+B.maxCombo*20+bonus*60-S.hints*80-S.resets*200+cov*60-S.wrong*20
    -mythsAlive().length*150+(B.byFinal||[]).length*60
    +S.mr.perfect*150+S.mr.partial*60-S.mr.wrong*40+(S.mr.egfr?100:0)
    +(S.custom?S.custom.score:0)+(S.first&&S.first.ok?100:0)+(S.calc.bmi&&S.calc.bmi.ok?60:0)+(S.calc.bmiClass?30:0)+(S.calc.crcl&&S.calc.crcl.ok?80:0)+(S.calc.crTrap?40:0)
    +FOLLOW1.filter(f=>S.asked[f.id]).length*25+S.hiddenQ.length*40+(S.fl.adh?60:0)-(S.refused?150:0)-(S.timeout?300:0);
  const rt=realSec(); if(rt<25*60) sc+=200; else if(rt<35*60) sc+=100;
  const RK='SABCD', scoreRank=sc>=4600?'S':sc>=3800?'A':sc>=3000?'B':sc>=2200?'C':'D', g=rankGate();
  S.score=Math.round(sc); S.rank=RK[Math.max(RK.indexOf(scoreRank),RK.indexOf(g.gate))]; S.gate={score:scoreRank, cap:g.gate, list:g.list.map(([k,v])=>({k,ok:v}))};
  return {bonus,cov,scoreRank,g};
}

/* ---------- text catalog: every [中文, English, ไทย] line in this file ---------- */
let TEXT_CAT=null;
function buildTextCatalog(){
  if(TEXT_CAT) return TEXT_CAT;
  const src=__SELF_HTML, A=s=>s.replace('|','');
  const anchors=[['const |UI = {','ui'],['const |CHAR_INFO','chars'],['const |ITEMS = {','items'],['const |KEY_ITEMS','final'],['const |IMG={','skip'],['MEDIA.|labImages=','case'],['const |INTENTS','skip'],
    ['const |HOTSPOTS','ch2'],['const |S = {','sys'],['function |ckdEpi2021','calc'],['async function |prologue','prologue'],['const |TOPICS1','ch1'],['function |camReset','ch2'],['const |TESTI','ch3'],
    ['const |SRC','ch4'],['const |MYTHS','ch5'],['async function |timeoutEnd','epi'],['function |rankGate','results'],['const |ED={','skip'],['const |P={cur','pages']]
    .map(([a,c])=>[src.indexOf(A(a)),c]).filter(x=>x[0]>=0).sort((a,b)=>a[0]-b[0]);
  const rx=/\[\s*('(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*"|`(?:[^`\\]|\\.)*`)\s*,\s*('(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*"|`(?:[^`\\]|\\.)*`)\s*,\s*('(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*"|`(?:[^`\\]|\\.)*`)\s*\]/g;
  const ev=s=>{ if(s[0]==='`'){ s=s.replace(/\$\{nm\(\)\}/g,'{name}'); if(s.includes('${')) return null; } try{ return Function('"use strict";return ('+s+');')(); }catch(e){ return null; } };
  const out=[], seen=new Set(); let m;
  while((m=rx.exec(src))){
    let cat='other'; for(const [pos,c] of anchors){ if(pos<=m.index) cat=c; else break; } if(cat==='skip') continue;
    const v=[ev(m[1]),ev(m[2]),ev(m[3])]; if(v.some(x=>typeof x!=='string')) continue;
    if(!/[㐀-鿿]/.test(v[0])&&!/[฀-๿]/.test(v[2])) continue; if(seen.has(v[0])) continue; seen.add(v[0]);
    const pre=src.slice(Math.max(0,m.index-50),m.index); const sp=(pre.match(/'(chen|wife|yeh|me|pilly|sys)'\s*,\s*[^,]{1,40},\s*$/)||[])[1]||(/\bt:\s*$/.test(pre)?'choice':'');
    out.push({k:v[0], v, c:cat, w:sp});
  }
  return TEXT_CAT=out;
}

/* ---------- graphics quality: auto (measures FPS) · high · light ---------- */
const GFX={pref:(()=>{ try{ return localStorage.getItem('phd_gfx')||'auto'; }catch(e){ return 'auto'; } })(), autoLow:false, low:false, bad:0};
function applyGfx(){ GFX.low=GFX.pref==='low'||(GFX.pref==='auto'&&GFX.autoLow); const st=$('#stage'); st.classList.toggle('lowfx',GFX.low);
  if(GFX.low){ st.style.setProperty('--px',0); st.style.setProperty('--py',0); }
  const b=$('#gfxBtn'); if(b) b.textContent='🎨 '+T('gfx')+': '+T('gfx_'+GFX.pref)+(GFX.pref==='auto'?` (${T(GFX.low?'gfx_low':'gfx_high')})`:''); }
function setGfx(pref){ GFX.pref=pref; try{ localStorage.setItem('phd_gfx',pref); }catch(e){} if(pref==='auto'){ GFX.autoLow=false; GFX.bad=0; } applyGfx(); }
function fpsProbe(ms){ return new Promise(res=>{ let n=0; const t0=performance.now(); const f=()=>{ n++; const dt=performance.now()-t0; if(dt<ms) requestAnimationFrame(f); else res(n*1000/dt); }; requestAnimationFrame(f); }); }
async function gfxWatch(){
  try{ if(navigator.deviceMemory&&navigator.deviceMemory<=2) GFX.autoLow=true; }catch(e){}
  applyGfx(); await sleep(1500);
  while(true){ if(GFX.pref==='auto'&&!GFX.autoLow&&!document.hidden){ const fps=await fpsProbe(2000);
      if(fps<34){ GFX.bad++; if(GFX.bad>=2){ GFX.autoLow=true; applyGfx(); toast('🎨 '+T('gfxAutoLow')); } } else GFX.bad=0; }
    await sleep(5000); }
}

function resizeImage(file,max){ return new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=im.width*k; c.height=im.height*k; c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.82)); }; im.onerror=()=>res(null); im.src=fr.result; }; fr.readAsDataURL(file); }); }

  $('#btnResume').onclick=()=>resumeGame(r); $('#btnDiscard').onclick=()=>{ clearResume(); sfx.click(); renderResume(); }; }
async function resumeGame(r){
  sfx.select(); await audioStart(); Object.assign(S, r.S); S.profile=new Set(r.S.profile||[]); S.t0=Date.now()-r.elapsed*1000; S.chStart=realSec(); S.done=false;
  applyI18n(); applyAudio(); applyMotion(); $('#title').classList.add('hidden'); $('#hud').classList.remove('hidden'); hud();
  logEvent({type:'resume', step:r.step}); saveSession(true);
  if(r.step>=2) await wipe(()=>{ setBg('liv'); hideAll(); hideText(); });
  toast(T('resumed')); playTheme('calm'); await runSteps(r.step);
}
async function startGame(){
  const name=$('#inName').value.trim(), sid=$('#inSid').value.trim();
  if(!name||!sid){ toast(T('nameNeeded')); (name?$('#inSid'):$('#inName')).focus(); return; }
  if(loadResume()&&!startGame.ok){ showModal(`<h3>${T('startNew')}</h3><p>${T('resumeNewQ')}</p>`,[{t:T('startNew'),cls:'r',fn:()=>{ clearResume(); startGame.ok=true; startGame(); }},{t:T('cancel'),cls:''}]); return; }
  await audioStart(); S.qte=$('#qteToggle').checked;
  S.student={name,sid}; S.sessionId='PD'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); S.created=new Date().toISOString(); S.t0=Date.now();
  $('#title').classList.add('hidden'); $('#hud').classList.remove('hidden'); hud(); logEvent({type:'start', qte:S.qte, avatar:S.avatar, gender:S.gender, mode:S.mode, view:VIEW.fp?'fp':'tp'}); saveSession(true);
  clearResume(); await runSteps(0);
}
function bindUI(){
  addEventListener('resize', scaleStage); scaleStage(); bindParallax();
  const st=$('#stage'); st.addEventListener('scroll',()=>{ st.scrollTop=0; st.scrollLeft=0; }); addEventListener('scroll',()=>{ if(scrollX||scrollY) scrollTo(0,0); });
  $$('.lbtn').forEach(b=>b.onclick=()=>{ audioStart(); setLang(b.dataset.lang); });
  $$('.gsel').forEach(b=>b.onclick=()=>{ S.avatar=b.dataset.av; S.gender=b.dataset.g; $$('.gsel').forEach(x=>x.classList.toggle('on',x===b)); renderTitleChars(); sfx.select(); });
  $('#btnStart').onclick=startGame; $('#inSid').onkeydown=e=>{ if(e.key==='Enter') startGame(); };
  $('#btnTeacher').onclick=()=>openPage('teacher');
  $$('.msel').forEach(b=>b.onclick=()=>{ if(MODE_FORCED) return; S.mode=b.dataset.mode; try{ localStorage.setItem('phd_mode',S.mode); }catch(e){} sfx.select(); renderModeRow(); });
  $('#btnBadges').onclick=showBadges; $('#btnChSel').onclick=showChapterSelect; $('#viewBtn').onclick=()=>{ setView(!VIEW.fp); sfx.click(); toast('👁 '+T('view')+': '+T(VIEW.fp?'view_fpL':'view_tpL')); }; $('#gfxBtn').onclick=()=>{ const o=['auto','high','low']; setGfx(o[(o.indexOf(GFX.pref)+1)%3]); sfx.click(); };
  $('#bCase').onclick=()=>openPage('case'); $('#bLog').onclick=showLog; $('#bMenu').onclick=()=>openPage('menu'); $('#pClose').onclick=closePage;
  $('#tbox').onclick=advance; $('#tEdit').onclick=e=>{ e.stopPropagation(); if(D.cur&&Array.isArray(D.cur.text)) openLineEditor(D.cur.text,()=>renderLine(false)); };
  $('#freeIn').onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); D.boardGo&&D.boardGo(); } };
  $('#inText').onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); D.inputGo&&D.inputGo(); } };
  addEventListener('keydown', e=>{
    if(modalOpen) return; const tag=(document.activeElement||{}).tagName||''; const typing=/INPUT|TEXTAREA/.test(tag);
    if(e.key==='Escape'&&P.cur){ closePage(); return; } if(P.cur||typing) return;
    if(e.key==='Escape'&&D.zoomed){ sfx.zoom(); camReset(); return; }
    if(D.introGo&&(e.key===' '||e.key==='Enter')){ e.preventDefault(); D.introGo(); return; }
    if(/^[1-4]$/.test(e.key)&&D.choiceFinish){ D.choiceFinish(+e.key-1); return; }
    if(D.testiAct&&e.key==='ArrowLeft'){ D.testiAct('prev'); return; } if(D.testiAct&&e.key==='ArrowRight'){ D.testiAct('next'); return; }
    if(e.key===' '||e.key==='Enter'){ if((!$('#getCard').classList.contains('hidden')||($('#epiBox')&&!$('#epiBox').classList.contains('hidden')))&&D.getOk){ e.preventDefault(); D.getOk(); return; }
      if(!$('#tbox').classList.contains('hidden')&&(D.typing||D.res)){ e.preventDefault(); advance(); } }
  });
  addEventListener('beforeunload', ()=>saveSession(true));
}
(async function main(){
  bindUI(); applyView(); showTitle(); gfxWatch();
  window.__PD__={S, D, CH, ED_ST, edWork, askCustom, MISSIONS, DRUGS, ZONES, reveal, addEvidence, openPage, startGame, advance, HOTSPOTS, onHotspot, zoomTo, camReset, computeScore, FOLLOW1, BADGES, DEFAULT_QUESTIONS, practiceChapter, epiOutcomes};
})();
</script>
